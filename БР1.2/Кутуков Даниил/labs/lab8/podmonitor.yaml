apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ehrmann-backend
  namespace: ehrmann-semester
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: ehrmann
      app.kubernetes.io/component: backend
  podMetricsEndpoints:
    - port: http
      path: /api/v1/metrics/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ehrmann-ml-core
  namespace: ehrmann-semester
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: ehrmann
      app.kubernetes.io/component: ml-core
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
