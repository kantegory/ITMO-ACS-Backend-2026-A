services:
  ehrmann-frontend:
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      VITE_API_BASEURL: "${EHRMANN_PUBLIC_ORIGIN:?Set EHRMANN_PUBLIC_ORIGIN}/api/v1"
  ehrmann-backend:
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: "${EHRMANN_PUBLIC_ORIGIN:?Set EHRMANN_PUBLIC_ORIGIN}"
