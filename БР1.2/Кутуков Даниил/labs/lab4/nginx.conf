map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ehrmann_frontend { server 127.0.0.1:13000; }
upstream ehrmann_backend { server 127.0.0.1:18000; }

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/ehrmann-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/ehrmann-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1024m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/v1/ {
        proxy_pass http://ehrmann_backend;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ehrmann_frontend;
    }
}
