{{- $tag := required "Specify images.tag with the published immutable tag" .Values.images.tag -}}
{{- $host := required "Specify host with the course environment FQDN" .Values.host -}}
{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  {{- if or (ne $name "backend") (not $.Values.autoscaling.enabled) }}
  replicas: 1
  {{- end }}
  {{- if eq $name "scheduler" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ if eq $name "indexer" }}60{{ else }}30{{ end }}
      {{- if eq $name "backend" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $name }}
      {{- end }}
      imagePullSecrets:
        - name: {{ $.Values.images.pullSecret }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.images.registry }}/{{ $component.image }}:{{ $tag }}"
          {{- with $component.command }}
          command: {{ toJson . }}
          {{- end }}
          resources:
            requests: {{ toJson $component.requests }}
            limits: {{ toJson $component.limits }}
          {{- if eq $name "frontend" }}
          env:
            - name: VITE_API_BASEURL
              value: "https://{{ $host }}/api/v1"
          {{- else }}
          envFrom:
            - secretRef:
                name: {{ if or (eq $name "ml-core") (eq $name "indexer") }}{{ $.Values.secrets.ml }}{{ else }}{{ $.Values.secrets.backend }}{{ end }}
          {{- end }}
          {{- if eq $name "backend" }}
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: {{ printf "https://%s" $host | quote }}
            - name: ML_HOST
              value: {{ printf "%s-ml-core" $.Release.Name | quote }}
            - name: ML_PORT
              value: "8000"
          {{- else if or (eq $name "ml-core") (eq $name "indexer") }}
          env:
            - name: ML_BACKEND_ORIGIN
              value: {{ printf "http://%s-backend:8000" $.Release.Name | quote }}
          {{- end }}
          {{- if $component.health }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          startupProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            timeoutSeconds: 3
          livenessProbe:
            {{- if eq $name "backend" }}
            tcpSocket: {port: http}
            {{- else }}
            httpGet: {path: {{ $component.health }}, port: http}
            {{- end }}
            timeoutSeconds: 3
            failureThreshold: 5
          {{- end }}
  {{- if $component.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - {name: http, port: {{ $component.port }}, targetPort: http}
  {{- end }}
{{- end }}
