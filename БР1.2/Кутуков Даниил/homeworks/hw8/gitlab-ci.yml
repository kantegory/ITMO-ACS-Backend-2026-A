workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "semester-vm" || $CI_COMMIT_BRANCH == "semester-cloud")'

include:
  - local: '/БР1.2/Кутуков Даниил/homeworks/hw6/deploy-vm.gitlab-ci.yml'

stages: [validate, build, deploy]

variables:
  REGISTRY_HOST: harbor.metamentor.pro
  IMAGE_REPOSITORY: harbor.metamentor.pro/ehrmann
  COURSE: 'БР1.2/Кутуков Даниил'

validate_python:
  stage: validate
  interruptible: true
  image: python:3.12-slim
  script:
    - python -m compileall -q backend ml_core

validate_chart:
  stage: validate
  interruptible: true
  image:
    name: alpine/helm:3.19.2
    entrypoint: [""]
  script:
    - helm lint "$COURSE/labs/lab7/chart" --set-string host=ehrmann-course.example.org --set-string images.tag=validate
    - helm lint "$COURSE/labs/lab7/chart" --set-string host=ehrmann-course.example.org --set-string images.tag=validate -f "$COURSE/labs/lab8/values-hpa.yaml"

build_images:
  stage: build
  interruptible: true
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "semester-vm" || $CI_COMMIT_BRANCH == "semester-cloud")'
  parallel:
    matrix:
      - COMPONENT: [backend, frontend, ml_core, qdrant]
  script:
    - printf '%s' "$HARBOR_PUSH_PASSWORD" | docker login "$REGISTRY_HOST" --username "$HARBOR_PUSH_USER" --password-stdin
    - IMAGE_TAG="${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - docker build --pull --tag "$IMAGE_REPOSITORY/$COMPONENT:$IMAGE_TAG" "$COMPONENT"
    - docker push "$IMAGE_REPOSITORY/$COMPONENT:$IMAGE_TAG"

deploy_selectel:
  stage: deploy
  image:
    name: alpine/helm:3.19.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "semester-cloud"'
  environment:
    name: semester/selectel
    url: https://$EHRMANN_CLOUD_HOST
  resource_group: ehrmann-semester-selectel
  script:
    - 'test -n "$KUBE_CONTEXT" && test -n "$EHRMANN_CLOUD_HOST"'
    - IMAGE_TAG="${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - apk add --no-cache curl
    - |
      helm upgrade --install ehrmann "$COURSE/labs/lab7/chart" \
        --kube-context "$KUBE_CONTEXT" --namespace ehrmann-semester \
        --set-string "images.registry=$IMAGE_REPOSITORY" --set-string "images.tag=$IMAGE_TAG" \
        --set-string "host=$EHRMANN_CLOUD_HOST" \
        --values "$COURSE/labs/lab8/values-hpa.yaml" --atomic --wait --timeout 12m
    - curl --fail --silent --show-error --retry 5 --retry-all-errors "https://$EHRMANN_CLOUD_HOST/api/v1/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
    - curl --fail --silent --show-error --output /dev/null "https://$EHRMANN_CLOUD_HOST/login"
