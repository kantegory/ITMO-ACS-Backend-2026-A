---
- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, rsync, python3]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set Moscow timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Europe/Moscow
    dest: /etc/localtime
    state: link
