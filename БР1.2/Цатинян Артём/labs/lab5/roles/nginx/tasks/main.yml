---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Configure nginx proxy
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/sites-available/restaurant-booking
    mode: '0644'
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/restaurant-booking
    dest: /etc/nginx/sites-enabled/restaurant-booking
    state: link
  notify: Reload nginx

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply nginx configuration before checks
  ansible.builtin.meta: flush_handlers
