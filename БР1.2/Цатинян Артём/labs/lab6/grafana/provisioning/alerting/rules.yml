apiVersion: 1
groups:
  - orgId: 1
    name: restaurant-health
    folder: Lab 6 Alerts
    interval: 30s
    rules:
      - uid: restaurant-service-down
        title: Restaurant service unavailable
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "A restaurant booking service is unavailable"
          description: "The HTTP check has been failing for at least one minute."
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: 'probe_success{job="services"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: '$B < 1'
              type: math
              refId: C
