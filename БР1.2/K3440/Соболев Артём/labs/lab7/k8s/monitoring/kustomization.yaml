apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - stack.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, alerts.yml]
  - name: blackbox-config
    files: [blackbox.yml]
  - name: loki-config
    files: [loki.yml]
  - name: alloy-config
    files: [config.alloy]
  - name: grafana-datasources
    files: [datasources.yml]
  - name: grafana-provider
    files: [provider.yml]
  - name: grafana-dashboard
    files: [dashboard.json]
secretGenerator:
  - name: alertmanager-config
    files: [alertmanager.yml=alertmanager.default.yml]
