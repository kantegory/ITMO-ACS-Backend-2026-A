apiVersion: v1
kind: Service
metadata: {name: alloy}
spec:
  selector: {app: alloy}
  ports:
    - {name: http, port: 12345, targetPort: 12345}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alloy}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: alloy}}
  template:
    metadata: {labels: {app: alloy}}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          args:
            - run
            - "--storage.path=/var/lib/alloy"
            - "/etc/alloy/config.alloy"
          ports:
            - {name: http, containerPort: 12345}
          resources: {requests: {cpu: "25m", memory: "64Mi"}, limits: {memory: "256Mi"}}
          volumeMounts:
            - {name: alloy-config, mountPath: "/etc/alloy", readOnly: true}
      volumes:
        - {name: alloy-config, configMap: {name: alloy-config}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data}
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: "2Gi"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:12.2.2
          args: []
          ports:
            - {name: http, containerPort: 3000}
          resources: {requests: {cpu: "25m", memory: "64Mi"}, limits: {memory: "768Mi"}}
          volumeMounts:
            - name: grafana-datasources
              mountPath: "/etc/grafana/provisioning/datasources"
              readOnly: true
            - name: grafana-provider
              mountPath: "/etc/grafana/provisioning/dashboards"
              readOnly: true
            - name: grafana-dashboard
              mountPath: "/etc/grafana/dashboards"
              readOnly: true
            - name: data
              mountPath: "/var/lib/grafana"
          env:
            -
              name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
            -
              name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
      volumes:
        - {name: grafana-datasources, configMap: {name: grafana-datasources}}
        - {name: grafana-provider, configMap: {name: grafana-provider}}
        - {name: grafana-dashboard, configMap: {name: grafana-dashboard}}
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
