apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: alloy-pod-logs, namespace: monitoring}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: alloy-pod-logs, namespace: monitoring}
subjects:
  - {kind: ServiceAccount, name: alloy, namespace: monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: alloy-pod-logs}
---
apiVersion: v1
kind: Service
metadata: {name: node-exporter}
spec:
  selector: {app: node-exporter}
  ports:
    - name: http
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter}
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.9.1
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/rootfs"
            - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/kubelet/.+)($|/)"
          ports:
            - {name: http, containerPort: 9100}
          resources: {requests: {cpu: "25m", memory: "64Mi"}, limits: {memory: "256Mi"}}
          volumeMounts:
            - {name: proc, mountPath: "/host/proc", readOnly: true}
            - {name: sys, mountPath: "/host/sys", readOnly: true}
            - name: rootfs
              mountPath: "/rootfs"
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - {name: proc, hostPath: {path: "/proc", type: Directory}}
        - {name: sys, hostPath: {path: "/sys", type: Directory}}
        - {name: rootfs, hostPath: {path: "/", type: Directory}}
---
apiVersion: v1
kind: Service
metadata: {name: blackbox-exporter}
spec:
  selector: {app: blackbox-exporter}
  ports:
    - {name: http, port: 9115, targetPort: 9115}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: blackbox-exporter}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: blackbox-exporter}}
  template:
    metadata: {labels: {app: blackbox-exporter}}
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args:
            - "--config.file=/etc/blackbox/blackbox.yml"
          ports:
            - {name: http, containerPort: 9115}
          resources: {requests: {cpu: "25m", memory: "64Mi"}, limits: {memory: "256Mi"}}
          volumeMounts:
            - {name: blackbox-config, mountPath: "/etc/blackbox", readOnly: true}
      volumes:
        - {name: blackbox-config, configMap: {name: blackbox-config}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data}
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: "5Gi"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - {name: http, containerPort: 9090}
          resources: {requests: {cpu: "25m", memory: "64Mi"}, limits: {memory: "768Mi"}}
          volumeMounts:
            - {name: prometheus-config, mountPath: "/etc/prometheus", readOnly: true}
            - {name: data, mountPath: "/prometheus"}
      volumes:
        - {name: prometheus-config, configMap: {name: prometheus-config}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
---
apiVersion: v1
