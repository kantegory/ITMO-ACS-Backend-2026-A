global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
  - static_configs:
    - targets: [alertmanager:9093]
scrape_configs:
- job_name: node-exporter
  static_configs:
  - targets: [node-exporter:9100]
- job_name: fitnessapi-health
  metrics_path: /probe
  params:
    module: [http_2xx]
  static_configs:
  - targets: [http://user-service.fitnessapi.svc.cluster.local:8080/api/v1/actuator/health]
    labels:
      service: user-service
  - targets: [http://media-service.fitnessapi.svc.cluster.local:8080/api/v1/actuator/health]
    labels:
      service: media-service
  - targets: [http://training-service.fitnessapi.svc.cluster.local:8080/api/v1/actuator/health]
    labels:
      service: training-service
  - targets: [http://blog-service.fitnessapi.svc.cluster.local:8080/api/v1/actuator/health]
    labels:
      service: blog-service
  - targets: [http://progress-service.fitnessapi.svc.cluster.local:8080/api/v1/actuator/health]
    labels:
      service: progress-service
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter:9115
