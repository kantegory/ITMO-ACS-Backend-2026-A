apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      enableServiceLinks: false
      imagePullSecrets:
      - name: fitnessapi-registry
      containers:
      - name: user-service
        image: FITNESSAPI_REGISTRY/user-service:FITNESSAPI_TAG
        ports:
        - containerPort: 8080
        env:
        - name: USER_SERVICE_DB_URL
          value: "jdbc:postgresql://postgres:5432/user_service"
        - name: SERVER_FORWARD_HEADERS_STRATEGY
          value: "framework"
        - name: REFRESH_TTL
          value: "30d"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: DB_USERNAME}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: DB_PASSWORD}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: JWT_SECRET}
        - name: REFRESH_PEPPER
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: REFRESH_PEPPER}
        startupProbe:
          httpGet: {path: /api/v1/actuator/health, port: 8080}
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 72
        readinessProbe:
          httpGet: {path: /api/v1/actuator/health, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 15
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 896Mi}
---
