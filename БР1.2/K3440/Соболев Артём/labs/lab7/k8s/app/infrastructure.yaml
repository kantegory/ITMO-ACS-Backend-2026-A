apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-create-databases.sql: |
    CREATE DATABASE user_service;
    CREATE DATABASE media_service;
    CREATE DATABASE training_service;
    CREATE DATABASE blog_service;
    CREATE DATABASE progress_service;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodes
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-nodes
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: fitness
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: DB_USERNAME}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: DB_PASSWORD}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command: [sh, -ec, 'PGPASSWORD="$POSTGRES_PASSWORD" pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d fitness']
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1024Mi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodes
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-nodes
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management-alpine
        ports:
        - containerPort: 5672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: RABBITMQ_USERNAME}
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef: {name: fitnessapi-secrets, key: RABBITMQ_PASSWORD}
        readinessProbe:
          exec:
            command: [rabbitmq-diagnostics, -q, ping]
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1024Mi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
