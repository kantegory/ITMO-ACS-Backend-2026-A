apiVersion: v1
kind: Service
metadata:
  name: fitnessapi-gateway
spec:
  selector:
    app: fitnessapi-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitnessapi-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fitnessapi-gateway
  template:
    metadata:
      labels:
        app: fitnessapi-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fitnessapi-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessapi
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fitnessapi-gateway
            port: {number: 8080}
