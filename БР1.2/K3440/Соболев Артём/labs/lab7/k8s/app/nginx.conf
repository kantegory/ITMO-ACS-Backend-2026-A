map $http_x_forwarded_proto $fitnessapi_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    absolute_redirect off;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /api/v1/swagger-ui/index.html;
    }

    location = /api/v1/swagger {
        return 301 /api/v1/swagger-ui/index.html;
    }

    location = /api/v1/swagger/ {
        return 301 /api/v1/swagger-ui/index.html;
    }

    location = /api/v1/swagger-ui {
        return 301 /api/v1/swagger-ui/index.html;
    }

    location ~ ^/api/v1/swagger/(user|media|training|blog|progress)/?$ {
        return 301 /api/v1/swagger-ui/index.html;
    }

    location /api/v1/swagger-ui/ {
        proxy_pass http://user-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/v3/api-docs/swagger-config {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"configUrl":"/api/v1/v3/api-docs/swagger-config","displayRequestDuration":true,"docExpansion":"list","operationsSorter":"method","tagsSorter":"alpha","tryItOutEnabled":true,"urls":[{"name":"user-service","url":"/api/v1/docs/user"},{"name":"media-service","url":"/api/v1/docs/media"},{"name":"training-service","url":"/api/v1/docs/training"},{"name":"blog-service","url":"/api/v1/docs/blog"},{"name":"progress-service","url":"/api/v1/docs/progress"}],"urls.primaryName":"user-service","validatorUrl":"","withCredentials":true}';
    }

    location = /api/v1/docs/user {
        proxy_pass http://user-service:8080/api/v1/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/docs/media {
        proxy_pass http://media-service:8080/api/v1/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/docs/training {
        proxy_pass http://training-service:8080/api/v1/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/docs/blog {
        proxy_pass http://blog-service:8080/api/v1/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/docs/progress {
        proxy_pass http://progress-service:8080/api/v1/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location = /api/v1/profiles/me/progress {
        proxy_pass http://progress-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location ~ ^/api/v1/trainings/[^/]+/sessions(?:/.*)?$ {
        proxy_pass http://progress-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/auth {
        proxy_pass http://user-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/users {
        proxy_pass http://user-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/profiles {
        proxy_pass http://user-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/profile {
        rewrite ^/api/v1/profile(.*)$ /api/v1/profiles$1 break;
        proxy_pass http://user-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/videos {
        proxy_pass http://media-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/exercises {
        proxy_pass http://training-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/trainings {
        proxy_pass http://training-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/tags {
        proxy_pass http://training-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/types {
        proxy_pass http://training-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/articles {
        proxy_pass http://blog-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/categories {
        proxy_pass http://blog-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/comments {
        proxy_pass http://blog-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/progress {
        proxy_pass http://progress-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/training-sessions {
        proxy_pass http://progress-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/training-session-exercises {
        proxy_pass http://progress-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitnessapi_scheme;
    }

    location /api/v1/ {
        return 404;
    }
}
