# Loaded by /etc/nginx/sites-enabled/br-lab4.conf in the http context.
limit_req_zone $binary_remote_addr zone=br_lab4_requests:10m rate=15r/s;

server {
    listen 8080;
    server_name 193.233.16.27;
    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/br-lab4.access.log;
    error_log /var/log/nginx/br-lab4.error.log warn;

    add_header X-Lab "BR-LR4" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=br_lab4_requests burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }
}
