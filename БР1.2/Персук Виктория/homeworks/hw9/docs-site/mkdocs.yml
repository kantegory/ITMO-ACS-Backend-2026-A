site_name: Платформа бронирования ресторанов
site_description: Документация микросервисного веб-приложения курса «Бэк-энд разработка»
site_author: Персук Виктория
site_url: https://dontdoitno.github.io/ITMO-ACS-Backend-2026-A/
repo_url: https://github.com/dontdoitno/ITMO-ACS-Backend-2026-A
repo_name: ITMO-ACS-Backend-2026-A
edit_uri: edit/new-semester/БР1.2/Персук Виктория/homeworks/hw9/docs-site/docs/
copyright: Персук Виктория, ИТМО, 2026

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: [ru, en]
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Архитектура:
      - Общая схема: architecture.md
      - RabbitMQ и события: messaging.md
      - Сценарии работы: scenarios.md
  - Сервисы:
      - services/api-gateway.md
      - services/auth-service.md
      - services/restaurant-service.md
      - services/reservation-service.md
      - services/menu-service.md
      - services/review-service.md
      - services/notification-service.md
  - API:
      - Спецификация OpenAPI: api/openapi.md
      - Swagger UI сервисов: api/swagger.md
      - Коллекция Postman: api/postman.md
  - Развёртывание:
      - Локальный запуск: deploy/local.md
      - Сервер EC2: deploy/ec2.md
      - Ansible: deploy/ansible.md
      - Amazon EKS: deploy/eks.md
  - Эксплуатация:
      - CI/CD: operations/cicd.md
      - Мониторинг: operations/monitoring.md
