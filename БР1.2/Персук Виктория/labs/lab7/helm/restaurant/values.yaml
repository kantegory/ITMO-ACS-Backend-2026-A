# Образы: <registry>/<repoPrefix>/<имя сервиса>:<tag>
# registry и tag подставляет GitHub Actions при деплое
image:
  registry: ""
  repoPrefix: restaurant-lab
  tag: latest

aws:
  region: ap-southeast-2
  # секрет в AWS Secrets Manager, созданный Terraform
  secretName: restaurant-lab/app

# Подключение сервисов к RDS
db:
  # ЛР8: логирование каждого SQL-запроса выключено, оно тратило CPU под нагрузкой
  logging: false   # логировать каждый SQL-запрос (TypeORM)
  # ЛР8: 24 пода при максимуме HPA x 5 = 120 подключений, без пула 10 было бы 240 при лимите RDS около 80
  poolMax: 5       # размер пула подключений в каждом поде

# Автомасштабирование подов
hpa:
  cpuTarget: 70                      # целевая загрузка CPU от requests, %
  scaleDownStabilizationSeconds: 120 # сколько ждать перед уменьшением числа реплик

rabbitmq:
  image: rabbitmq:3-management
  storage: 5Gi
  # закрепить брокер за зоной (рядом с RDS); пусто — без привязки
  zone: ap-southeast-2a

services:
  api-gateway:
    port: 3000
    replicas: 2
    maxReplicas: 6
    resources: { cpu: 100m, memory: 48Mi, memoryLimit: 128Mi, cpuLimit: 500m }
    probe: { type: http, path: /health }
    env:
      AUTH_SERVICE_URL: http://auth-service:3001
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002
      RESERVATION_SERVICE_URL: http://reservation-service:3003
      MENU_SERVICE_URL: http://menu-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005

  auth-service:
    port: 3001
    replicas: 2
    maxReplicas: 6
    resources: { cpu: 250m, memory: 96Mi, memoryLimit: 256Mi, cpuLimit: "1" }
    probe: { type: tcp }
    db: auth
    jwt: true
    rabbitmq: true
    env:
      JWT_ACCESS_TOKEN_LIFETIME: "86400"
      RESERVATION_SERVICE_URL: http://reservation-service:3003

  restaurant-service:
    port: 3002
    replicas: 2
    maxReplicas: 6
    resources: { cpu: 150m, memory: 96Mi, memoryLimit: 256Mi, cpuLimit: 500m }
    probe: { type: tcp }
    db: restaurant
    jwt: true
    rabbitmq: true
    env:
      AUTH_SERVICE_URL: http://auth-service:3001
      RESERVATION_SERVICE_URL: http://reservation-service:3003
      MENU_SERVICE_URL: http://menu-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005

  reservation-service:
    port: 3003
    replicas: 2
    maxReplicas: 6
    resources: { cpu: 150m, memory: 96Mi, memoryLimit: 256Mi, cpuLimit: 500m }
    probe: { type: tcp }
    db: reservation
    jwt: true
    rabbitmq: true
    env:
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002

  menu-service:
    port: 3004
    replicas: 2
    maxReplicas: 3
    resources: { cpu: 100m, memory: 96Mi, memoryLimit: 256Mi, cpuLimit: 500m }
    probe: { type: tcp }
    db: menu
    jwt: true
    env:
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002

  review-service:
    port: 3005
    replicas: 2
    maxReplicas: 3
    resources: { cpu: 100m, memory: 96Mi, memoryLimit: 256Mi, cpuLimit: 500m }
    probe: { type: tcp }
    db: review
    jwt: true
    rabbitmq: true
    env:
      AUTH_SERVICE_URL: http://auth-service:3001
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002

  notification-service:
    replicas: 1
    resources: { cpu: 50m, memory: 64Mi, memoryLimit: 128Mi, cpuLimit: 250m }
    rabbitmq: true
