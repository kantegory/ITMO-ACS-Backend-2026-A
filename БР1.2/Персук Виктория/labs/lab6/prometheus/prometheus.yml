global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: health-http
    metrics_path: /probe
    params:
      module: [http_service]
    static_configs:
      - targets:
          - http://api-gateway:3000/health
          - http://auth-service:3001/api/v1/
          - http://restaurant-service:3002/api/v1/
          - http://reservation-service:3003/api/v1/
          - http://menu-service:3004/api/v1/
          - http://review-service:3005/api/v1/
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: '(?:https?://)?([^:/]+).*'
        target_label: service
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: health-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - auth-db:5432
          - restaurant-db:5432
          - reservation-db:5432
          - menu-db:5432
          - review-db:5432
          - rabbitmq:5672
    relabel_configs: *probe_relabel
