# kube-prometheus-stack для ЛР8: Prometheus, Grafana, node-exporter, kube-state-metrics.
# Alertmanager и метрики control plane (недоступны в EKS) выключены.
fullnameOverride: kps
alertmanager:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # приём метрик k6 через remote write
    enableRemoteWriteReceiver: true
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 1536Mi }

grafana:
  defaultDashboardsTimezone: browser
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
