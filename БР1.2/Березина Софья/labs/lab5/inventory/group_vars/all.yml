---
# Shared variables for hosts in the inventory.
app_dir: /opt/fitness-platform
lab3_source_dir: "{{ playbook_dir }}/../../lab3"

docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_repo: >-
  deb [arch={{ docker_deb_arch }} signed-by={{ docker_apt_keyring }}]
  https://download.docker.com/linux/ubuntu
  {{ ansible_distribution_release }} stable

docker_deb_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}
