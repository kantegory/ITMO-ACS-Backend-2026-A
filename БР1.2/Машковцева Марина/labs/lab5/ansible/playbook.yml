---
- name: Configure Ubuntu virtual machine
  hosts: ubuntu_servers
  become: true

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
          - nginx
          - openssh-server
        state: present

    - name: Enable and start SSH
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: started

    - name: Enable and start Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add user to Docker group
      ansible.builtin.user:
        name: marina
        groups: docker
        append: true
