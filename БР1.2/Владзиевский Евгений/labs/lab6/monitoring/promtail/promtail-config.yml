# Promtail: сбор логов всех docker-контейнеров на ВМ

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Контейнеры обнаруживаются автоматически через docker socket,
      # новые подхватываются без правки конфигурации
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      # Логи Go-сервисов: вытаскиваем уровень, чтобы фильтровать в Grafana
      - regex:
          expression: '(?i)(?P<level>panic|fatal|error|warn|info|debug)'
      - labels:
          level:
