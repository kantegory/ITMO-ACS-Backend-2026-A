# Дашборды загружаются из файлов: Grafana подхватывает их при старте
apiVersion: 1

providers:
  - name: rental-dashboards
    orgId: 1
    folder: Rental
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
