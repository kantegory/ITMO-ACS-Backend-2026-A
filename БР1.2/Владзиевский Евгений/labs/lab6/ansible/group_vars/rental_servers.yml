---
# Каталог со стеком мониторинга на сервере
monitoring_dir: /opt/rental-monitoring
monitoring_src_dir: "{{ playbook_dir }}/../monitoring"
monitoring_compose_file: docker-compose.monitoring.yml
# Сколько целей Prometheus должно быть живо: prometheus, node, cadvisor,
# 6 микросервисов и внешняя проверка через nginx
monitoring_expected_targets: 10

app_user: ubuntu

# Grafana
grafana_enabled: true
grafana_host: 127.0.0.1
grafana_port: 3000
grafana_admin_user: admin

# Переменные роли nginx из ЛР5 (роль переиспользуется как есть)
nginx_site_name: rental-api
nginx_server_name: "192.168.1.245 _"
nginx_upstream_host: 127.0.0.1
nginx_upstream_port: 8080
nginx_client_max_body_size: 10m
