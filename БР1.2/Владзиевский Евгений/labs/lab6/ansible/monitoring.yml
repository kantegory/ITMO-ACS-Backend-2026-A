---
# ЛР6: развёртывание системы мониторинга на сервере приложения.
#
# Запуск:
#   ansible-playbook monitoring.yml --ask-pass

- name: Развернуть мониторинг и открыть Grafana через nginx
  hosts: rental_servers
  gather_facts: true

  roles:
    # стек Prometheus + Loki + Grafana
    - role: monitoring
      tags: [monitoring]
    # роль из ЛР5: добавляет в конфиг прокси локацию /grafana/
    - role: nginx
      tags: [nginx]
