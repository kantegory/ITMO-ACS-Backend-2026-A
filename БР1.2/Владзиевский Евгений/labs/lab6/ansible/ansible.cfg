[defaults]
inventory = inventory/hosts.yml
# Роль nginx переиспользуется из ЛР5: конфигурация прокси описана один раз
roles_path = roles:../../lab5/ansible/roles
host_key_checking = False
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
