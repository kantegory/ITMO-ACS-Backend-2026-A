# nginx в режиме обратного прокси (reverse proxy) для rental-приложения.
# Файл кладётся в /etc/nginx/sites-available/rental-api.conf
# и линкуется в /etc/nginx/sites-enabled/.

# Для websocket-соединений Grafana (директива map допустима в контексте http,
# куда и подключается этот файл через include sites-enabled/*)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rental_api_gateway {
    # API Gateway опубликован docker-compose только на loopback-интерфейсе
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.245 _;

    # Размер загружаемых файлов (фото объектов) — как MAX_UPLOAD_SIZE в property-service
    client_max_body_size 10m;

    access_log /var/log/nginx/rental-api.access.log;
    error_log  /var/log/nginx/rental-api.error.log warn;

    # Скрываем версию nginx в заголовках ответа
    server_tokens off;

    # Сжатие JSON-ответов API
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://rental_api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
    }

    # Grafana (ЛР6) отдаётся на подпути /grafana/
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live-канал Grafana работает по websocket
    location /grafana/api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
    }

    # Health-check API Gateway: отдельная локация без логирования шума
    location = /health {
        proxy_pass http://rental_api_gateway/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
