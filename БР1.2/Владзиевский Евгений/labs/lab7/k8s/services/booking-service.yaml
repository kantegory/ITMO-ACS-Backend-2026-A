# Аренда: бронирования и сага оплаты.
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: rental
  labels:
    app: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: rental
  labels:
    app: booking-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # обновление без простоя
      maxSurge: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: booking-service
          image: rental/booking-service:latest
          # образы собираются на узле и импортируются в containerd,
          # внешний registry в учебном стенде не используется
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_HOST
              value: booking-db
            - name: DB_USER
              value: booking
            - name: DB_NAME
              value: booking_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: BOOKING_DB_PASSWORD
            - name: SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: SERVER_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: DB_PORT
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: DB_SSLMODE
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: KAFKA_BROKERS
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: AUTH_SERVICE_URL
            - name: PROPERTY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: PROPERTY_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: PAYMENT_SERVICE_URL
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 8083
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 192Mi
