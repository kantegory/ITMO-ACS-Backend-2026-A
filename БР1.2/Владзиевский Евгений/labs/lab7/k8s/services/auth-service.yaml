# Сервис аутентификации: регистрация, вход, профили пользователей.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rental
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rental
  labels:
    app: auth-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # обновление без простоя
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: auth-service
          image: rental/auth-service:latest
          # образы собираются на узле и импортируются в containerd,
          # внешний registry в учебном стенде не используется
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_HOST
              value: auth-db
            - name: DB_USER
              value: auth
            - name: DB_NAME
              value: auth_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: AUTH_DB_PASSWORD
            - name: SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: SERVER_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: DB_PORT
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: DB_SSLMODE
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: KAFKA_BROKERS
            - name: JWT_ACCESS_EXPIRE
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: JWT_ACCESS_EXPIRE
            - name: JWT_REFRESH_EXPIRE
              valueFrom:
                configMapKeyRef:
                  name: rental-config
                  key: JWT_REFRESH_EXPIRE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: JWT_SECRET
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 192Mi
