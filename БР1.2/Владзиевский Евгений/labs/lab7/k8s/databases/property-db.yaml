# База данных сервиса property-service. StatefulSet, а не Deployment: у БД есть
# постоянное состояние и стабильное сетевое имя, а PVC должен переживать
# пересоздание пода.
apiVersion: v1
kind: Service
metadata:
  name: property-db
  namespace: rental
  labels:
    app: property-db
spec:
  clusterIP: None          # headless: обращение идёт по имени пода StatefulSet
  selector:
    app: property-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: property-db
  namespace: rental
spec:
  serviceName: property-db
  replicas: 1
  selector:
    matchLabels:
      app: property-db
  template:
    metadata:
      labels:
        app: property-db
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: property
            - name: POSTGRES_DB
              value: property_catalog_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rental-secrets
                  key: PROPERTY_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "property", "-d", "property_catalog_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "property", "-d", "property_catalog_db"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
