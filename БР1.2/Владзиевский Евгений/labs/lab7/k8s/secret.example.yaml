# ПРИМЕР. Настоящий секрет создаётся скриптом deploy.sh командой
# kubectl create secret generic rental-secrets --from-literal=... со случайными
# значениями и в репозиторий не попадает.
apiVersion: v1
kind: Secret
metadata:
  name: rental-secrets
  namespace: rental
type: Opaque
stringData:
  JWT_SECRET: change-me
  SERVICE_TOKEN: change-me
  AUTH_DB_PASSWORD: change-me
  PROPERTY_DB_PASSWORD: change-me
  BOOKING_DB_PASSWORD: change-me
  PAYMENT_DB_PASSWORD: change-me
  MESSAGING_DB_PASSWORD: change-me
