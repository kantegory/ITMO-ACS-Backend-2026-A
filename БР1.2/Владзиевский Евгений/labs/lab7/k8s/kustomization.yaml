apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rental

resources:
  - namespace.yaml
  - configmap.yaml
  - databases/auth-db.yaml
  - databases/property-db.yaml
  - databases/booking-db.yaml
  - databases/payment-db.yaml
  - databases/messaging-db.yaml
  - kafka/zookeeper.yaml
  - kafka/kafka.yaml
  - services/property-storage-pvc.yaml
  - services/auth-service.yaml
  - services/property-service.yaml
  - services/booking-service.yaml
  - services/payment-service.yaml
  - services/messaging-service.yaml
  - services/api-gateway.yaml
  - monitoring/grafana-external.yaml
  - ingress.yaml

# Метка вешается на все ресурсы, но НЕ попадает в селекторы:
# commonLabels дописывает метку и в spec.selector, из-за чего сервис
# grafana-external (намеренно без селектора) начинал выбирать все поды
# приложения, и Ingress отдавал 502.
labels:
  - pairs:
      app.kubernetes.io/part-of: rental-app
    includeSelectors: false
