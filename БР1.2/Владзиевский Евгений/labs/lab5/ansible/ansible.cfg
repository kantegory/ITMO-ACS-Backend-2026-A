[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
# человекочитаемый вывод результатов задач
result_format = yaml
# Показывать статистику по задачам, чтобы в отчёте было видно changed/ok
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
forks = 10

[ssh_connection]
pipelining = True
