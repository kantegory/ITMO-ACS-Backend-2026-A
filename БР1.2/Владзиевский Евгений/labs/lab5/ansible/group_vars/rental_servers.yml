---
# Переменные окружения сервера приложения

# Каталог приложения на сервере
app_dir: /opt/rental-app

# Пользователь, от имени которого работает приложение
app_user: ubuntu

# Где лежат исходники микросервисов и production-конфигурация (ЛР2–ЛР4)
app_src_dir: "{{ playbook_dir }}/../../lab2"
app_deploy_dir: "{{ playbook_dir }}/../../lab4/deploy"

# Базовые системные пакеты
base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - rsync
  - openssl

# Пакеты Docker из официального репозитория
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Настройки обратного прокси
nginx_site_name: rental-api
nginx_server_name: "192.168.1.245 _"
nginx_upstream_host: 127.0.0.1
nginx_upstream_port: 8080
nginx_client_max_body_size: 10m

# Файл compose, которым поднимается стек
compose_file: docker-compose.prod.yml

# Базы данных сервисов: имя пользователя и БД фиксированы, пароли генерируются
app_databases:
  - { prefix: AUTH, user: auth, name: auth_db }
  - { prefix: PROPERTY, user: property, name: property_catalog_db }
  - { prefix: BOOKING, user: booking, name: booking_db }
  - { prefix: PAYMENT, user: payment, name: payment_db }
  - { prefix: MESSAGING, user: messaging, name: messaging_db }
