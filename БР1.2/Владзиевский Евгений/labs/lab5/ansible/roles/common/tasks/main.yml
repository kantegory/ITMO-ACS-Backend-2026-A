---
# Базовая подготовка сервера: обновление индекса пакетов и системные утилиты

- name: Обновить индекс пакетов apt (не чаще раза в час)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Установить базовые системные пакеты
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
  become: true

- name: Задать часовой пояс
  community.general.timezone:
    name: Europe/Moscow
  become: true

- name: Создать каталог приложения
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: true
