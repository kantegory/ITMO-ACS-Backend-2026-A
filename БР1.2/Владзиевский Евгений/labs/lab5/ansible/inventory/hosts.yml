# Инвентарь: один хост — сервер приложения из ЛР4.
# Пароль/ключ в репозитории не хранится: подключение выполняется
# с --ask-pass либо через ansible-vault (см. README).
all:
  children:
    rental_servers:
      hosts:
        rental-server:
          ansible_host: 192.168.1.245
          ansible_user: ubuntu
          # paramiko умеет парольную аутентификацию без внешнего sshpass
          ansible_connection: paramiko
