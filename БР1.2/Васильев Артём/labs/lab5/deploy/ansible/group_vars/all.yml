repo_dir: "{{ lookup('env', 'REPO_DIR') | default('/opt/job-platform-hw6/repo', true) }}"
app_dir: "{{ repo_dir }}/{{ app_subdir }}"
repo_url: "{{ lookup('env', 'REPO_URL') | default('https://github.com/frizyyu/ITMO-ACS-Backend-2026-A.git', true) }}"
branch: "{{ lookup('env', 'BRANCH') | default('main', true) }}"
app_subdir: "БР1.2/Васильев Артём/labs/lab5"
legacy_app_dir: "{{ repo_dir }}/БР1.2/Васильев Артём/homeworks/hw6"
services:
  - auth-user-service
  - company-service
  - dictionary-service
  - vacancy-service
  - resume-service
  - application-service
  - interaction-service
common_preserve_existing: true
firewall_preserve_existing: true
docker_preserve_existing: true
compose_project_name: job-platform-hw6
health_url: "http://127.0.0.1:3003/api/v1/industries"
health_retries: 36
health_delay: 5
nginx_preserve_existing: true
nginx_vhost_path: /etc/nginx/sites-enabled/smc-workspace
nginx_existing_snippet_path: /etc/nginx/snippets/job-platform-lab4.locations.conf
