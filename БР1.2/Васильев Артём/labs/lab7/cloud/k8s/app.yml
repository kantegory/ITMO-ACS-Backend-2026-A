apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-user-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: auth-user-service
  template:
    metadata:
      labels:
        app: auth-user-service
    spec:
      automountServiceAccountToken: false
      initContainers:
      - image: 127.0.0.1:5000/job-platform/auth-user-service:IMAGE_TAG
        env:
        - name: APP_PORT
          value: '3001'
        - name: DB_NAME
          value: users_db
        - name: DB_USER
          value: users
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USERS_DB_PASSWORD
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET_KEY
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SERVICE_TOKEN
        envFrom:
        - configMapRef:
            name: app-config
        securityContext: &id001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        name: migrate
        command:
        - node
        - dist/scripts/migrate.js
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 112Mi
      containers:
      - name: app
        image: 127.0.0.1:5000/job-platform/auth-user-service:IMAGE_TAG
        ports:
        - containerPort: 3001
        env:
        - name: APP_PORT
          value: '3001'
        - name: DB_NAME
          value: users_db
        - name: DB_USER
          value: users
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USERS_DB_PASSWORD
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET_KEY
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SERVICE_TOKEN
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 300m
            memory: 112Mi
        startupProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 20
        securityContext: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: auth-user-service
spec:
  selector:
    app: auth-user-service
  ports:
  - port: 3001
    targetPort: 3001
---
