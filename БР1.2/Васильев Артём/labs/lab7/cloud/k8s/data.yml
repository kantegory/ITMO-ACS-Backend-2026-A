apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - -c
        - shared_buffers=32MB
        - -c
        - max_connections=100
        - -c
        - work_mem=1MB
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: clusteradmin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: USERS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USERS_DB_PASSWORD
        - name: COMPANIES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: COMPANIES_DB_PASSWORD
        - name: DICTIONARIES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DICTIONARIES_DB_PASSWORD
        - name: VACANCIES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: VACANCIES_DB_PASSWORD
        - name: RESUMES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RESUMES_DB_PASSWORD
        - name: APPLICATIONS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: APPLICATIONS_DB_PASSWORD
        - name: INTERACTIONS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: INTERACTIONS_DB_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 200Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - clusteradmin
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 365
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-alpine
        ports:
        - containerPort: 5672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: +S 1:1 +A 4
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 160Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      - name: config
        configMap:
          name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
