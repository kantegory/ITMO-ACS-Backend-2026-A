apiVersion: v1
kind: Pod
metadata:
  name: lab-registry
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
  - name: registry
    image: registry:2.8.3
    env:
    - name: REGISTRY_HTTP_ADDR
      value: 127.0.0.1:5000
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 80Mi
    volumeMounts:
    - name: data
      mountPath: /var/lib/registry
  volumes:
  - name: data
    hostPath:
      path: /var/lib/lab-registry
      type: DirectoryOrCreate
