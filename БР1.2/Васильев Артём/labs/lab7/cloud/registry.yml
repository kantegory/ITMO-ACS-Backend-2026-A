apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-registry
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab-registry
  template:
    metadata:
      labels:
        app: lab-registry
    spec:
      hostNetwork: true
      containers:
      - name: registry
        image: registry:2.8.3
        env:
        - name: REGISTRY_HTTP_ADDR
          value: 127.0.0.1:5000
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 80Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        hostPath:
          path: /var/lib/lab-registry
          type: DirectoryOrCreate
