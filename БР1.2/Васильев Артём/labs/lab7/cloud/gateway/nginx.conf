events { worker_connections 512; }
http {
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  resolver 10.43.0.10 valid=15s;
  server {
    listen 8080;
    location = /healthz { access_log off; return 200 'ok'; }
    location /docs/ { root /srv; index index.html; }
    location ~ ^/api/v1/vacancies/[^/]+/applications { proxy_pass http://application-service:3006; }
    location ~ ^/api/v1/vacancies/[^/]+/views { proxy_pass http://interaction-service:3007; }
    location ~ ^/api/v1/(auth|users)(/|$) { proxy_pass http://auth-user-service:3001; }
    location ~ ^/api/v1/(companies|employer-profiles)(/|$) { proxy_pass http://company-service:3002; }
    location ~ ^/api/v1/(industries|experience-levels)(/|$) { proxy_pass http://dictionary-service:3003; }
    location ~ ^/api/v1/vacancies(/|$) { proxy_pass http://vacancy-service:3004; }
    location ~ ^/api/v1/resumes(/|$) { proxy_pass http://resume-service:3005; }
    location ~ ^/api/v1/applications(/|$) { proxy_pass http://application-service:3006; }
    location ~ ^/api/v1/(favorites|vacancy-views)(/|$) { proxy_pass http://interaction-service:3007; }
    location / { return 404; }
  }
}
