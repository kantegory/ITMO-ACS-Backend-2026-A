name: job-platform-lab8-pc
services:
  grafana:
    image: grafana/grafana:13.3.2
    mem_limit: 512m
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python init-env.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
  loki:
    image: grafana/loki:3.7.10
    mem_limit: 256m
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3101:3101"
    volumes:
      - loki-data:/loki
      - ./loki.yml:/etc/loki/loki.yml:ro
volumes:
  grafana-data:
  loki-data:
