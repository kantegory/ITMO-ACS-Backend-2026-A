global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
- job_name: node
  static_configs:
  - targets:
    - 127.0.0.1:9100
- job_name: kubelet
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_cpu_cfs_throttled_seconds_total
    action: keep
- job_name: microservices
  metrics_path: /probe
  params:
    module:
    - tcp_connect
  static_configs:
  - targets:
    - auth-user-service:3001
    labels:
      service: auth-user-service
  - targets:
    - company-service:3002
    labels:
      service: company-service
  - targets:
    - dictionary-service:3003
    labels:
      service: dictionary-service
  - targets:
    - vacancy-service:3004
    labels:
      service: vacancy-service
  - targets:
    - resume-service:3005
    labels:
      service: resume-service
  - targets:
    - application-service:3006
    labels:
      service: application-service
  - targets:
    - interaction-service:3007
    labels:
      service: interaction-service
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox:9115
