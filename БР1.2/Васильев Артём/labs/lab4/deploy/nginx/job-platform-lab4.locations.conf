# Include this file inside the existing HTTPS server block for 185.236.24.201.
# The /job-platform prefix is removed before proxying to a microservice.

location = /job-platform {
    return 308 /job-platform/;
}

location = /job-platform/ {
    default_type application/json;
    return 200 '{"name":"job-platform","status":"ok","api":"/job-platform/api/v1"}';
}

# Internal service-to-service API must never be reachable from the Internet.
location ^~ /job-platform/api/v1/internal/ {
    return 404;
}

# These routes share /vacancies with vacancy-service, so they are matched first.
location ~ ^/job-platform/api/v1/vacancies/[^/]+/applications/?$ {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3006;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/vacancies/[^/]+/views/?$ {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3007;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/(auth|users)(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/(companies|employer-profiles)(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3002;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/(industries|experience-levels)(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3003;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/vacancies(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3004;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/resumes(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/applications(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3006;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

location ~ ^/job-platform/api/v1/(favorites|vacancy-views)(/|$) {
    rewrite ^/job-platform(.*)$ $1 break;
    proxy_pass http://127.0.0.1:3007;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Prefix /job-platform;
}

# Separate prefixes prevent the seven /docs endpoints from colliding.
location /job-platform/docs/auth-user/ {
    proxy_pass http://127.0.0.1:3001/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/company/ {
    proxy_pass http://127.0.0.1:3002/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/dictionary/ {
    proxy_pass http://127.0.0.1:3003/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/vacancy/ {
    proxy_pass http://127.0.0.1:3004/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/resume/ {
    proxy_pass http://127.0.0.1:3005/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/application/ {
    proxy_pass http://127.0.0.1:3006/docs/;
    include /etc/nginx/proxy_params;
}

location /job-platform/docs/interaction/ {
    proxy_pass http://127.0.0.1:3007/docs/;
    include /etc/nginx/proxy_params;
}

# Do not pass unknown Job Platform routes to another virtual-host fallback.
location /job-platform/ {
    return 404;
}

