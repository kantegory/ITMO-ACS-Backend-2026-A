<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Platform — Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
  <p><a href="api.html">К API и скачиванию контрактов</a> · Только просмотр, запросы отключены.</p>
  <noscript>Для Swagger нужен JavaScript. YAML доступен на странице API.</noscript>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: 'contracts/openapi.yaml',
      dom_id: '#swagger-ui',
      supportedSubmitMethods: [],
      validatorUrl: null,
      persistAuthorization: false
    });
  </script>
</body>
</html>
