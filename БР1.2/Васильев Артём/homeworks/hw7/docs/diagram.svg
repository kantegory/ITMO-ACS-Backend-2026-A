<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#15253b}.box{fill:#edf4fb;stroke:#37608b;stroke-width:2}.line{stroke:#37608b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#37608b"/></marker></defs><rect width="1080" height="640" fill="white"/><text x="30" y="35" font-weight="bold">Job Platform: single-node K3s / 147.45.196.171 / 3 vCPU, 5925 MiB RAM</text><rect class="box" x="30" y="65" width="210" height="60"/><text x="45" y="100">User / Postman</text><rect class="box" x="30" y="165" width="210" height="85"/><text x="45" y="198">GitHub Actions</text><text x="45" y="226">build + SHA images</text><rect x="280" y="60" width="770" height="550" rx="15" fill="none" stroke="#808a98" stroke-dasharray="8 4"/><text x="305" y="91">VPS / K3s: apps in job-platform; ingress / registry in kube-system</text><rect class="box" x="330" y="115" width="245" height="65"/><text x="345" y="140" style="font-size:16px">Traefik NodePort :30080</text><text x="345" y="164" style="font-size:16px">Ingress → gateway :80</text><rect class="box" x="330" y="210" width="245" height="65"/><text x="345" y="248">Registry 127.0.0.1:5000</text><rect class="box" x="655" y="115" width="345" height="160"/><text x="675" y="147">7 Deployments + ClusterIP</text><text x="675" y="176">Auth, Company, Dictionary</text><text x="675" y="205">Vacancy, Resume, Application</text><text x="675" y="234">Interaction / TCP probes</text><rect class="box" x="330" y="340" width="300" height="90"/><text x="345" y="375">PostgreSQL + PVC</text><text x="345" y="405">7 databases / 7 roles</text><rect class="box" x="700" y="340" width="300" height="90"/><text x="720" y="392">RabbitMQ + PVC</text><rect class="box" x="330" y="490" width="670" height="80"/><text x="345" y="520" style="font-size:16px">Lab8: Prometheus / Grafana / Loki / Alloy / Node Exporter / Blackbox</text><text x="345" y="549" style="font-size:16px">VPS k6 → Ingress; Metrics Server → HPA Auth: 1–2 pods; no node HA</text><path class="line" d="M240 95 H300 V147 H330"/><path class="line" d="M240 205 H285 V243 H330"/><text x="245" y="192">SSH</text><path class="line" d="M575 147 H655"/><path class="line" d="M575 243 H655"/><path class="line" d="M750 275 V305 H480 V340"/><path class="line" d="M850 275 V340"/><path class="line" d="M825 490 V450"/></svg>
