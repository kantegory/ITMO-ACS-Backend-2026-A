route:
  receiver: email
  group_by: ["alertname", "instance"]
  group_wait: 30s
  repeat_interval: 2h

receivers:
  - name: email
    email_configs:
      - to: student@example.com
        from: alerts@example.com
        smarthost: smtp.example.com:587
        auth_username: alerts@example.com
        auth_password: CHANGE_ME
        require_tls: true
