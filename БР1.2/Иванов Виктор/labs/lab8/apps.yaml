apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tablereserve
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: tablereserve
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "services/auth/src/index.ts"]
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: tablereserve-secret, key: JWT_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: tablereserve-secret, key: DATABASE_URL_AUTH } }
            - name: RABBITMQ_URL
              valueFrom: { configMapKeyRef: { name: tablereserve-config, key: RABBITMQ_URL } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: auth, namespace: tablereserve }
spec:
  selector: { app: auth }
  ports: [{ port: 3001, targetPort: http }]
---
