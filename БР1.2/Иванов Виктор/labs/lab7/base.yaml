apiVersion: v1
kind: Namespace
metadata:
  name: tablereserve
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tablereserve-config
  namespace: tablereserve
data:
  JWT_SECRET_FILE: unused
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  AUTH_URL: http://auth:3001
  RESTAURANTS_URL: http://restaurants:3002
  BOOKINGS_URL: http://bookings:3003
  REVIEWS_URL: http://reviews:3004
  NOTIFICATIONS_URL: http://notifications:3005
  NODE_ENV: production
---
apiVersion: v1
kind: Secret
metadata:
  name: tablereserve-secret
  namespace: tablereserve
type: Opaque
stringData:
  JWT_SECRET: change-me
  POSTGRES_PASSWORD: change-me
  DATABASE_URL_AUTH: postgres://app:change-me@postgres:5432/auth_db
  DATABASE_URL_RESTAURANTS: postgres://app:change-me@postgres:5432/restaurant_db
  DATABASE_URL_BOOKINGS: postgres://app:change-me@postgres:5432/booking_db
  DATABASE_URL_REVIEWS: postgres://app:change-me@postgres:5432/review_db
  DATABASE_URL_NOTIFICATIONS: postgres://app:change-me@postgres:5432/notification_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tablereserve
data:
  init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE restaurant_db;
    CREATE DATABASE booking_db;
    CREATE DATABASE review_db;
    CREATE DATABASE notification_db;
