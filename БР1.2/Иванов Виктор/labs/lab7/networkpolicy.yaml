apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services
  namespace: tablereserve
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, restaurants, bookings, reviews, notifications]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
        - protocol: TCP
          port: 3005
