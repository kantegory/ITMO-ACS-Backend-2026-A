name: Deploy Kubernetes

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: coursework/project
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Пропустить kubectl, если нет kubeconfig
        id: gate
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG не задан, образы опубликованы, apply пропущен"
          fi

      - name: Применить манифесты
        if: steps.gate.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4

      - name: Выкатить образ
        if: steps.gate.outputs.enabled == 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          cd coursework/project/k8s
          kustomize edit set image "tablereserve=ghcr.io/${{ github.repository }}:${{ github.sha }}"
          kubectl apply -k .
          kubectl -n tablereserve rollout status deployment/gateway --timeout=180s
