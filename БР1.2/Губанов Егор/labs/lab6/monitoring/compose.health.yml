services:
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
      - application

networks:
  application:
    external: true
    name: rent-lab5
