server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    location /api/v1/auth/ {
        proxy_pass http://auth:3001/auth/;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/workouts {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://workout:3002;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/plans {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://workout:3002;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/progress {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://progress:3003;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/articles {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://content:3004;
        include /etc/nginx/proxy_params;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}\n';
    }
}
