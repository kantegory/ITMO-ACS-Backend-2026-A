groups:
  - name: fitnessapi-health
    rules:
      - alert: FitnessServiceUnavailable
        expr: probe_success{job="fitnessapi-health"} == 0
        for: 45s
        labels:
          severity: critical
        annotations:
          summary: "Микросервис {{ $labels.service }} недоступен"
          description: "Healthcheck {{ $labels.instance }} не проходит более 45 секунд."
