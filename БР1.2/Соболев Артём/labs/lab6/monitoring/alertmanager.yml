global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: YOUR_GMAIL_ADDRESS@gmail.com
  smtp_auth_username: YOUR_GMAIL_ADDRESS@gmail.com
  smtp_require_tls: true

route:
  receiver: fitnessapi-email
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: fitnessapi-email
    email_configs:
      - to: replace-me@example.com
        auth_username: YOUR_GMAIL_ADDRESS@gmail.com
        auth_password_file: /run/secrets/gmail_app_password
        send_resolved: true
