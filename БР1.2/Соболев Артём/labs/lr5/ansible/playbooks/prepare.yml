---
- name: Подготовить Debian-сервер для FitnessAPI
  hosts: backend
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Проверить ОС и архитектуру
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] in ['12', '13']
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: Нужна Debian 12/13 для архитектуры AMD64 (x86_64).

    - name: Проверить доступную оперативную память
      ansible.builtin.assert:
        that:
          - ansible_facts['memtotal_mb'] | int >= 4096
        fail_msg: Для сборки FitnessAPI выдели ВМ минимум 4 ГБ RAM, рекомендуется 8 ГБ.

    - name: Установить системные зависимости и Nginx
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Создать каталог ключей APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Установить ключ репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'
      timeout: 60
      register: fitness_docker_key
      retries: 3
      delay: 5
      until: fitness_docker_key is succeeded

    - name: Подключить официальный репозиторий Docker
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
      register: fitness_docker_repository

    - name: Установить Docker Engine и Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Запустить Docker и Nginx и включить автозапуск
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - nginx

