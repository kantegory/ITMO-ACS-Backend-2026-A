modules:
  app_health:
    prober: http
    timeout: 4s
    http:
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ["^OK$"]
      preferred_ip_protocol: ip4
  http_2xx:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 4s
    tcp:
      preferred_ip_protocol: ip4
