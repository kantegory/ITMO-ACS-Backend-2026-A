networks:
  loki-net:

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  restaurant-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d restaurant_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  availability-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: availability_db
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d availability_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  booking-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d booking_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  feedback-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d feedback_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-identity-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_NAME: identity-service
      DATABASE_URL: jdbc:postgresql://auth-db:5432/auth_db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    depends_on:
      auth-db:
        condition: service_healthy

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-restaurant-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_NAME: restaurant-service
      DATABASE_URL: jdbc:postgresql://restaurant-db:5432/restaurant_db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      restaurant-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  availability-service:
    build:
      context: .
      dockerfile: availability-service/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-availability-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_NAME: availability-service
      DATABASE_URL: jdbc:postgresql://availability-db:5432/availability_db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
    depends_on:
      availability-db:
        condition: service_healthy
      restaurant-service:
        condition: service_started
      kafka:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-booking-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_NAME: booking-service
      DATABASE_URL: jdbc:postgresql://booking-db:5432/booking_db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_SERVICE_URL: http://identity-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      AVAILABILITY_SERVICE_URL: http://availability-service:8083
    depends_on:
      booking-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      availability-service:
        condition: service_started
      kafka:
        condition: service_healthy

  feedback-service:
    build:
      context: .
      dockerfile: feedback-service/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-feedback-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE_NAME: feedback-service
      DATABASE_URL: jdbc:postgresql://feedback-db:5432/feedback_db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_SERVICE_URL: http://identity-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
    depends_on:
      feedback-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/lab2-api-gateway:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      AVAILABILITY_SERVICE_URL: http://availability-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      FEEDBACK_SERVICE_URL: http://feedback-service:8085
    depends_on:
      - identity-service
      - restaurant-service
      - availability-service
      - booking-service
      - feedback-service

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki-net
  alloy:
    image: grafana/alloy:v1.20.1
    user: "0:0"
    restart: unless-stopped
    privileged: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /run/user/1001/docker.sock:/var/run/docker.sock:ro
      - /run/user/1001/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /home/restourant/.local/share/docker:/var/lib/docker:ro
      - /home/restourant/.local/share/docker:/home/restourant/.local/share/docker:ro
      - /home/restourant/.local/share/docker/containerd/daemon:/var/lib/containerd:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    depends_on:
      - loki
      - prometheus
    networks:
      - loki-net

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default
      - loki-net

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    networks:
      - loki-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - loki-net

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
