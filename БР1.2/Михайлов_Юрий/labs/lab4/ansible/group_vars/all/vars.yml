---
target_user: "{{ lookup('env', 'USER') }}"
project_dir: "{{ playbook_dir | dirname }}"
gateway_port: "8000"

service_envs:
  user_service/.env:
    APP_PORT: "8000"
    APP_HOST: "0.0.0.0"
    APP_PROTOCOL: "http"
    APP_API_PREFIX: "/api"
    DATABASE_HOST: "auth-db"
    DATABASE_PORT: "5432"
    POSTGRES_DB: "maindb"
    POSTGRES_USER: "maindb"
    POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    AUTH_SERVICE_URL: "http://auth-service:8000"
    RABBITMQ_URL: "{{ vault_rabbitmq_url }}"
    DB_ENTITIES: "dist/models/*.entity.js"
    DB_SUBSCRIBERS: "dist/models/*.subscriber.js"
    NODE_ENV: "production"

  property_service/.env:
    APP_PORT: "8001"
    APP_HOST: "0.0.0.0"
    APP_PROTOCOL: "http"
    APP_API_PREFIX: "/api"
    DATABASE_HOST: "property-db"
    DATABASE_PORT: "5432"
    POSTGRES_DB: "maindb"
    POSTGRES_USER: "maindb"
    POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    AUTH_SERVICE_URL: "http://auth-service:8000"
    BOOKING_SERVICE_URL: "http://booking-service:8002"
    ENGAGEMENT_SERVICE_URL: "http://engagement-service:8003"
    RABBITMQ_URL: "{{ vault_rabbitmq_url }}"
    DB_ENTITIES: "dist/models/*.entity.js"
    DB_SUBSCRIBERS: "dist/models/*.subscriber.js"
    NODE_ENV: "production"

  booking_service/.env:
    APP_PORT: "8002"
    APP_HOST: "0.0.0.0"
    APP_PROTOCOL: "http"
    APP_API_PREFIX: "/api"
    DATABASE_HOST: "booking-db"
    DATABASE_PORT: "5432"
    POSTGRES_DB: "maindb"
    POSTGRES_USER: "maindb"
    POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    AUTH_SERVICE_URL: "http://auth-service:8000"
    PROPERTY_SERVICE_URL: "http://property-service:8001"
    RABBITMQ_URL: "{{ vault_rabbitmq_url }}"
    DB_ENTITIES: "dist/models/*.entity.js"
    DB_SUBSCRIBERS: "dist/models/*.subscriber.js"
    NODE_ENV: "production"

  engagement_service/.env:
    APP_PORT: "8003"
    APP_HOST: "0.0.0.0"
    APP_PROTOCOL: "http"
    APP_API_PREFIX: "/api"
    DATABASE_HOST: "engagement-db"
    DATABASE_PORT: "5432"
    POSTGRES_DB: "maindb"
    POSTGRES_USER: "maindb"
    POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    AUTH_SERVICE_URL: "http://auth-service:8000"
    PROPERTY_SERVICE_URL: "http://property-service:8001"
    BOOKING_SERVICE_URL: "http://booking-service:8002"
    RABBITMQ_URL: "{{ vault_rabbitmq_url }}"
    DB_ENTITIES: "dist/models/*.entity.js"
    DB_SUBSCRIBERS: "dist/models/*.subscriber.js"
    NODE_ENV: "production"
