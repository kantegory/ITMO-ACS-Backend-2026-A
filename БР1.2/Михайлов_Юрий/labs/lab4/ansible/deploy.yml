---
- name: Настройка сервера и деплой микросервисов
  hosts: app_servers
  become: true

  tasks:
    # Установка системных пакетов
      - name: Обновление кэша пакетов и установка базовых утилит
        ansible.builtin.apt:
          name:
            - ca-certificates
            - curl
            - git
            - ufw
          state: present
          update_cache: yes

      - name: Удаление старых пакетов Docker
        ansible.builtin.apt:
          name:
            - docker.io
            - docker-compose
            - docker-doc
            - docker-buildx
            - podman-docker
            - containerd
            - runc
          state: absent
          purge: yes

      - name: Установка зависимостей для репозитория Docker
        ansible.builtin.apt:
          name:
            - ca-certificates
            - curl
            - gnupg
          state: present
          update_cache: yes

      - name: Создание директории keyrings
        ansible.builtin.file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Добавление GPG-ключа Docker
        ansible.builtin.get_url:
          url: https://download.docker.com/linux/debian/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'

      - name: Добавление APT-репозитория Docker
        ansible.builtin.apt_repository:
          repo: >-
            deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
            signed-by=/etc/apt/keyrings/docker.asc]
            https://download.docker.com/linux/debian
            {{ ansible_distribution_release }} stable
          filename: docker
          state: present
          update_cache: yes

      - name: Установка Docker CE, Buildx и Compose
        ansible.builtin.apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present
          update_cache: yes

      # Настройка окружения
      - name: Запуск службы Docker и добавление в автозагрузку
        ansible.builtin.systemd:
          name: docker
          state: started
          enabled: yes

      - name: Добавление пользователя в группу docker
        ansible.builtin.user:
          name: "{{ target_user }}"
          groups: docker
          append: yes

      - name: Настройка фаервола UFW (разрешаем SSH и порт Gateway)
        community.general.ufw:
          rule: allow
          port: "{{ item }}"
          proto: tcp
        loop:
          - "22"
          - "{{ gateway_port }}"

      - name: Включение фаервола UFW
        community.general.ufw:
          state: enabled
          policy: deny

      - name: Генерация файлов .env для каждого микросервиса
        ansible.builtin.copy:
          dest: "{{ project_dir }}/{{ item.key }}"
          owner: "{{ target_user }}"
          group: "{{ target_user }}"
          mode: '0600'
          content: |
            {% for env_key, env_val in item.value.items() %}
            {{ env_key }}={{ env_val }}
            {% endfor %}
        loop: "{{ service_envs | dict2items }}"
        no_log: true

      # Запуск сервисов
      - name: Сборка образов и запуск контейнеров через Docker Compose
        community.docker.docker_compose_v2:
          project_src: "{{ project_dir }}"
          state: present
          build: always
