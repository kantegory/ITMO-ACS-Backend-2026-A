events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }
    upstream property_service {
        server property-service:8001;
    }
    upstream booking_service {
        server booking-service:8002;
    }
    upstream engagement_service {
        server engagement-service:8003;
    }

        server {
            listen 80;
            client_max_body_size 20m;

            location /auth/docs/ {
                proxy_pass http://auth_service/docs/;
            }

            location /property/docs/ {
                proxy_pass http://property_service/docs/;
            }

            location /booking/docs/ {
                proxy_pass http://booking_service/docs/;
            }

            location /engagement/docs/ {
                proxy_pass http://engagement_service/docs/;
            }

            location /auth/ {
                proxy_pass http://auth_service/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /property/ {
                proxy_pass http://property_service/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /booking/ {
                proxy_pass http://booking_service/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /engagement/ {
                proxy_pass http://engagement_service/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /health {
                return 200 'ok';
                add_header Content-Type text/plain;
            }
        }
}