global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: healthchecks
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: [http://gateway/health, http://auth-service:8000/health, http://property-service:8001/health, http://booking-service:8002/health, http://engagement-service:8003/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}
