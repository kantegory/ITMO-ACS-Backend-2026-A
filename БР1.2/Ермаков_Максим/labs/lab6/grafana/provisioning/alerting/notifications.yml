apiVersion: 1
deleteContactPoints:
  - orgId: 1
    uid: lab6-email-receiver
contactPoints:
  - orgId: 1
    name: lab6-email
    receivers:
      - uid: lab6-email-logs-receiver
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://log-mailer:8080/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: lab6-email
    group_by: [alertname, service]
    group_wait: 10s
    group_interval: 30s
    repeat_interval: 4h
    routes:
      - receiver: lab6-email
        object_matchers:
          - [lab, "=", lab6]
