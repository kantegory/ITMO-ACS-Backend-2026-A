services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:18025:8025"
    restart: unless-stopped
  grafana:
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@example.test
      RECIPES_ALERT_EMAIL: stand@example.test
    volumes:
      - ./alert:/etc/grafana/provisioning/alerting:ro
