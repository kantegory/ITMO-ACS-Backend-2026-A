apiVersion: 1
contactPoints:
  - orgId: 1
    name: Recipes email
    receivers:
      - uid: recipes-email
        type: email
        settings:
          addresses: $RECIPES_ALERT_EMAIL
          singleEmail: true
groups:
  - orgId: 1
    name: recipes-health
    folder: Recipes
    interval: 10s
    rules:
      - uid: recipes-service-down
        title: Recipe service unavailable
        condition: C
        for: 20s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              expr: probe_success
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        annotations:
          summary: "A service readiness endpoint is unavailable"
        notification_settings:
          receiver: Recipes email
          group_wait: 5s
          group_interval: 20s
          repeat_interval: 4h
