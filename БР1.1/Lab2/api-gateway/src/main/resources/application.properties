server.port=${PORT:8080}
spring.application.name=api-gateway
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.swagger-ui.path=/docs
app.jwt-secret=${JWT_SECRET:local-lab2-secret-change-me}
identity-service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}
booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8083}
contract-service.url=${CONTRACT_SERVICE_URL:http://localhost:8084}
communication-service.url=${COMMUNICATION_SERVICE_URL:http://localhost:8085}
review-service.url=${REVIEW_SERVICE_URL:http://localhost:8086}
