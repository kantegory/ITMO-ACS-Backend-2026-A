server.port=${PORT:8083}
spring.application.name=booking-service
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/booking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
springdoc.swagger-ui.path=/docs
app.jwt-secret=${JWT_SECRET:local-lab2-secret-change-me}
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}
contract-service.url=${CONTRACT_SERVICE_URL:http://localhost:8084}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rentease}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rentease}
