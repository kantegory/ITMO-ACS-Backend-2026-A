server.port=${PORT:8085}
spring.application.name=communication-service
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/communication;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
springdoc.swagger-ui.path=/docs
app.jwt-secret=${JWT_SECRET:local-lab2-secret-change-me}
identity-service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}
