services:
  auth-db:
    image: postgres:16
    restart: always
    ports:
      - "15433:5432"
    volumes:
      - ./dbs/auth-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_db
      POSTGRES_PASSWORD: auth_db

  restaurant-db:
    image: postgres:16
