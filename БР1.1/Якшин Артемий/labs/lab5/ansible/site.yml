# ЛР5: конфигурация сервера стенда «Restaurant Booking».
#   ansible-playbook site.yml --check --diff   # сухой прогон
#   ansible-playbook site.yml                  # применение (повторный запуск ничего не меняет)
#   ansible-playbook site.yml --tags edge      # только часть ролей
#
# Сервер общий, поэтому: Docker/sshd/ufw только проверяются (preflight) и никогда не
# перенастраиваются и не перезапускаются; пакеты ставятся state=present без upgrade;
# всё своё — в /opt/rb-sem2 и в docker-ресурсах rb-*.
- name: Restaurant Booking — подготовка и конфигурация сервера
  hosts: rb_servers
  become: true
  roles:
    - { role: preflight, tags: [always] }
    - { role: base, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: stand, tags: [stand] }
    - { role: deploy_access, tags: [deploy_access] }
    - { role: edge, tags: [edge] }
    - { role: app, tags: [app] }
