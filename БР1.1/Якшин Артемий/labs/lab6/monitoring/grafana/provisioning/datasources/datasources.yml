apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: { timeInterval: 15s }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData: { maxLines: 1000 }
  # ЛР8: Prometheus внутри k3d-кластера (NodePort 30090 узла k3d-rb-server-0 в сети rb-edge)
  - name: Prometheus (k8s)
    uid: prometheus-k8s
    type: prometheus
    access: proxy
    url: http://k3d-rb-server-0:30090
    jsonData: { timeInterval: 15s }
