# ЛР6: сбор логов контейнеров через Docker API (service discovery по docker.sock).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # сервер общий: читаем логи только контейнеров стенда (rb-*) и k3d-кластера (ЛР7);
      # чтобы собирать логи всех контейнеров ВМ, достаточно удалить это правило
      - source_labels: [__meta_docker_container_name]
        regex: "/(rb-.*|k3d-rb-.*)"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
