# ЛР8: компонент автоскейлинга, подключается к overlays/prod (ЛР7).
#  - HPA для сервисов, нагружаемых запросами;
#  - spec.replicas у этих Deployment удаляется: иначе каждый `kubectl apply` из CD (ДЗ8)
#    сбрасывал бы число реплик, выставленное HPA;
#  - requests/limits подобраны по результатам нагрузочного теста (см. README ЛР8).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - hpa.yaml
patches:
  - target:
      kind: Deployment
      name: gateway|auth-service|catalog-service|review-service
    patch: |-
      - op: remove
        path: /spec/replicas
  - path: resources.yaml
