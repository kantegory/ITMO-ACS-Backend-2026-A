# ЛР8: горизонтальное автомасштабирование по CPU (metrics-server встроен в k3s)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }   # % от requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0          # реагируем сразу
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120        # не «дёргаемся» при кратких провалах нагрузки
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
