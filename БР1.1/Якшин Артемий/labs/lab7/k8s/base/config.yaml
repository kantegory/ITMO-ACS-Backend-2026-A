apiVersion: v1
kind: ConfigMap
metadata:
  name: rb-config
data:
  JWT_EXPIRES_IN: 7d
---
# database-per-service: отдельная БД для каждого сервиса в одном экземпляре PostgreSQL
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-databases.sql: |
    CREATE DATABASE auth;
    CREATE DATABASE catalog;
    CREATE DATABASE reservations;
    CREATE DATABASE reviews;
    CREATE DATABASE notifications;
