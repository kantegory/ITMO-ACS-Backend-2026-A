apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rb
labels:
  - pairs: { app.kubernetes.io/part-of: restaurant-booking }
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - auth-service.yaml
  - catalog-service.yaml
  - reservation-service.yaml
  - review-service.yaml
  - notification-service.yaml
  - gateway.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - backup.yaml
# Secret rb-secrets создаётся на сервере из /opt/rb-sem2/k8s/secrets.env (в git не хранится)
