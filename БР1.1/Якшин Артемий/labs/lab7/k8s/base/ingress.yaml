# Вход в кластер: Traefik (ingress-контроллер k3s) -> gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-booking
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 3000 }
---
# при добровольных прерываниях (drain узла, обновление) хотя бы одна реплика gateway остаётся
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gateway }
