# PostgreSQL — stateful-компонент: StatefulSet + PVC (local-path) + headless Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: postgres, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, app.kubernetes.io/component: database }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: rb }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rb-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          args: ["-c", "max_connections=200", "-c", "shared_buffers=64MB"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "rb", "-d", "postgres"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "rb", "-d", "postgres"] }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: pg }
