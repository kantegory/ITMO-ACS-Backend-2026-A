apiVersion: v1
kind: Namespace
metadata:
  name: rb
  labels:
    app.kubernetes.io/part-of: restaurant-booking
    # Pod Security Admission: привилегированные поды запрещены (baseline);
    # сервисы приложения соответствуют и профилю restricted — нарушения пишутся в аудит
    # (официальные образы PostgreSQL/RabbitMQ стартуют от root и restricted не проходят)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
