# Точка входа CD (ДЗ8): deploy.sh подставляет тег образов = SHA коммита
#   kustomize edit set image ...  (во временной копии) -> kubectl apply -k
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# ЛР8: HPA и подобранные requests/limits
components:
  - ../../../../lab8/k8s/autoscaling
images:
  - { name: rb-gateway, newName: ghcr.io/cicada-pops/rb-gateway, newTag: latest }
  - { name: rb-auth-service, newName: ghcr.io/cicada-pops/rb-auth-service, newTag: latest }
  - { name: rb-catalog-service, newName: ghcr.io/cicada-pops/rb-catalog-service, newTag: latest }
  - { name: rb-reservation-service, newName: ghcr.io/cicada-pops/rb-reservation-service, newTag: latest }
  - { name: rb-review-service, newName: ghcr.io/cicada-pops/rb-review-service, newTag: latest }
  - { name: rb-notification-service, newName: ghcr.io/cicada-pops/rb-notification-service, newTag: latest }
