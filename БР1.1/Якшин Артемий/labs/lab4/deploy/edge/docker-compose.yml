# ЛР4: edge-nginx — единственная публичная точка входа всех стендов (порт 8088).
# 80/443 на сервере заняты другим проектом, поэтому используется отдельный порт.
# Маршруты: /  → API Gateway (compose-стенд), остальные — подключаемые файлы conf.d/*.conf
# (ЛР6: /grafana/, ЛР7: /k8s/, ДЗ9: /docs/).
name: rb-edge

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: rb-edge-nginx
    restart: unless-stopped
    cpuset: "2,3"
    ports:
      - "8088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/rb.d:ro
      - ./html:/usr/share/nginx/html:ro
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 64M }

networks:
  edge:
    name: rb-edge
    external: true
