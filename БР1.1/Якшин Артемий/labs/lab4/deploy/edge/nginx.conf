# ЛР4: nginx в режиме обратного прокси перед API Gateway.
worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 30s;

  # время ответа апстрима в access-логе — пригодится в ЛР6/ЛР8
  log_format main_ext '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
  access_log /dev/stdout main_ext;
  error_log  /dev/stderr warn;

  # встроенный DNS Docker: имена апстримов перечитываются каждые 10 с,
  # поэтому пересоздание контейнера gateway (деплой из CI) не ломает прокси
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types application/json application/yaml text/css application/javascript text/plain;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;

  server {
    listen 8080 default_server;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # служебные метрики сервисов наружу не отдаём (их собирает Prometheus внутри сети)
    location = /metrics { return 404; }

    # дополнительные маршруты из следующих работ
    include /etc/nginx/rb.d/*.conf;

    location / {
      set $gateway http://rb-gateway:3000;
      proxy_pass $gateway;
    }
  }
}
