# ЛР7: стенд в Kubernetes (k3d). Ingress-контроллер Traefik работает внутри узла k3d-rb-server-0
# (сеть rb-edge); префикс /k8s/ срезается, приложение видит обычные пути /api/v1/..., /health
location = /k8s { return 301 /k8s/; }
location = /k8s/metrics { return 404; }

location /k8s/ {
  set $k8s http://k3d-rb-server-0:80;
  rewrite ^/k8s/(.*)$ /$1 break;
  proxy_pass $k8s;
}
