# ЛР6: Grafana за edge-nginx (Grafana настроена на подпуть: GF_SERVER_SERVE_FROM_SUB_PATH=true)
location /grafana/ {
  set $grafana http://rb-grafana:3000;
  proxy_pass $grafana;
}

# Grafana Live (WebSocket). Внимание: если в location задан хоть один proxy_set_header,
# заголовки уровня http не наследуются — поэтому они перечислены здесь заново.
location /grafana/api/live/ {
  set $grafana http://rb-grafana:3000;
  proxy_pass $grafana;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
  proxy_read_timeout 3600s;
}
