# ДЗ9: документация «Restaurant Booking» (MkDocs + Material). Сборка: mkdocs build --strict
site_name: Restaurant Booking — документация
site_description: Микросервисное приложение бронирования столиков (курс «Бэк-энд разработка», ИТМО)
site_author: Якшин Артемий
site_url: https://cicada-pops.github.io/itmo-backend-sem2/
repo_url: https://github.com/cicada-pops/itmo-backend-sem2
repo_name: itmo-backend-sem2
edit_uri: ""
copyright: Якшин Артемий, БР1.1 — курс «Бэк-энд разработка», 2026

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Тёмная тема }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Светлая тема }

plugins:
  - search:
      lang: [ru, en]
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - API:
      - Обзор и аутентификация: api/index.md
      - Публичный API (Swagger): api/public.md
      - Внутренний API сервисов: api/internal.md
      - События RabbitMQ: api/events.md
      - Postman: api/postman.md
  - Запуск и развёртывание:
      - Локально (docker compose): deploy/local.md
      - Сервер (ЛР4, nginx): deploy/server.md
      - Kubernetes (ЛР7): deploy/kubernetes.md
      - CI/CD: deploy/cicd.md
  - Эксплуатация:
      - Мониторинг и логи: ops/monitoring.md
      - Нагрузка и SLO: ops/load.md
      - Runbook: ops/runbook.md
