<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245b7a"/>
    </marker>
    <marker id="arrow-tan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d3b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d5a"/>
    </marker>
    <style>
      .service { fill: #eaf2f8; stroke: #245b7a; stroke-width: 2; }
      .database { fill: #f7f3e8; stroke: #8a6d3b; stroke-width: 2; }
      .neutral { fill: #f4f7f9; stroke: #245b7a; stroke-width: 2; }
      .call { fill: #eef7f0; stroke: #2f7d5a; stroke-width: 2; }
      .panel { fill: #f8fafb; stroke: #c9d2d8; stroke-width: 2; }
      .rule { fill: #fafafa; stroke: #bdbdbd; stroke-width: 2; }
      .label { fill: #111; font-family: Arial, sans-serif; font-size: 22px; text-anchor: middle; }
      .section { fill: #111; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .small { fill: #333; font-family: Arial, sans-serif; font-size: 16px; text-anchor: middle; }
      .tiny { fill: #333; font-family: Arial, sans-serif; font-size: 15px; text-anchor: middle; }
      .tiny-bold { fill: #111; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .public { stroke: #245b7a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .data { stroke: #8a6d3b; stroke-width: 2.5; fill: none; marker-end: url(#arrow-tan); }
      .internal { stroke: #2f7d5a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="800" y="42" class="section">RentEase target microservice architecture</text>

  <rect x="60" y="65" width="250" height="70" rx="9" class="neutral"/>
  <text x="185" y="98" class="tiny-bold">Web / mobile client</text>
  <text x="185" y="122" class="tiny">external user</text>
  <rect x="630" y="65" width="340" height="70" rx="9" class="service"/>
  <text x="800" y="98" class="label">API Gateway</text>
  <text x="800" y="122" class="small">public REST API, JWT</text>
  <path d="M310 100 L630 100" class="public"/>
  <path d="M800 135 L800 165" class="public"/>
  <text x="800" y="151" class="tiny">public REST routes</text>
  <path d="M150 165 L1450 165" stroke="#245b7a" stroke-width="2.5" fill="none"/>

  <g>
    <path d="M150 165 L150 205" class="public"/>
    <rect x="50" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="150" y="237" class="label">Identity</text>
    <text x="150" y="263" class="small">users, roles, tokens</text>
    <path d="M150 280 L150 315" class="data"/>
    <rect x="55" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="150" y="348" class="label">identity_db</text>
  </g>
  <g>
    <path d="M410 165 L410 205" class="public"/>
    <rect x="310" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="410" y="237" class="label">Property</text>
    <text x="410" y="263" class="small">properties, favorites</text>
    <path d="M410 280 L410 315" class="data"/>
    <rect x="315" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="410" y="348" class="label">property_db</text>
  </g>
  <g>
    <path d="M670 165 L670 205" class="public"/>
    <rect x="570" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="670" y="237" class="label">Booking</text>
    <text x="670" y="263" class="small">bookings, date rules</text>
    <path d="M670 280 L670 315" class="data"/>
    <rect x="575" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="670" y="348" class="label">booking_db</text>
  </g>
  <g>
    <path d="M930 165 L930 205" class="public"/>
    <rect x="830" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="930" y="237" class="label">Contract</text>
    <text x="930" y="263" class="small">contracts, payments</text>
    <path d="M930 280 L930 315" class="data"/>
    <rect x="835" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="930" y="348" class="label">contract_db</text>
  </g>
  <g>
    <path d="M1190 165 L1190 205" class="public"/>
    <rect x="1090" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="1190" y="237" class="tiny-bold">Communication</text>
    <text x="1190" y="263" class="small">messages, dialogs</text>
    <path d="M1190 280 L1190 315" class="data"/>
    <rect x="1095" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="1190" y="348" class="label">communication_db</text>
  </g>
  <g>
    <path d="M1450 165 L1450 205" class="public"/>
    <rect x="1350" y="205" width="200" height="75" rx="9" class="service"/>
    <text x="1450" y="237" class="label">Review</text>
    <text x="1450" y="263" class="small">reviews</text>
    <path d="M1450 280 L1450 315" class="data"/>
    <rect x="1355" y="315" width="190" height="55" rx="9" class="database"/>
    <text x="1450" y="348" class="label">review_db</text>
  </g>

  <text x="800" y="410" class="section">Internal REST calls</text>
  <text x="800" y="436" class="tiny">arrow direction: caller  -&gt;  callee</text>
  <rect x="50" y="452" width="1500" height="348" rx="9" class="panel"/>

  <g>
    <rect x="90" y="494" width="285" height="42" rx="8" class="call"/>
    <text x="232" y="521" class="tiny-bold">Booking Service</text>
    <path d="M375 515 L1225 515" class="internal"/>
    <text x="800" y="503" class="tiny">GET property summary / ownership</text>
    <rect x="1225" y="494" width="285" height="42" rx="8" class="call"/>
    <text x="1367" y="521" class="tiny-bold">Property Service</text>
  </g>
  <g>
    <rect x="90" y="544" width="285" height="42" rx="8" class="call"/>
    <text x="232" y="571" class="tiny-bold">Booking Service</text>
    <path d="M375 565 L1225 565" class="internal"/>
    <text x="800" y="553" class="tiny">POST confirmed booking snapshot</text>
    <rect x="1225" y="544" width="285" height="42" rx="8" class="call"/>
    <text x="1367" y="571" class="tiny-bold">Contract and Billing</text>
  </g>
  <g>
    <rect x="90" y="594" width="285" height="42" rx="8" class="call"/>
    <text x="232" y="621" class="tiny-bold">Communication Service</text>
    <path d="M375 615 L1225 615" class="internal"/>
    <text x="800" y="603" class="tiny">GET recipient status</text>
    <rect x="1225" y="594" width="285" height="42" rx="8" class="call"/>
    <text x="1367" y="621" class="tiny-bold">Identity Service</text>
  </g>
  <g>
    <rect x="90" y="644" width="285" height="42" rx="8" class="call"/>
    <text x="232" y="671" class="tiny-bold">Communication Service</text>
    <path d="M375 665 L1225 665" class="internal"/>
    <text x="800" y="653" class="tiny">GET property summary</text>
    <rect x="1225" y="644" width="285" height="42" rx="8" class="call"/>
    <text x="1367" y="671" class="tiny-bold">Property Service</text>
  </g>
  <g>
    <rect x="90" y="694" width="285" height="42" rx="8" class="call"/>
    <text x="232" y="721" class="tiny-bold">Review Service</text>
    <path d="M375 715 L1225 715" class="internal"/>
    <text x="800" y="703" class="tiny">GET review eligibility</text>
    <rect x="1225" y="694" width="285" height="42" rx="8" class="call"/>
    <text x="1367" y="721" class="tiny-bold">Contract and Billing</text>
  </g>

  <rect x="230" y="830" width="1140" height="90" rx="9" class="rule"/>
  <text x="800" y="860" class="label">Database-per-service rule</text>
  <text x="800" y="891" class="small">No cross-database SQL or foreign keys. Services exchange UUIDs and API contracts.</text>
</svg>
