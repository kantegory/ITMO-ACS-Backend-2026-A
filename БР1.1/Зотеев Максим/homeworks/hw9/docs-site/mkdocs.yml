site_name: Rental Platform — Техническая документация
site_description: Документация микросервисного бэкенд-приложения сервиса аренды недвижимости (ИТМО, БР1.1, Зотеев Максим)
site_author: Зотеев Максим (БР1.1)

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Обзор: index.md
  - Архитектура:
      - Общая архитектура и БД: architecture/overview.md
      - Развёртывание и CI/CD: architecture/deployment.md
  - API и контракты:
      - Внешний REST API (OpenAPI / Swagger): api/external.md
      - Межсервисный API (Internal): api/internal.md
      - События RabbitMQ и Outbox: api/events.md
  - Тестирование и эксплуатация:
      - Коллекция Postman и Newman: testing/postman.md
      - Мониторинг, SLA/SLO и автоскейлинг: operations/monitoring.md
