---
# ДЗ8, Зотеев Максим БР1.1: выделенная учётная запись для CI/CD-деплоя в namespace rental-lab7.
# Права ограничены рабочими нагрузками приложения и сервисами; доступа к Secret и cluster-admin нет.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: rental-lab7
---
# Постоянный токен для ServiceAccount (Kubernetes 1.24+ не создаёт его автоматически).
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: rental-lab7
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: rental-lab7
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: rental-lab7
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: rental-lab7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
