---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize
  namespace: rental-lab7
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: initialize
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: initialize
        image: ${IMAGE}
        workingDir: "/app"
        command:
        - node
        - "/scripts/initialize.cjs"
        envFrom:
        - configMapRef:
            name: database
        - secretRef:
            name: broker-client
        env:
        - name: DB_CA_FILE
          value: "/ca/pg-ca.pem"
        - name: NODE_EXTRA_CA_CERTS
          value: "/ca/rabbit-ca.pem"
        - name: DB_SYNCHRONIZE
          value: 'false'
        volumeMounts:
        - name: ca
          mountPath: "/ca"
          readOnly: true
        - name: scripts
          mountPath: "/scripts"
          readOnly: true
        - name: roles
          mountPath: "/roles"
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 600m
            memory: 300Mi
      volumes:
      - name: scripts
        configMap:
          name: cloud-scripts
      - name: ca
        configMap:
          name: ca
      - name: roles
        secret:
          secretName: pg-roles
      restartPolicy: Never
