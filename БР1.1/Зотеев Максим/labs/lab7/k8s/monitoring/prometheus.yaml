---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: rental-lab7
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: rental-lab7
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: rental-lab7
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: rental-lab7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rental-lab7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: monitor-settings
          mountPath: "/etc/prom/prometheus.yml"
          subPath: prometheus.yml
          readOnly: true
        - name: storage
          mountPath: "/prometheus"
        readinessProbe:
          tcpSocket:
            port: 9090
          periodSeconds: 5
        resources:
          requests:
            cpu: 35m
            memory: 64Mi
          limits:
            cpu: 600m
            memory: 384Mi
        args:
        - "--config.file=/etc/prom/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=2h"
      volumes:
      - name: monitor-settings
        configMap:
          name: monitor-settings
      - name: storage
        emptyDir: {}
      securityContext:
        fsGroup: 65534
      serviceAccountName: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rental-lab7
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: rental-lab7
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - grafana
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchExpressions:
        - key: k8s-app
          operator: In
          values:
          - coredns
          - kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - node-exporter
    ports:
    - protocol: TCP
      port: 9100
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - blackbox
    ports:
    - protocol: TCP
      port: 9115
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - rabbit
    ports:
    - protocol: TCP
      port: 15692
