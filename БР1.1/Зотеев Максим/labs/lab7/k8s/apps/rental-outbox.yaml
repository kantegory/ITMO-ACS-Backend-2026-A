---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-outbox
  namespace: rental-lab7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rental-outbox
  template:
    metadata:
      labels:
        app: rental-outbox
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: rental-outbox
        image: ${IMAGE}
        workingDir: "/app"
        command:
        - node
        - "/app/services/rental-service/outbox/relay.cjs"
        envFrom:
        - configMapRef:
            name: database
        - secretRef:
            name: db-rental
        - secretRef:
            name: broker-client
        env:
        - name: DB_CA_FILE
          value: "/ca/pg-ca.pem"
        - name: NODE_EXTRA_CA_CERTS
          value: "/ca/rabbit-ca.pem"
        - name: DB_SYNCHRONIZE
          value: 'false'
        volumeMounts:
        - name: ca
          mountPath: "/ca"
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 600m
            memory: 300Mi
        livenessProbe:
          exec:
            command:
            - node
            - "-e"
            - process.exit(Date.now() - Number(require("fs").readFileSync("/tmp/relay-heartbeat", "utf8")) < 60000 ? 0 : 1)
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 2
      volumes:
      - name: ca
        configMap:
          name: ca
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: rental-outbox
            topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rental-outbox
  namespace: rental-lab7
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rental-outbox
