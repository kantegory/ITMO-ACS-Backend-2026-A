---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-public
  namespace: rental-lab7
  annotations:
    service.beta.kubernetes.io/upcloud-load-balancer-config: '{"plan": "production-small", "frontends": [{"name": "https", "port": 443, "mode": "http"}]}'
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - name: https
    port: 443
    targetPort: http
