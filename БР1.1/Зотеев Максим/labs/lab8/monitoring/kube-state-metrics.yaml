---
# ЛР8, Зотеев Максим БР1.1: kube-state-metrics в namespace rental-lab7
# для отображения метрик HPA, Deployment и подов в Grafana.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "resourcequotas", "replicationcontrollers", "limitranges", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: rental-lab7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - "--namespaces=rental-lab7"
            - "--resources=deployments,horizontalpodautoscalers,pods,poddisruptionbudgets,replicasets"
            - "--port=8080"
          ports:
            - name: http-metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: rental-lab7
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [coredns, kube-dns]
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# Разрешаем Prometheus опрашивать kube-state-metrics:8080 (egress на 443/6443 уже открыт в lab7/prometheus.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-lab8-extra
  namespace: rental-lab7
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
---
# Разрешаем Prometheus читать метрики cAdvisor узлов через Kubernetes API proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-rental-lab8-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-rental-lab8-nodes
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: rental-lab7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-rental-lab8-nodes
