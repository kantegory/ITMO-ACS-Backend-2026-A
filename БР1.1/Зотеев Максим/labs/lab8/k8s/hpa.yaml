---
# ЛР8, Зотеев Максим БР1.1: HorizontalPodAutoscaler (autoscaling/v2)
# Пороги CPU и диапазоны реплик откалиброваны по результатам базового стресс-прогона
# (130 VU, 89 658 запросов, 329 req/s) и tuned requests/limits.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: rental-lab7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 90
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
