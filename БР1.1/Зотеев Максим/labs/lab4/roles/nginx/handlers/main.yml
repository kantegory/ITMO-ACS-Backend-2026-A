# Оба обработчика слушают одно событие и выполняются по порядку:
# сначала nginx -t, и только если конфигурация валидна — reload.
- name: Проверка конфигурации nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Перезагрузить nginx

- name: Перезагрузка nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Перезагрузить nginx
