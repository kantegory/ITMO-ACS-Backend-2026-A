openapi: 3.0.3
info:
  title: Reservations Service
  version: 1.0.0
servers:
  - url: http://localhost:3004
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /api/reservations:
    post:
      summary: Create reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurant: { type: integer }
                start_time: { type: string, format: date-time }
                guest_count: { type: integer }
      responses:
        '200': { description: Created }
      security:
        - bearerAuth: []
