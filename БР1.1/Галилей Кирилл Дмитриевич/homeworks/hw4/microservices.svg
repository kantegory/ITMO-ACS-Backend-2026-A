<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="50" y="30" width="1500" height="70" rx="8" fill="#1e293b" />
  <text x="80" y="74" fill="#ffffff" font-size="24" font-weight="bold">Микросервисная архитектура: Сервис бронирования столиков (ДЗ4)</text>
  <text x="1250" y="74" fill="#94a3b8" font-size="16">Галилей К. Д. | К3340 (БР1.1)</text>

  <!-- Legend -->
  <rect x="50" y="115" width="1500" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <line x1="80" y1="135" x2="120" y2="135" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="130" y="140" fill="#334155" font-size="13" font-weight="600">Синхронный HTTP / REST</text>
  
  <line x1="330" y1="135" x2="370" y2="135" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />
  <text x="380" y="140" fill="#334155" font-size="13" font-weight="600">Асинхронный AMQP (RabbitMQ)</text>

  <rect x="630" y="125" width="20" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" />
  <text x="660" y="140" fill="#334155" font-size="13">Database-per-Service (PostgreSQL)</text>

  <!-- CLIENTS -->
  <g transform="translate(100, 480)" filter="url(#shadow)">
    <rect width="200" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path d="M 0 0 L 200 0 L 200 35 L 0 35 Z" fill="#64748b" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">Клиенты</text>
    <text x="15" y="65" fill="#334155" font-size="13">• Web Browser (SPA)</text>
    <text x="15" y="95" fill="#334155" font-size="13">• Mobile App (iOS/Android)</text>
    <text x="15" y="125" fill="#334155" font-size="13">• Postman / API Tests</text>
  </g>

  <!-- API GATEWAY -->
  <g transform="translate(400, 420)" filter="url(#shadow)">
    <rect width="220" height="260" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0ea5e9" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">API Gateway (Nginx)</text>
    <text x="15" y="65" fill="#0369a1" font-size="12" font-weight="600">Reverse Proxy &amp; SSL</text>
    <text x="15" y="95" fill="#334155" font-size="12">Port 80 / 443 (5000)</text>
    <line x1="15" y1="110" x2="205" y2="110" stroke="#e2e8f0" />
    <text x="15" y="130" fill="#64748b" font-size="11">Маршрутизация:</text>
    <text x="15" y="150" fill="#0f172a" font-size="11">• /api/v1/auth/* → :5001</text>
    <text x="15" y="175" fill="#0f172a" font-size="11">• /api/v1/restaurants/* → :5002</text>
    <text x="15" y="200" fill="#0f172a" font-size="11">• /api/v1/reservations/* → :5003</text>
    <text x="15" y="225" fill="#0f172a" font-size="11">• /docs → Swagger UI</text>
  </g>

  <!-- Client to Gateway -->
  <path d="M 300 550 L 400 550" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" />

  <!-- SERVICE 1: AUTH -->
  <g transform="translate(740, 200)" filter="url(#shadow)">
    <rect width="320" height="160" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 35 L 0 35 Z" fill="#9333ea" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">auth-service (Port 5001)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• Регистрация и логин (JWT)</text>
    <text x="15" y="85" fill="#334155" font-size="12">• Валидация токенов и ролей</text>
    <text x="15" y="110" fill="#334155" font-size="12">• Профили пользователей</text>
    <text x="15" y="135" fill="#6b21a8" font-size="11" font-weight="600">Стек: Node.JS, Express, TypeORM</text>
  </g>
  <!-- AUTH DB -->
  <g transform="translate(1160, 220)" filter="url(#shadow)">
    <rect width="240" height="120" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
    <text x="15" y="30" fill="#6b21a8" font-size="14" font-weight="bold">auth_db (PostgreSQL)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• Таблица: users</text>
    <text x="15" y="85" fill="#64748b" font-size="11">Роли: customer, manager, admin</text>
  </g>
  <path d="M 1060 280 L 1160 280" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- SERVICE 2: RESTAURANT -->
  <g transform="translate(740, 420)" filter="url(#shadow)">
    <rect width="320" height="180" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 35 L 0 35 Z" fill="#2563eb" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">restaurant-service (Port 5002)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• Каталог ресторанов, поиск, фильтры</text>
    <text x="15" y="85" fill="#334155" font-size="12">• Меню блюд и категории</text>
    <text x="15" y="110" fill="#334155" font-size="12">• Столики и проверка доступности</text>
    <text x="15" y="135" fill="#334155" font-size="12">• Отзывы и средний рейтинг</text>
    <text x="15" y="160" fill="#1d4ed8" font-size="11" font-weight="600">Стек: Node.JS, Express, TypeORM</text>
  </g>
  <!-- RESTAURANT DB -->
  <g transform="translate(1160, 440)" filter="url(#shadow)">
    <rect width="240" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="15" y="30" fill="#1d4ed8" font-size="14" font-weight="bold">restaurant_db (PostgreSQL)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• restaurants</text>
    <text x="15" y="80" fill="#334155" font-size="12">• restaurant_tables</text>
    <text x="15" y="100" fill="#334155" font-size="12">• menu_items</text>
    <text x="15" y="120" fill="#334155" font-size="12">• reviews</text>
  </g>
  <path d="M 1060 510 L 1160 510" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- SERVICE 3: BOOKING -->
  <g transform="translate(740, 660)" filter="url(#shadow)">
    <rect width="320" height="170" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 35 L 0 35 Z" fill="#16a34a" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">booking-service (Port 5003)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• Создание бронирования столиков</text>
    <text x="15" y="85" fill="#334155" font-size="12">• Контроль овербукинга (конфликты)</text>
    <text x="15" y="110" fill="#334155" font-size="12">• История бронирований и смена статусов</text>
    <text x="15" y="135" fill="#334155" font-size="12">• Публикация событий в RabbitMQ</text>
    <text x="15" y="155" fill="#15803d" font-size="11" font-weight="600">Стек: Node.JS, Express, TypeORM</text>
  </g>
  <!-- BOOKING DB -->
  <g transform="translate(1160, 680)" filter="url(#shadow)">
    <rect width="240" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="15" y="30" fill="#15803d" font-size="14" font-weight="bold">booking_db (PostgreSQL)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• reservations</text>
    <text x="15" y="85" fill="#64748b" font-size="11">Индексы: table_id, date, status</text>
  </g>
  <path d="M 1060 745 L 1160 745" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- MESSAGE BROKER: RABBITMQ -->
  <g transform="translate(740, 890)" filter="url(#shadow)">
    <rect width="320" height="140" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 35 L 0 35 Z" fill="#ea580c" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">RabbitMQ Message Broker (Port 5672)</text>
    <text x="15" y="60" fill="#334155" font-size="12">Exchange: restaurant_events (topic)</text>
    <text x="15" y="85" fill="#334155" font-size="12">Routing key: reservation.created / cancelled</text>
    <text x="15" y="110" fill="#334155" font-size="12">Queue: notifications_queue</text>
  </g>

  <!-- SERVICE 4: NOTIFICATION -->
  <g transform="translate(1160, 890)" filter="url(#shadow)">
    <rect width="320" height="140" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 35 L 0 35 Z" fill="#ea580c" />
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">notification-service (Port 5004)</text>
    <text x="15" y="60" fill="#334155" font-size="12">• Фоновый Consumer очередей</text>
    <text x="15" y="85" fill="#334155" font-size="12">• Отправка Email / Push гостю</text>
    <text x="15" y="110" fill="#334155" font-size="12">• Уведомление менеджеру ресторана</text>
  </g>

  <!-- CONNECTIONS FROM GATEWAY -->
  <path d="M 620 480 L 680 480 L 680 280 L 740 280" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <path d="M 620 520 L 740 520" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <path d="M 620 560 L 680 560 L 680 745 L 740 745" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- INTER-SERVICE: Booking -> Restaurant (HTTP Table Validation) -->
  <path d="M 900 660 L 900 600" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-blue)" />
  <text x="910" y="635" fill="#2563eb" font-size="11">GET /internal/tables/:id</text>

  <!-- ASYNC EVENT: Booking -> RabbitMQ -->
  <path d="M 900 830 L 900 890" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-orange)" />
  <text x="910" y="865" fill="#ea580c" font-size="11" font-weight="bold">publish(reservation.created)</text>

  <!-- ASYNC EVENT: RabbitMQ -> Notification -->
  <path d="M 1060 960 L 1160 960" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-orange)" />
  <text x="1070" y="950" fill="#ea580c" font-size="11" font-weight="bold">consume</text>
</svg>