openapi: 3.0.3
info:
  title: Inter-Service Internal API
  description: Контракты межсервисного взаимодействия между микросервисами сервиса бронирования столиков (ДЗ4).
  version: 1.0.0
servers:
  - url: http://internal-cluster.local

paths:
  /internal/auth/verify:
    get:
      summary: Внутренняя проверка JWT токена и ролей
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Токен валиден, возвращен субъект
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  role:
                    type: string
        '401':
          description: Токен недействителен

  /internal/restaurants/{restaurantId}/tables/{tableId}/verify:
    get:
      summary: Проверка существования и активности столика перед бронированием
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Столик существует и активен
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  capacity:
                    type: integer
                  isActive:
                    type: boolean
        '404':
          description: Столик или ресторан не найден
