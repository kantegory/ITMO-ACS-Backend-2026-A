name: CI/CD Pipeline - Restaurant Booking Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'БР1.1/Галилей Кирилл Дмитриевич/labs/lab1/package.json'

      - name: Install dependencies (Lab 1)
        run: |
          cd "БР1.1/Галилей Кирилл Дмитриевич/labs/lab1"
          npm install

      - name: Build TypeScript
        run: |
          cd "БР1.1/Галилей Кирилл Дмитриевич/labs/lab1"
          npm run build

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remote SSH deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/restaurant-booking
            git pull origin main
            cd "БР1.1/Галилей Кирилл Дмитриевич/labs/lab3"
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d --build
            sudo systemctl reload nginx
