<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
    <marker id="crow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 M 12 0 L 12 12" fill="none" stroke="#4a5568" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="50" y="30" width="1500" height="70" rx="8" fill="#1e293b" />
  <text x="80" y="74" fill="#ffffff" font-size="24" font-weight="bold">ERD Диаграмма: Сервис бронирования столиков в ресторанах (Вариант 1)</text>
  <text x="1250" y="74" fill="#94a3b8" font-size="16">Галилей К. Д. | Группа К3340 (БР1.1)</text>

  <!-- LEGEND -->
  <rect x="50" y="115" width="1500" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="80" cy="135" r="7" fill="#3b82f6" />
  <text x="95" y="140" fill="#334155" font-size="13" font-weight="600">Основные сущности</text>
  <circle cx="280" cy="135" r="7" fill="#10b981" />
  <text x="295" y="140" fill="#334155" font-size="13" font-weight="600">Бронирования и транзакции</text>
  <circle cx="520" cy="135" r="7" fill="#f59e0b" />
  <text x="535" y="140" fill="#334155" font-size="13" font-weight="600">Каталог и контент</text>
  <circle cx="720" cy="135" r="7" fill="#8b5cf6" />
  <text x="735" y="140" fill="#334155" font-size="13" font-weight="600">Пользователи и роли</text>
  <text x="1100" y="140" fill="#64748b" font-size="13">Нотация: Crow's Foot (1 : N), СУБД: PostgreSQL 16+</text>

  <!-- TABLE: USERS -->
  <g transform="translate(60, 200)" filter="url(#shadow)">
    <rect width="360" height="280" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#8b5cf6" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">users (Пользователи)</text>
    <rect y="40" width="360" height="1" fill="#8b5cf6" />
    
    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="210" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="15" y="95" fill="#2563eb" font-size="13" font-weight="bold">UQ</text>
    <text x="45" y="95" fill="#0f172a" font-size="13">email</text>
    <text x="210" y="95" fill="#64748b" font-size="13">VARCHAR(255)</text>

    <text x="45" y="125" fill="#0f172a" font-size="13">password_hash</text>
    <text x="210" y="125" fill="#64748b" font-size="13">VARCHAR(255)</text>

    <text x="45" y="155" fill="#0f172a" font-size="13">full_name</text>
    <text x="210" y="155" fill="#64748b" font-size="13">VARCHAR(255)</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">phone</text>
    <text x="210" y="185" fill="#64748b" font-size="13">VARCHAR(32)</text>

    <text x="45" y="215" fill="#0f172a" font-size="13">role</text>
    <text x="210" y="215" fill="#7c3aed" font-size="13">user_role (ENUM)</text>

    <text x="45" y="245" fill="#64748b" font-size="13">created_at</text>
    <text x="210" y="245" fill="#64748b" font-size="13">TIMESTAMPTZ</text>

    <text x="45" y="270" fill="#64748b" font-size="13">updated_at</text>
    <text x="210" y="270" fill="#64748b" font-size="13">TIMESTAMPTZ</text>
  </g>

  <!-- TABLE: RESTAURANTS -->
  <g transform="translate(620, 200)" filter="url(#shadow)">
    <rect width="380" height="430" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <path d="M 0 0 L 380 0 L 380 40 L 0 40 Z" fill="#3b82f6" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">restaurants (Рестораны)</text>
    <rect y="40" width="380" height="1" fill="#3b82f6" />

    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="220" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="45" y="95" fill="#0f172a" font-size="13">name</text>
    <text x="220" y="95" fill="#64748b" font-size="13">VARCHAR(255)</text>

    <text x="45" y="125" fill="#0f172a" font-size="13">description</text>
    <text x="220" y="125" fill="#64748b" font-size="13">TEXT</text>

    <text x="45" y="155" fill="#0f172a" font-size="13">cuisine_type</text>
    <text x="220" y="155" fill="#64748b" font-size="13">VARCHAR(100)</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">price_range</text>
    <text x="220" y="185" fill="#2563eb" font-size="13">INT (1..4)</text>

    <text x="45" y="215" fill="#0f172a" font-size="13">address</text>
    <text x="220" y="215" fill="#64748b" font-size="13">VARCHAR(500)</text>

    <text x="45" y="245" fill="#0f172a" font-size="13">city</text>
    <text x="220" y="245" fill="#64748b" font-size="13">VARCHAR(100)</text>

    <text x="45" y="275" fill="#0f172a" font-size="13">phone</text>
    <text x="220" y="275" fill="#64748b" font-size="13">VARCHAR(32)</text>

    <text x="45" y="305" fill="#0f172a" font-size="13">opening_time</text>
    <text x="220" y="305" fill="#64748b" font-size="13">TIME</text>

    <text x="45" y="335" fill="#0f172a" font-size="13">closing_time</text>
    <text x="220" y="335" fill="#64748b" font-size="13">TIME</text>

    <text x="45" y="365" fill="#0f172a" font-size="13">photo_url</text>
    <text x="220" y="365" fill="#64748b" font-size="13">VARCHAR(1000)</text>

    <text x="45" y="395" fill="#0f172a" font-size="13">rating</text>
    <text x="220" y="395" fill="#64748b" font-size="13">NUMERIC(3,2)</text>

    <text x="15" y="420" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="420" fill="#0f172a" font-size="13">manager_id</text>
    <text x="220" y="420" fill="#64748b" font-size="13">UUID -> users(id)</text>
  </g>

  <!-- TABLE: RESTAURANT_TABLES -->
  <g transform="translate(1180, 200)" filter="url(#shadow)">
    <rect width="360" height="230" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#3b82f6" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">restaurant_tables (Столики)</text>
    <rect y="40" width="360" height="1" fill="#3b82f6" />

    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="210" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="15" y="95" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="95" fill="#0f172a" font-size="13">restaurant_id</text>
    <text x="210" y="95" fill="#64748b" font-size="13">UUID -> restaurants(id)</text>

    <text x="45" y="125" fill="#0f172a" font-size="13">table_number</text>
    <text x="210" y="125" fill="#64748b" font-size="13">INT</text>

    <text x="45" y="155" fill="#0f172a" font-size="13">capacity</text>
    <text x="210" y="155" fill="#64748b" font-size="13">INT (2, 4, 6, 8)</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">location_zone</text>
    <text x="210" y="185" fill="#2563eb" font-size="13">table_zone (ENUM)</text>

    <text x="45" y="215" fill="#0f172a" font-size="13">is_active</text>
    <text x="210" y="215" fill="#64748b" font-size="13">BOOLEAN</text>
  </g>

  <!-- TABLE: RESERVATIONS -->
  <g transform="translate(620, 680)" filter="url(#shadow)">
    <rect width="380" height="380" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <path d="M 0 0 L 380 0 L 380 40 L 0 40 Z" fill="#10b981" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">reservations (Бронирования)</text>
    <rect y="40" width="380" height="1" fill="#10b981" />

    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="220" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="15" y="95" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="95" fill="#0f172a" font-size="13">user_id</text>
    <text x="220" y="95" fill="#64748b" font-size="13">UUID -> users(id)</text>

    <text x="15" y="125" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="125" fill="#0f172a" font-size="13">restaurant_id</text>
    <text x="220" y="125" fill="#64748b" font-size="13">UUID -> restaurants(id)</text>

    <text x="15" y="155" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="155" fill="#0f172a" font-size="13">table_id</text>
    <text x="220" y="155" fill="#64748b" font-size="13">UUID -> tables(id)</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">reservation_date</text>
    <text x="220" y="185" fill="#64748b" font-size="13">DATE</text>

    <text x="45" y="215" fill="#0f172a" font-size="13">start_time</text>
    <text x="220" y="215" fill="#64748b" font-size="13">TIME</text>

    <text x="45" y="245" fill="#0f172a" font-size="13">end_time</text>
    <text x="220" y="245" fill="#64748b" font-size="13">TIME</text>

    <text x="45" y="275" fill="#0f172a" font-size="13">guests_count</text>
    <text x="220" y="275" fill="#64748b" font-size="13">INT</text>

    <text x="45" y="305" fill="#0f172a" font-size="13">status</text>
    <text x="220" y="305" fill="#059669" font-size="13">res_status (ENUM)</text>

    <text x="45" y="335" fill="#0f172a" font-size="13">special_requests</text>
    <text x="220" y="335" fill="#64748b" font-size="13">TEXT</text>

    <text x="45" y="365" fill="#64748b" font-size="13">created_at</text>
    <text x="220" y="365" fill="#64748b" font-size="13">TIMESTAMPTZ</text>
  </g>

  <!-- TABLE: MENU_ITEMS -->
  <g transform="translate(60, 680)" filter="url(#shadow)">
    <rect width="360" height="260" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#f59e0b" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">menu_items (Меню ресторана)</text>
    <rect y="40" width="360" height="1" fill="#f59e0b" />

    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="210" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="15" y="95" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="95" fill="#0f172a" font-size="13">restaurant_id</text>
    <text x="210" y="95" fill="#64748b" font-size="13">UUID -> restaurants(id)</text>

    <text x="45" y="125" fill="#0f172a" font-size="13">name</text>
    <text x="210" y="125" fill="#64748b" font-size="13">VARCHAR(255)</text>

    <text x="45" y="155" fill="#0f172a" font-size="13">description</text>
    <text x="210" y="155" fill="#64748b" font-size="13">TEXT</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">price</text>
    <text x="210" y="185" fill="#64748b" font-size="13">NUMERIC(10,2)</text>

    <text x="45" y="215" fill="#0f172a" font-size="13">category</text>
    <text x="210" y="215" fill="#d97706" font-size="13">menu_cat (ENUM)</text>

    <text x="45" y="245" fill="#0f172a" font-size="13">is_available</text>
    <text x="210" y="245" fill="#64748b" font-size="13">BOOLEAN</text>
  </g>

  <!-- TABLE: REVIEWS -->
  <g transform="translate(1180, 680)" filter="url(#shadow)">
    <rect width="360" height="240" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#f59e0b" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="bold">reviews (Отзывы клиентов)</text>
    <rect y="40" width="360" height="1" fill="#f59e0b" />

    <text x="15" y="65" fill="#e11d48" font-size="13" font-weight="bold">PK</text>
    <text x="45" y="65" fill="#0f172a" font-size="13" font-weight="600">id</text>
    <text x="210" y="65" fill="#64748b" font-size="13">UUID</text>

    <text x="15" y="95" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="95" fill="#0f172a" font-size="13">user_id</text>
    <text x="210" y="95" fill="#64748b" font-size="13">UUID -> users(id)</text>

    <text x="15" y="125" fill="#059669" font-size="13" font-weight="bold">FK</text>
    <text x="45" y="125" fill="#0f172a" font-size="13">restaurant_id</text>
    <text x="210" y="125" fill="#64748b" font-size="13">UUID -> restaurants(id)</text>

    <text x="45" y="155" fill="#0f172a" font-size="13">rating</text>
    <text x="210" y="155" fill="#64748b" font-size="13">INT (1..5)</text>

    <text x="45" y="185" fill="#0f172a" font-size="13">comment</text>
    <text x="210" y="185" fill="#64748b" font-size="13">TEXT</text>

    <text x="45" y="215" fill="#64748b" font-size="13">created_at</text>
    <text x="210" y="215" fill="#64748b" font-size="13">TIMESTAMPTZ</text>
  </g>

  <!-- RELATION LINES WITH ARROWS/CROWS -->
  <!-- 1. users -> restaurants (manager_id) -->
  <path d="M 420 300 L 620 300" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="470" y="290" fill="#475569" font-size="12">1 : N (manages)</text>

  <!-- 2. restaurants -> restaurant_tables -->
  <path d="M 1000 300 L 1180 300" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="1050" y="290" fill="#475569" font-size="12">1 : N (has tables)</text>

  <!-- 3. restaurants -> menu_items -->
  <path d="M 660 630 L 660 655 L 240 655 L 240 680" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="320" y="650" fill="#475569" font-size="12">1 : N (has dishes)</text>

  <!-- 4. restaurants -> reservations -->
  <path d="M 810 630 L 810 680" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="820" y="660" fill="#475569" font-size="12">1 : N</text>

  <!-- 5. restaurant_tables -> reservations -->
  <path d="M 1360 430 L 1360 550 L 980 550 L 980 680" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="1150" y="542" fill="#475569" font-size="12">1 : N (booked on)</text>

  <!-- 6. users -> reservations -->
  <path d="M 240 480 L 240 610 L 640 610 L 640 680" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="360" y="605" fill="#475569" font-size="12">1 : N (makes reservation)</text>

  <!-- 7. users -> reviews -->
  <path d="M 200 480 L 200 1080 L 1360 1080 L 1360 920" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="300" y="1070" fill="#475569" font-size="12">1 : N (authors)</text>

  <!-- 8. restaurants -> reviews -->
  <path d="M 1000 400 L 1120 400 L 1120 750 L 1180 750" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#crow)" />
  <text x="1080" y="600" fill="#475569" font-size="12">1 : N</text>
</svg>