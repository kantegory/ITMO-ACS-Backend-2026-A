events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream auth_upstream {
        server 127.0.0.1:5001;
    }

    upstream restaurant_upstream {
        server 127.0.0.1:5002;
    }

    upstream booking_upstream {
        server 127.0.0.1:5003;
    }

    server {
        listen 80;
        server_name api.restaurant-booking.itmo.ru;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        location /api/v1/auth/ {
            proxy_pass http://auth_upstream/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/restaurants/ {
            proxy_pass http://restaurant_upstream/restaurants/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/reservations/ {
            proxy_pass http://booking_upstream/reservations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}\n';
            add_header Content-Type application/json;
        }
    }
}
