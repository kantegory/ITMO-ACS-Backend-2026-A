---
# Главный плейбук ЛР5: настройка виртуальной машины.
# Запуск: ansible-playbook site.yml
- name: Настройка сервера job-search
  hosts: webservers
  become: true
  roles:
    - { role: common, tags: [common] }
    - { role: docker, tags: [docker] }
    - { role: nginx, tags: [nginx] }
    - { role: app, tags: [app] }
