# Inventory: список управляемых машин.
# Здесь управляемая машина - сама Ubuntu в WSL (подключение local, без SSH).
[webservers]
wsl-ubuntu ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Пример для удалённой виртуальной машины по SSH:
# [webservers]
# vm1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519
