---
# Пользователь и каталоги приложения
app_user: deploy
app_base_dir: /opt/job-search

# Код приложения (ЛР4) берётся из публичного репозитория
repo_url: https://github.com/NNaafff1/ITMO-ACS-Backend-2026-A.git
repo_version: feat/lab4
repo_dir: "{{ app_base_dir }}/repo"
app_dir: "{{ repo_dir }}/БР1.1/Саид Наваф/labs/lab4"
compose_project: lab5

# Порты: nginx снаружи, приложение только на 127.0.0.1.
# Порт 80 в этой Ubuntu занят службой Caddy, поэтому nginx слушает 8080.
nginx_listen_port: 8080
app_port: 3000

# Системные пакеты
system_packages:
  - git
  - curl
  - ca-certificates
  - openssl
  - jq
  - unzip
