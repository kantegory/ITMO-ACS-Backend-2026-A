server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    location / { root /usr/share/nginx/html; try_files /index.html =404; }
    location = /auth { return 301 /auth/; }
    location /auth/ {
        proxy_pass http://auth-service:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /auth/;
    }
    location = /profile { return 301 /profile/; }
    location /profile/ {
        proxy_pass http://profile-service:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /profile/;
    }
    location = /resume { return 301 /resume/; }
    location /resume/ {
        proxy_pass http://resume-service:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /resume/;
    }
    location = /vacancy { return 301 /vacancy/; }
    location /vacancy/ {
        proxy_pass http://vacancy-service:8004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /vacancy/;
    }
    location = /application { return 301 /application/; }
    location /application/ {
        proxy_pass http://application-service:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /application/;
    }
    location = /reference { return 301 /reference/; }
    location /reference/ {
        proxy_pass http://reference-service:8006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /reference/;
    }
}
