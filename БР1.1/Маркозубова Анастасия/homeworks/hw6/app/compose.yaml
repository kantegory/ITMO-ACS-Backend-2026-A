      SEED_DEMO_DATA_ON_START: "false"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run scripts/init-env.sh}
