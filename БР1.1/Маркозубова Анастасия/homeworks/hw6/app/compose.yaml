      SEED_DEMO_DATA_ON_START: "false"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run scripts/init-env.sh}
      JWT_ACCESS_TOKEN_LIFETIME: 86400
      AUTH_SERVICE_URL: http://auth-service:8001/api
      PROFILE_SERVICE_URL: http://profile-service:8002/api
      RESUME_SERVICE_URL: http://resume-service:8003/api
      VACANCY_SERVICE_URL: http://vacancy-service:8004/api
      APPLICATION_SERVICE_URL: http://application-service:8005/api
      REFERENCE_SERVICE_URL: http://reference-service:8006/api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8003/docs/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy
      resume-db:
        condition: service_healthy
      profile-service:
        condition: service_started
      reference-service:
        condition: service_started
    networks:
      - job-board-network

  vacancy-service:
    build:
      context: .
      dockerfile: ./vacancy-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: vacancy
      PUBLIC_BASE_PATH: /vacancy
      APP_HOST: 0.0.0.0
      APP_PORT: 8004
      DB_HOST: vacancy-db
      DB_PORT: 5432
      DB_NAME: vacancy_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.sh}
