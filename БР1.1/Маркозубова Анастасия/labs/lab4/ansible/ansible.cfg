[defaults]
inventory = inventory.yml
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
timeout = 30

[ssh_connection]
pipelining = True
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4
