---
- name: Build and start application
  ansible.builtin.command:
    cmd: bash scripts/deploy.sh
    chdir: "{{ backend_dir }}"
  async: 1200
  poll: 15
  changed_when: true

- name: Record completed release
  ansible.builtin.copy:
    dest: "{{ backend_dir }}/.ansible-deployed-sha"
    content: "{{ backend_commit }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: '0644'
