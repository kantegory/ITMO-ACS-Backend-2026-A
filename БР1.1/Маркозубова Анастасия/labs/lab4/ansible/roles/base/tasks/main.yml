---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - openssl
      - python3-apt
      - tar
    state: present

- name: Enable SSH service
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Collect installed package facts
  ansible.builtin.package_facts:
    manager: apt
