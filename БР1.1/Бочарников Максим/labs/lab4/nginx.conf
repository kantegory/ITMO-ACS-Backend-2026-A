upstream app_frontend { server 127.0.0.1:13000; }
upstream app_gateway { server 127.0.0.1:18000; }

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/app-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/app-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Лимит загрузки Excel в gateway: UPLOAD_MAX_FILE_SIZE_BYTES = 10 MiB, тот же размер у nginx frontend.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://app_gateway;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location = /health {
        proxy_pass http://app_gateway/health;
    }

    location / {
        proxy_pass http://app_frontend;
    }
}
