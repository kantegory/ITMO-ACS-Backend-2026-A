{{- $tag := required "Specify images.tag with the published immutable tag" .Values.images.tag -}}
{{- $host := required "Specify host with the course environment FQDN" .Values.host -}}
{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  {{- if or (ne $name "gateway") (not $.Values.autoscaling.enabled) }}
  replicas: {{ $component.replicas | default 1 }}
  {{- end }}
  {{- if eq $name "scheduler" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- if or (eq $name "gateway") (eq $name "ml-service") }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $name }}
      {{- end }}
      imagePullSecrets:
        - name: {{ $.Values.images.pullSecret }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.images.registry }}/{{ $component.image }}:{{ $tag }}"
          {{- with $component.command }}
          command: {{ toJson . }}
          {{- end }}
          resources:
            requests: {{ toJson $component.requests }}
            limits: {{ toJson $component.limits }}
          {{- if ne $name "frontend" }}
          envFrom:
            - secretRef:
                name: {{ if eq $name "ml-service" }}{{ $.Values.secrets.ml }}{{ else }}{{ $.Values.secrets.gateway }}{{ end }}
          {{- end }}
          {{- if and $component.port (ne $name "frontend") }}
          env:
            - name: PORT
              value: {{ $component.port | quote }}
            {{- if eq $name "gateway" }}
            - name: ORIGINS
              value: {{ printf "[\"https://%s\"]" $host | quote }}
            {{- end }}
          {{- end }}
          {{- if $component.health }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          startupProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            timeoutSeconds: 3
            failureThreshold: 5
          {{- end }}
  {{- if $component.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - {name: http, port: {{ $component.port }}, targetPort: http}
  {{- end }}
{{- end }}
