apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: app-gateway
  namespace: app-semester
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: app
      app.kubernetes.io/component: gateway
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
