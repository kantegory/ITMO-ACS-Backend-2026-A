apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lab2
data:
  02-lab2-databases.sql: |
    CREATE DATABASE lab2_auth;
    CREATE DATABASE lab2_catalog;
    CREATE DATABASE lab2_jobseeker;
    CREATE DATABASE lab2_employer;
    CREATE DATABASE lab2_application;
    GRANT ALL PRIVILEGES ON DATABASE lab2_auth TO lab1_user;
    GRANT ALL PRIVILEGES ON DATABASE lab2_catalog TO lab1_user;
    GRANT ALL PRIVILEGES ON DATABASE lab2_jobseeker TO lab1_user;
    GRANT ALL PRIVILEGES ON DATABASE lab2_employer TO lab1_user;
    GRANT ALL PRIVILEGES ON DATABASE lab2_application TO lab1_user;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: lab2
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab2
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lab1
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lab1_user", "-d", "lab1"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab2
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
