apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lab2
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: lab2/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_SERVICE_URL
              value: http://auth:3001
            - name: CATALOG_SERVICE_URL
              value: http://catalog:3002
            - name: JOBSEEKER_SERVICE_URL
              value: http://jobseeker:3003
            - name: EMPLOYER_SERVICE_URL
              value: http://employer:3004
            - name: APPLICATION_SERVICE_URL
              value: http://application:3005
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_EXPIRES_IN
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lab2
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 3000
