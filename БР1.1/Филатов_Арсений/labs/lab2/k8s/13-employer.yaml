apiVersion: apps/v1
kind: Deployment
metadata:
  name: employer
  namespace: lab2
  labels:
    app: employer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employer
  template:
    metadata:
      labels:
        app: employer
    spec:
      containers:
        - name: employer
          image: lab2/employer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              value: postgresql://lab1_user:lab1_pass@postgres:5432/lab2_employer?schema=public
            - name: CATALOG_SERVICE_URL
              value: http://catalog:3002
            - name: RABBITMQ_URL
              value: amqp://lab2_mq:lab2_mq_pass@rabbitmq:5672
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_EXPIRES_IN
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: employer
  namespace: lab2
spec:
  selector:
    app: employer
  ports:
    - port: 3004
      targetPort: 3004
