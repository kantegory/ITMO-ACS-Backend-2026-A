global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://gateway:3000/health"]
        labels:
          service: gateway
      - targets: ["http://auth:3001/health"]
        labels:
          service: auth
      - targets: ["http://catalog:3002/health"]
        labels:
          service: catalog
      - targets: ["http://jobseeker:3003/health"]
        labels:
          service: jobseeker
      - targets: ["http://employer:3004/health"]
        labels:
          service: employer
      - targets: ["http://application:3005/health"]
        labels:
          service: application
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          service: postgres
      - targets: ["rabbitmq:5672"]
        labels:
          service: rabbitmq
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
