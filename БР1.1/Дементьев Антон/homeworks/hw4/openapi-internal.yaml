    - url: http://notification-service:8007
      description: Сервис notification-service
    get:
      tags:
      - Common
      summary: Состояние сервиса
      description: |-
        Есть у каждого из семи сервисов (адреса в servers). Возвращает готовность сервиса и его зависимостей. Шлюз опрашивает все сервисы и собирает из ответов публичный GET /api/v1/health; этот же эндпоинт используют проверки готовности (readiness) оркестратора.

        **Кто вызывает:** api-gateway.

        **Где используется:** №50 проверка состояния сервиса.
      operationId: getServiceHealth
      x-callers:
      - api-gateway
      parameters:
      - $ref: '#/components/parameters/RequestId'
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Собственная БД сервиса недоступна'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Сервисный JWT из POST /internal/v1/auth/service-token: sub = имя вызывающего сервиса, aud =
        имя вызываемого'
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной идентификатор запроса; если не передан, сервис создаёт его сам
      schema:
        type: string
        format: uuid
      example: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
  responses:
    InternalError:
      description: 'INTERNAL_ERROR: непредвиденная ошибка на стороне сервиса'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера
            request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
  schemas:
    Role:
      type: string
      description: Роль пользователя
      enum:
      - JOBSEEKER
      - EMPLOYER
      example: JOBSEEKER
    ClientName:
      type: string
      description: Имя сервисного клиента (кто вызывает)
      enum:
      - api-gateway
      - identity-service
      - reference-service
      - vacancy-service
      - resume-service
      - application-service
      - recommendation-service
      - notification-service
      - ops-tools
      example: application-service
    AudienceName:
      type: string
      description: Имя сервиса-получателя (для кого выдан токен)
      enum:
      - identity-service
      - reference-service
      - vacancy-service
      - resume-service
      - application-service
      - recommendation-service
      - notification-service
      example: vacancy-service
    ResumeView:
      type: string
      description: 'Уровень детализации резюме: short — без опыта и образования, detail — полное'
      enum:
      - short
      - detail
      example: short
    IndexScope:
      type: string
      description: Что перестраивать в индексе рекомендаций
      enum:
      - VACANCIES
      - RESUMES
      - ALL
      example: ALL
    JobStatus:
      type: string
      description: Состояние задачи перестроения индекса
      enum:
      - QUEUED
      - RUNNING
      - DONE
      - FAILED
      example: RUNNING
    HealthStatus:
      type: string
      description: 'Состояние сервиса: ok — всё работает, degraded — работает с ограничениями'
      enum:
      - ok
      - degraded
      example: ok
    ErrorDetail:
      type: object
      description: Ошибка конкретного поля
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: Имя поля (или параметра запроса)
          example: ids
        message:
          type: string
          description: Описание проблемы
          example: Допускается от 1 до 100 идентификаторов
      example:
        field: ids
        message: Допускается от 1 до 100 идентификаторов
    ErrorResponse:
      type: object
      description: Единый формат ошибки (тот же, что в публичном API)
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Понятное описание ошибки
          example: Ошибка валидации данных
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Ошибки по полям (только для VALIDATION_ERROR)
        request_id:
          type: string
          description: Идентификатор запроса; сквозной для всей цепочки вызовов
          example: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
      example:
        code: VALIDATION_ERROR
        message: Ошибка валидации данных
        details:
        - field: ids
          message: Допускается от 1 до 100 идентификаторов
        request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
    IdsRequest:
      type: object
      description: Пакетный запрос по идентификаторам
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          description: Идентификаторы (от 1 до 100). Повторы игнорируются
          example:
          - 4fc79438-2514-51a8-9796-426af8d8f73d
          - 43df9396-dbd5-598c-ba46-a84fb4e24f64
      example:
        ids:
        - 4fc79438-2514-51a8-9796-426af8d8f73d
        - 43df9396-dbd5-598c-ba46-a84fb4e24f64
    Skill:
      type: object
      description: Навык
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор навыка
          example: e2ee04fb-d7c7-5d93-8439-208548ade0fa
        name:
          type: string
          description: Название навыка
          example: Python
      example:
        id: e2ee04fb-d7c7-5d93-8439-208548ade0fa
        name: Python
    IndustryRef:
      type: object
      description: Ссылка на отрасль
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор отрасли
          example: ef39a9bf-1aa7-521e-870a-46190bc1241a
        title:
          type: string
          description: Название отрасли
          example: Информационные технологии
      example:
        id: ef39a9bf-1aa7-521e-870a-46190bc1241a
        title: Информационные технологии
    ServiceTokenRequest:
      type: object
      description: Запрос сервисного токена (client credentials)
      required:
      - client_id
      - client_secret
      - audience
      properties:
        client_id:
          allOf:
          - $ref: '#/components/schemas/ClientName'
          description: Имя вызывающего сервиса
        client_secret:
          type: string
          minLength: 16
          maxLength: 128
          description: Секрет клиента (из конфигурации сервиса, не из кода)
          example: s3cr3t-of-application-service
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceName'
          description: Сервис, для которого нужен токен
      example:
        client_id: application-service
        client_secret: s3cr3t-of-application-service
        audience: vacancy-service
    ServiceToken:
      type: object
      description: Сервисный токен
      required:
      - access_token
      - token_type
      - expires_in
      - audience
      properties:
        access_token:
          type: string
          description: 'JWT: sub = имя клиента, aud = имя сервиса-получателя'
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImsxIn0...
        token_type:
          type: string
          description: Тип токена
          example: Bearer
        expires_in:
          type: integer
          description: Срок жизни, секунды (5 минут)
          example: 300
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceName'
          description: Сервис, для которого выдан токен
      example:
        access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImsxIn0...
        token_type: Bearer
        expires_in: 300
        audience: vacancy-service
    JwkKey:
      type: object
      description: Публичный ключ подписи JWT (JWK)
      required:
      - kty
      - use
      - alg
      - kid
      - n
      - e
      properties:
        kty:
          type: string
          description: Тип ключа
          example: RSA
        use:
          type: string
          description: Назначение ключа
          example: sig
        alg:
          type: string
          description: Алгоритм подписи
          example: RS256
        kid:
          type: string
          description: Идентификатор ключа
          example: 2026-09-key-1
        n:
          type: string
          description: Модуль RSA (base64url)
          example: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1Wl...
        e:
          type: string
          description: Публичная экспонента (base64url)
          example: AQAB
      example:
        kty: RSA
        use: sig
        alg: RS256
        kid: 2026-09-key-1
        n: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1Wl...
        e: AQAB
    Jwks:
      type: object
      description: Набор публичных ключей Identity (JWKS)
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
          description: Действующие ключи; при ротации в набор входят старый и новый
      example:
        keys:
        - kty: RSA
          use: sig
          alg: RS256
          kid: 2026-09-key-1
          n: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1Wl...
          e: AQAB
    UserLookupRequest:
      type: object
      description: Пакетный запрос пользователей
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          description: Идентификаторы пользователей (от 1 до 100)
          example:
          - 531c4d1e-d877-50be-bf27-768458436c9e
          - 7cfe1d2c-9559-516e-a053-28eb980eff75
        include_contacts:
          type: boolean
          description: Вернуть контакты (email, телефон, город). Разрешено только application-service
          default: false
          example: false
      example:
        ids:
        - 531c4d1e-d877-50be-bf27-768458436c9e
        - 7cfe1d2c-9559-516e-a053-28eb980eff75
        include_contacts: false
    InternalUser:
      type: object
      description: Пользователь для внутреннего использования (без пароля и токенов)
      required:
      - id
      - role
      - is_active
      - last_name
      - first_name
      - middle_name
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор пользователя
          example: 531c4d1e-d877-50be-bf27-768458436c9e
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          description: Роль
        is_active:
          type: boolean
          description: Аккаунт активен
          example: true
        last_name:
          type: string
          description: Фамилия
          example: Дементьев
        first_name:
          type: string
          description: Имя
          example: Антон
        middle_name:
          type: string
          nullable: true
          description: Отчество
          example: Павлович
        email:
          type: string
          format: email
          nullable: true
          description: Email. Есть только при include_contacts = true
          example: anton@example.com
        phone:
          type: string
          nullable: true
          description: Телефон. Есть только при include_contacts = true
          example: +7 900 000-00-00
        city:
          type: string
          nullable: true
          description: Город. Есть только при include_contacts = true
          example: Санкт-Петербург
      example:
        id: 531c4d1e-d877-50be-bf27-768458436c9e
        role: JOBSEEKER
        is_active: true
        last_name: Дементьев
        first_name: Антон
        middle_name: Павлович
        email: anton@example.com
        phone: +7 900 000-00-00
        city: Санкт-Петербург
    UserLookupResponse:
      type: object
