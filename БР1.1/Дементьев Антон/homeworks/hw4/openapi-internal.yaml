        missing_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Идентификаторы, которых нет в Identity
          example: []
      example:
        items:
        - id: 531c4d1e-d877-50be-bf27-768458436c9e
          role: JOBSEEKER
          is_active: true
          last_name: Дементьев
          first_name: Антон
          middle_name: Павлович
          email: anton@example.com
          phone: +7 900 000-00-00
          city: Санкт-Петербург
        missing_ids: []
