openapi: 3.0.3
info:
  title: Job Search — межсервисное API (internal)
  version: 1.0.0
  description: |-
    Внутреннее API для взаимодействия микросервисов сайта поиска работы (ДЗ 4). Публичное API для клиентов остаётся прежним (openapi.yaml из ДЗ 2) и доступно только через API Gateway; эти эндпоинты снаружи не доступны, шлюз не маршрутизирует `/internal/**`.

    **Аутентификация между сервисами.** Каждый вызов содержит заголовок `Authorization: Bearer <сервисный токен>`. Токен выдаёт Identity Service (`POST /internal/v1/auth/service-token`), он живёт 5 минут и выдаётся для конкретного сервиса-получателя (`aud`). Публичными остаются выдача токена, JWKS и health.

    **Сквозной идентификатор.** Заголовок `X-Request-Id` передаётся по всей цепочке вызовов и попадает в `request_id` ошибок.

    **Пакетные запросы.** Эндпоинты `lookup` принимают до 100 идентификаторов; отсутствующие возвращаются в `missing_ids`, ошибкой это не считается.

    **Ошибки:** единый формат `ErrorResponse` (`code`, `message`, `details`, `request_id`). Ошибки доступности зависимостей: `SERVICE_UNAVAILABLE` (503, с `Retry-After`) и `UPSTREAM_TIMEOUT` (504).

    **Тайм-ауты и повторы.** Тайм-аут вызова 2 секунды (пакетные запросы 3 секунды); идемпотентные запросы (GET и lookup) повторяются не более двух раз с паузой; после серии ошибок срабатывает circuit breaker.
  contact:
    name: Дементьев Антон
tags:
- name: Identity
  description: 'Identity Service: пользователи, токены (порт 8001)'
- name: Reference
  description: 'Reference Service: справочники отраслей и навыков (порт 8002)'
- name: Vacancy
  description: 'Vacancy Service: компании, вакансии, избранное (порт 8003)'
- name: Resume
  description: 'Resume Service: резюме, опыт, образование (порт 8004)'
- name: Application
  description: 'Application Service: отклики (порт 8005)'
- name: Recommendation
  description: 'Recommendation Service: подбор вакансий и кандидатов (порт 8006)'
- name: Notification
  description: 'Notification Service: письма (порт 8007)'
- name: Common
  description: Эндпоинты, которые есть у каждого сервиса
paths:
  /internal/v1/auth/service-token:
    servers:
    - url: http://identity-service:8001
      description: Сервис identity-service
    post:
      tags:
      - Identity
      summary: Выдача сервисного токена
      description: |-
        Аутентификация сервиса по схеме client credentials. Сервис получает короткоживущий JWT (5 минут), который подставляет в заголовок Authorization при вызове других сервисов. Токен привязан к получателю (aud), поэтому токен для vacancy-service не подойдёт для resume-service. Вызывающий сервис кеширует токен до истечения срока.

        **Кто вызывает:** identity-service, reference-service, vacancy-service, resume-service, application-service, recommendation-service, notification-service, api-gateway, ops-tools.

        **Где используется:** Все вызовы между сервисами (получение токена перед первым обращением и после истечения).
      operationId: issueServiceToken
      x-callers:
      - identity-service
      - reference-service
      - vacancy-service
      - resume-service
      - application-service
      - recommendation-service
      - notification-service
      - api-gateway
      - ops-tools
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTokenRequest'
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceToken'
        '401':
          description: 'INVALID_CLIENT: client_id или client_secret не совпадают с зарегистрированными'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CLIENT:
                  summary: INVALID_CLIENT
                  value:
                    code: INVALID_CLIENT
                    message: Неверные учётные данные сервиса
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'AUDIENCE_NOT_ALLOWED: Для пары client_id и audience токен не выдаётся'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUDIENCE_NOT_ALLOWED:
                  summary: AUDIENCE_NOT_ALLOWED
                  value:
                    code: AUDIENCE_NOT_ALLOWED
                    message: Клиенту не разрешено обращаться к этому сервису
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Параметры или тело запроса не прошли проверку; подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: client_id
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Сервис или его зависимость (БД, брокер, другой сервис) недоступны либо
            открыт circuit breaker; см. Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
  /internal/v1/.well-known/jwks.json:
    servers:
    - url: http://identity-service:8001
      description: Сервис identity-service
    get:
      tags:
      - Identity
      summary: Публичные ключи для проверки JWT
      description: |-
        Отдаёт публичные ключи, которыми подписаны access-токены пользователей и сервисные токены. Шлюз и сервисы кешируют набор и обновляют его при появлении неизвестного kid. Благодаря этому сервисы проверяют подпись самостоятельно и не обращаются в Identity на каждый запрос.

        **Кто вызывает:** api-gateway, identity-service, reference-service, vacancy-service, resume-service, application-service, recommendation-service, notification-service.

        **Где используется:** Проверка JWT в шлюзе и во всех сервисах (все защищённые операции публичного API).
      operationId: getJwks
      x-callers:
      - api-gateway
      - identity-service
      - reference-service
      - vacancy-service
      - resume-service
      - application-service
      - recommendation-service
      - notification-service
      parameters:
      - $ref: '#/components/parameters/RequestId'
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Сервис или его зависимость (БД, брокер, другой сервис) недоступны либо
            открыт circuit breaker; см. Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
  /internal/v1/users/lookup:
    servers:
    - url: http://identity-service:8001
      description: Сервис identity-service
    post:
      tags:
      - Identity
      summary: Пакетное получение пользователей
      description: |-
        Возвращает имена (и при include_contacts = true контакты) пользователей по списку id. Нужен, чтобы собрать карточку кандидата в откликах и рекомендациях, потому что профили хранятся только в Identity. Контакты получает лишь application-service: работодатель видит их в карточке отклика, но не в рекомендациях.

        **Кто вызывает:** application-service, recommendation-service.

        **Где используется:** №39 отклики на вакансию, №41 мои отклики, №42 просмотр отклика, №49 рекомендованные кандидаты.
      operationId: lookupUsers
      x-callers:
      - application-service
      - recommendation-service
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLookupRequest'
      security:
      - serviceToken: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupResponse'
        '401':
          description: 'SERVICE_UNAUTHORIZED: Заголовок Authorization отсутствует, токен просрочен или подпись не
            проходит проверку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAUTHORIZED:
                  summary: SERVICE_UNAUTHORIZED
                  value:
                    code: SERVICE_UNAUTHORIZED
                    message: Сервисный токен недействителен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'SERVICE_FORBIDDEN: Токен выдан не для identity-service либо include_contacts = true запрошен
            не application-service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_FORBIDDEN:
                  summary: SERVICE_FORBIDDEN
                  value:
                    code: SERVICE_FORBIDDEN
                    message: Операция недоступна вызывающему сервису
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Параметры или тело запроса не прошли проверку; подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: ids
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Сервис или его зависимость (БД, брокер, другой сервис) недоступны либо
            открыт circuit breaker; см. Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
  /internal/v1/industries/lookup:
    servers:
    - url: http://reference-service:8002
      description: Сервис reference-service
    post:
      tags:
      - Reference
      summary: Пакетное получение отраслей
      description: |-
        Проверяет, что отрасли существуют и опубликованы, и возвращает их названия. Вызывается при создании и изменении компаний, вакансий и резюме, а также при сборке карточек. Ответ можно кешировать на 10 минут: справочник меняется редко.

        **Кто вызывает:** vacancy-service, resume-service.

        **Где используется:** №16, №18 резюме; №28, №30 компании; №34, №36 вакансии; названия отраслей во всех карточках.
      operationId: lookupIndustries
      x-callers:
      - vacancy-service
      - resume-service
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsRequest'
      security:
      - serviceToken: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryLookupResponse'
        '401':
          description: 'SERVICE_UNAUTHORIZED: Заголовок Authorization отсутствует, токен просрочен или подпись не
            проходит проверку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAUTHORIZED:
                  summary: SERVICE_UNAUTHORIZED
                  value:
                    code: SERVICE_UNAUTHORIZED
                    message: Сервисный токен недействителен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'SERVICE_FORBIDDEN: Токен выдан для другого сервиса (aud) либо клиенту не разрешена операция
            или параметр'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_FORBIDDEN:
                  summary: SERVICE_FORBIDDEN
                  value:
                    code: SERVICE_FORBIDDEN
                    message: Операция недоступна вызывающему сервису
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Параметры или тело запроса не прошли проверку; подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: ids
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Сервис или его зависимость (БД, брокер, другой сервис) недоступны либо
            открыт circuit breaker; см. Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
  /internal/v1/skills/lookup:
    servers:
    - url: http://reference-service:8002
      description: Сервис reference-service
    post:
      tags:
      - Reference
      summary: Пакетное получение навыков
      description: |-
        Проверяет, что навыки существуют в справочнике, и возвращает их названия. Вызывается при задании навыков резюме и вакансии; ответ кешируется на 10 минут.

        **Кто вызывает:** vacancy-service, resume-service.

        **Где используется:** №26 навыки резюме, №38 навыки вакансии; названия навыков в карточках.
      operationId: lookupSkills
      x-callers:
      - vacancy-service
      - resume-service
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsRequest'
      security:
      - serviceToken: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillLookupResponse'
        '401':
          description: 'SERVICE_UNAUTHORIZED: Заголовок Authorization отсутствует, токен просрочен или подпись не
            проходит проверку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAUTHORIZED:
                  summary: SERVICE_UNAUTHORIZED
                  value:
                    code: SERVICE_UNAUTHORIZED
                    message: Сервисный токен недействителен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'SERVICE_FORBIDDEN: Токен выдан для другого сервиса (aud) либо клиенту не разрешена операция
            или параметр'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_FORBIDDEN:
                  summary: SERVICE_FORBIDDEN
                  value:
                    code: SERVICE_FORBIDDEN
                    message: Операция недоступна вызывающему сервису
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Параметры или тело запроса не прошли проверку; подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: ids
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'SERVICE_UNAVAILABLE: Сервис или его зависимость (БД, брокер, другой сервис) недоступны либо
            открыт circuit breaker; см. Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: SERVICE_UNAVAILABLE
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Сервис временно недоступен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
  /internal/v1/vacancies/{vacancyId}:
    servers:
    - url: http://vacancy-service:8003
      description: Сервис vacancy-service
    get:
      tags:
      - Vacancy
      summary: Вакансия для внутреннего использования
      description: |-
        Возвращает вакансию вместе с компанией, владельцем компании, отраслью и навыками. В отличие от публичного API возвращает и закрытые вакансии, чтобы вызывающий сервис сам решил, что делать (например, отклонить отклик с VACANCY_NOT_ACTIVE). Свежие данные без кеша.

        **Кто вызывает:** application-service, recommendation-service.

        **Где используется:** №39 (проверка владельца вакансии), №40 отклик на вакансию, №49 рекомендованные кандидаты.
      operationId: getVacancyInternal
      x-callers:
      - application-service
      - recommendation-service
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: vacancyId
        in: path
        description: Идентификатор вакансии
        required: true
        schema:
          type: string
          format: uuid
        example: 4fc79438-2514-51a8-9796-426af8d8f73d
      security:
      - serviceToken: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalVacancy'
        '401':
          description: 'SERVICE_UNAUTHORIZED: Заголовок Authorization отсутствует, токен просрочен или подпись не
            проходит проверку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAUTHORIZED:
                  summary: SERVICE_UNAUTHORIZED
                  value:
                    code: SERVICE_UNAUTHORIZED
                    message: Сервисный токен недействителен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'SERVICE_FORBIDDEN: Токен выдан для другого сервиса (aud) либо клиенту не разрешена операция
            или параметр'
          content:
            application/json:
              schema:
