      - Vacancies
      summary: Поиск вакансий
      description: |-
        Поиск среди открытых вакансий с фильтрацией по отрасли, зарплате, опыту и навыкам, текстовым поиском, сортировкой и пагинацией. При использовании фильтра по зарплате вакансии без указанной зарплаты не возвращаются.

        **Доступ:** Публичный (без авторизации).
      operationId: searchVacancies
      parameters:
      - name: q
        in: query
        description: Подстрока в названии или описании вакансии
        required: false
        schema:
          type: string
        example: python
      - name: industry_id
        in: query
        description: Фильтр по отрасли
        required: false
        schema:
          type: string
          format: uuid
        example: ef39a9bf-1aa7-521e-870a-46190bc1241a
      - name: salary_min
        in: query
        description: 'Нижняя граница желаемой зарплаты: возвращаются вакансии, у которых salary_to не ниже значения'
        required: false
        schema:
          type: integer
          minimum: 0
        example: 150000
      - name: salary_max
        in: query
        description: 'Верхняя граница желаемой зарплаты: возвращаются вакансии, у которых salary_from не выше значения'
        required: false
        schema:
          type: integer
          minimum: 0
        example: 300000
      - name: experience_years
        in: query
        description: 'Опыт кандидата в годах: возвращаются вакансии с min_experience_years не больше значения'
        required: false
        schema:
          type: integer
          minimum: 0
        example: 2
      - name: skill_ids
        in: query
        description: Навыки (id через запятую)
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        example: e2ee04fb-d7c7-5d93-8439-208548ade0fa,982780ef-4d5a-5e5e-8e6b-8a3eb4d480be
        style: form
        explode: false
      - name: skills_match
        in: query
        description: 'Режим фильтра по навыкам: any — хотя бы один, all — все перечисленные'
        required: false
        schema:
          type: string
          enum:
          - any
          - all
          default: any
        example: any
      - name: company_id
        in: query
        description: Только вакансии компании
        required: false
        schema:
          type: string
          format: uuid
        example: 677bf595-770f-5b5e-acff-cc36ffb6020c
      - name: sort
        in: query
        description: Сортировка
        required: false
        schema:
          type: string
          enum:
          - created_at_desc
          - salary_desc
          - salary_asc
          default: created_at_desc
        example: created_at_desc
      - name: page
        in: query
        description: Номер страницы, начиная с 1
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        description: Размер страницы (максимум 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
