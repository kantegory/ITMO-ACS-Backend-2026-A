          $ref: '#/components/responses/InternalError'
  /vacancies/{vacancyId}/recommended-resumes:
    get:
      tags:
      - Recommendations
      summary: Рекомендованные кандидаты для вакансии
      description: |-
        Подбирает среди опубликованных резюме кандидатов, подходящих вакансии, по тем же критериям. Контакты кандидатов не раскрываются до отклика.

        **Доступ:** Работодатель (EMPLOYER), владелец компании-автора вакансии.
      operationId: recommendResumes
      parameters:
      - name: vacancyId
        in: path
        description: Идентификатор вакансии
        required: true
        schema:
          type: string
          format: uuid
        example: 4fc79438-2514-51a8-9796-426af8d8f73d
      - name: limit
        in: query
        description: Сколько рекомендаций вернуть (максимум 50)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        example: 10
      security:
      - bearerAuth: []
      x-roles:
      - EMPLOYER
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeRecommendationList'
        '401':
          description: 'UNAUTHORIZED: Заголовок Authorization отсутствует, а access-токен недействителен или истёк
            (для истёкшего токена code = TOKEN_EXPIRED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    code: UNAUTHORIZED
                    message: Требуется авторизация
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'FORBIDDEN: Роль пользователя не подходит для операции либо объект принадлежит другому пользователю'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: FORBIDDEN
                  value:
                    code: FORBIDDEN
                    message: Недостаточно прав
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '404':
          description: 'VACANCY_NOT_FOUND: Вакансия с указанным id не существует (либо закрыта и недоступна текущему
            пользователю)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VACANCY_NOT_FOUND:
                  summary: VACANCY_NOT_FOUND
                  value:
                    code: VACANCY_NOT_FOUND
                    message: Вакансия не найдена
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: limit
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags:
      - System
      summary: Проверка состояния сервиса
      description: |-
        Служебный запрос для мониторинга и балансировщика нагрузки.

        **Доступ:** Публичный (без авторизации).
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access-токен, полученный через POST /auth/login
  responses:
    InternalError:
      description: 'INTERNAL_ERROR: непредвиденная ошибка на стороне сервера'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера
            request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
  schemas:
    Role:
      type: string
      description: Роль пользователя
      enum:
      - JOBSEEKER
      - EMPLOYER
      example: JOBSEEKER
    ApplicationStatus:
      type: string
      description: Статус отклика
      enum:
      - PENDING
      - VIEWED
      - INVITED
      - REJECTED
      example: PENDING
    ErrorDetail:
      type: object
      description: Ошибка конкретного поля
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: Имя поля (или параметра запроса)
          example: email
        message:
          type: string
          description: Описание проблемы
          example: Некорректный формат email
      example:
        field: email
        message: Некорректный формат email
    ErrorResponse:
      type: object
      description: Единый формат ошибки
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Понятное описание ошибки
          example: Ошибка валидации данных
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Ошибки по полям (только для VALIDATION_ERROR)
        request_id:
          type: string
          description: Идентификатор запроса для поиска в логах
          example: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
      example:
        code: VALIDATION_ERROR
        message: Ошибка валидации данных
        details:
        - field: email
          message: Некорректный формат email
        request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
    PageMeta:
      type: object
      description: Информация о пагинации
      required:
      - page
      - size
      - total_items
      - total_pages
      properties:
        page:
          type: integer
          description: Номер текущей страницы (с 1)
          example: 1
        size:
          type: integer
          description: Размер страницы
          example: 20
        total_items:
          type: integer
          description: Всего элементов
          example: 57
        total_pages:
          type: integer
          description: Всего страниц
          example: 3
      example:
        page: 1
        size: 20
        total_items: 57
        total_pages: 3
    Health:
      type: object
      description: Состояние сервиса
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Статус сервиса
          example: ok
        version:
          type: string
          description: Версия API
          example: 1.0.0
      example:
        status: ok
        version: 1.0.0
    Industry:
