    RegisterRequest:
      type: object
      description: Регистрация нового пользователя
      required:
      - email
      - password
      - role
      - last_name
      - first_name
      properties:
        email:
          type: string
          format: email
          description: Электронная почта (логин)
          example: anton@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 'Пароль: от 8 символов, минимум одна буква и одна цифра'
          example: Str0ngPass1
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          description: Роль пользователя
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Фамилия
          example: Дементьев
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя
          example: Антон
        middle_name:
          type: string
          maxLength: 100
          nullable: true
          description: Отчество
          example: Павлович
      example:
        email: anton@example.com
        password: Str0ngPass1
        role: JOBSEEKER
        last_name: Дементьев
        first_name: Антон
        middle_name: Павлович
    User:
      type: object
      description: Аккаунт пользователя
      required:
      - id
      - email
      - role
      - is_verified
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор пользователя
          example: 531c4d1e-d877-50be-bf27-768458436c9e
        email:
          type: string
          format: email
          description: Электронная почта
          example: anton@example.com
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          description: Роль
        is_verified:
          type: boolean
          description: Подтверждён ли email
          example: false
        created_at:
          type: string
          format: date-time
          description: Дата регистрации
          example: '2026-09-18T10:15:30Z'
      example:
        id: 531c4d1e-d877-50be-bf27-768458436c9e
        email: anton@example.com
        role: JOBSEEKER
        is_verified: false
        created_at: '2026-09-18T10:15:30Z'
    VerifyEmailRequest:
      type: object
      description: Подтверждение email
      required:
      - email
      - code
      properties:
        email:
          type: string
          format: email
          description: Электронная почта
          example: anton@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Одноразовый код из письма (6 цифр)
          example: '482913'
      example:
        email: anton@example.com
        code: '482913'
    ResendVerificationRequest:
      type: object
      description: Повторная отправка кода подтверждения email
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Электронная почта
          example: anton@example.com
      example:
        email: anton@example.com
    LoginRequest:
      type: object
      description: Вход в систему
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          description: Электронная почта
          example: anton@example.com
        password:
          type: string
          description: Пароль
          example: Str0ngPass1
      example:
        email: anton@example.com
        password: Str0ngPass1
    TokenPair:
      type: object
      description: Пара токенов
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT access-токен (срок жизни ≈ 15 минут)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIuLi4ifQ.sig
        refresh_token:
          type: string
          description: Непрозрачный refresh-токен (7–30 дней); на сервере хранится только его хеш
          example: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
        token_type:
          type: string
          description: Тип токена
          example: Bearer
        expires_in:
          type: integer
          description: Время жизни access-токена, секунд
          example: 900
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIuLi4ifQ.sig
        refresh_token: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
        token_type: Bearer
        expires_in: 900
    RefreshRequest:
      type: object
      description: Обновление токенов
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Действующий refresh-токен
          example: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
      example:
        refresh_token: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
    LogoutRequest:
      type: object
      description: Выход из системы на текущем устройстве
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh-токен текущей сессии
          example: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
      example:
        refresh_token: d1f4b7c2a9e84f0b8a6c5e3d7f21b0c9
    PasswordChangeRequest:
      type: object
      description: Запрос кода для смены пароля
      required:
      - current_password
      properties:
        current_password:
          type: string
          description: Текущий пароль
          example: Str0ngPass1
      example:
        current_password: Str0ngPass1
    PasswordChangeConfirmRequest:
      type: object
      description: Подтверждение смены пароля
      required:
