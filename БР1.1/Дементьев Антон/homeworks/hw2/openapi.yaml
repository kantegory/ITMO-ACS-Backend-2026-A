openapi: 3.0.3
info:
  title: Job Search API
  version: 1.0.0
  description: |-
    REST API сайта для поиска работы: регистрация и вход (JWT), личные кабинеты соискателя и работодателя, резюме с опытом, образованием и навыками, поиск вакансий с фильтрацией по отрасли, зарплате, опыту и навыкам, отклики, избранное и рекомендации.

    **Аутентификация:** заголовок `Authorization: Bearer <access_token>`. Access-токен живёт около 15 минут, обновляется через `POST /auth/refresh`.

    **Ошибки:** единый формат `ErrorResponse` (`code`, `message`, `details`, `request_id`).

    **Пагинация:** параметры `page` (с 1) и `size` (по умолчанию 20, максимум 100); ответ содержит `items` и `meta`.
  contact:
    name: Дементьев Антон
servers:
- url: http://localhost:8080/api/v1
  description: Локальная разработка
- url: https://api.jobsearch.example.com/api/v1
  description: Продуктивная среда (пример)
tags:
- name: Auth
  description: Аутентификация и безопасность
- name: Profile
  description: Профиль пользователя
- name: Reference
  description: Справочники
- name: Resumes
  description: Резюме соискателя
- name: Companies
  description: Компании работодателя
- name: Vacancies
  description: Вакансии и поиск
- name: Applications
  description: Отклики на вакансии
- name: Favorites
  description: Избранные вакансии
- name: Recommendations
  description: Рекомендации
- name: System
  description: Служебные
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Регистрация
      description: |-
        Создаёт аккаунт (User) и профиль (UserProfile) с ролью JOBSEEKER или EMPLOYER и отправляет на email одноразовый код подтверждения. До подтверждения email вход невозможен.

        **Доступ:** Публичный (без авторизации).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              description: URL созданного ресурса
              schema:
                type: string
        '409':
          description: 'EMAIL_ALREADY_EXISTS: Email уже занят (UNIQUE users.email)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_EXISTS:
                  summary: EMAIL_ALREADY_EXISTS
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: Пользователь с таким email уже зарегистрирован
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: email
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      tags:
      - Auth
      summary: Подтверждение email
      description: |-
        Проверяет одноразовый код (VerificationToken, тип EMAIL_VERIFICATION) и устанавливает is_verified = true.

        **Доступ:** Публичный (без авторизации).
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      security: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '400':
          description: 'INVALID_CODE: Код подтверждения неверен, просрочен или уже использован'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CODE:
                  summary: INVALID_CODE
                  value:
                    code: INVALID_CODE
                    message: Неверный или просроченный код подтверждения
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '409':
          description: 'EMAIL_ALREADY_VERIFIED: Подтверждение для этого аккаунта уже выполнено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_VERIFIED:
                  summary: EMAIL_ALREADY_VERIFIED
                  value:
                    code: EMAIL_ALREADY_VERIFIED
                    message: Email уже подтверждён
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: email
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email/resend:
    post:
      tags:
      - Auth
      summary: Повторная отправка кода подтверждения
      description: |-
        Отправляет новый код подтверждения. Ответ всегда 204, чтобы нельзя было узнать, зарегистрирован ли email.

        **Доступ:** Публичный (без авторизации).
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      security: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: email
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход в систему
      description: |-
        Проверяет email и пароль и выдаёт пару токенов: короткоживущий access (JWT) и долгоживущий refresh (его хеш сохраняется в RefreshToken).

        **Доступ:** Публичный (без авторизации).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 'INVALID_CREDENTIALS: Пользователь не найден или пароль не совпадает (причина намеренно не
            уточняется)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  summary: INVALID_CREDENTIALS
                  value:
                    code: INVALID_CREDENTIALS
                    message: Неверный email или пароль
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'EMAIL_NOT_VERIFIED: Вход невозможен, пока email не подтверждён кодом; ACCOUNT_DISABLED:
            Аккаунт заблокирован или деактивирован (users.is_active = false)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  summary: EMAIL_NOT_VERIFIED
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: Email не подтверждён
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
                ACCOUNT_DISABLED:
                  summary: ACCOUNT_DISABLED
                  value:
                    code: ACCOUNT_DISABLED
                    message: Аккаунт деактивирован
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: email
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновление токенов
      description: |-
        Обменивает действующий refresh-токен на новую пару токенов. Старый refresh-токен отзывается (ротация): повторное использование даёт INVALID_REFRESH_TOKEN.

        **Доступ:** Публичный (без авторизации).
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 'INVALID_REFRESH_TOKEN: Refresh-токен не найден, просрочен или уже отозван'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_REFRESH_TOKEN:
                  summary: INVALID_REFRESH_TOKEN
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: Refresh-токен недействителен
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '403':
          description: 'ACCOUNT_DISABLED: Аккаунт заблокирован или деактивирован (users.is_active = false)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_DISABLED:
                  summary: ACCOUNT_DISABLED
                  value:
                    code: ACCOUNT_DISABLED
                    message: Аккаунт деактивирован
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: refresh_token
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выход на текущем устройстве
      description: |-
        Отзывает переданный refresh-токен (RefreshToken.revoked_at). Операция идемпотентна: неизвестный токен тоже даёт 204. Уже выданный access-токен действует до истечения срока (не более 15 минут).

        **Доступ:** Любой авторизованный пользователь.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '401':
          description: 'UNAUTHORIZED: Заголовок Authorization отсутствует, а access-токен недействителен или истёк
            (для истёкшего токена code = TOKEN_EXPIRED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    code: UNAUTHORIZED
                    message: Требуется авторизация
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: refresh_token
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout-all:
    post:
      tags:
      - Auth
      summary: Выход на всех устройствах
      description: |-
        Отзывает все refresh-токены текущего пользователя.

        **Доступ:** Любой авторизованный пользователь.
      operationId: logoutAll
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '401':
          description: 'UNAUTHORIZED: Заголовок Authorization отсутствует, а access-токен недействителен или истёк
            (для истёкшего токена code = TOKEN_EXPIRED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    code: UNAUTHORIZED
                    message: Требуется авторизация
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password/change-request:
    post:
      tags:
      - Auth
      summary: Запрос смены пароля
      description: |-
        Первый шаг смены пароля: проверяет текущий пароль и отправляет на email одноразовый код (VerificationToken, тип PASSWORD_CHANGE).

        **Доступ:** Любой авторизованный пользователь.
      operationId: requestPasswordChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '400':
          description: 'INVALID_CURRENT_PASSWORD: Переданный текущий пароль не совпадает с паролем пользователя'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CURRENT_PASSWORD:
                  summary: INVALID_CURRENT_PASSWORD
                  value:
                    code: INVALID_CURRENT_PASSWORD
                    message: Текущий пароль указан неверно
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '401':
          description: 'UNAUTHORIZED: Заголовок Authorization отсутствует, а access-токен недействителен или истёк
            (для истёкшего токена code = TOKEN_EXPIRED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    code: UNAUTHORIZED
                    message: Требуется авторизация
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '422':
          description: 'VALIDATION_ERROR: Поля не прошли проверку (формат, длина, обязательность, несуществующая
            ссылка на объект); подробности в details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации данных
                    details:
                    - field: current_password
                      message: Недопустимое значение поля
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '429':
          description: 'TOO_MANY_REQUESTS: Превышен лимит запросов; повторите позже (заголовок Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOO_MANY_REQUESTS:
                  summary: TOO_MANY_REQUESTS
                  value:
                    code: TOO_MANY_REQUESTS
                    message: Слишком много запросов
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password/change-confirm:
    post:
      tags:
      - Auth
      summary: Подтверждение смены пароля
      description: |-
        Второй шаг смены пароля: проверяет код из письма, сохраняет хеш нового пароля и отзывает все refresh-токены пользователя (все сессии завершаются).

        **Доступ:** Любой авторизованный пользователь.
      operationId: confirmPasswordChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeConfirmRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Успешно, тела ответа нет
        '400':
          description: 'INVALID_CODE: Код подтверждения неверен, просрочен или уже использован'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CODE:
                  summary: INVALID_CODE
                  value:
                    code: INVALID_CODE
                    message: Неверный или просроченный код подтверждения
                    request_id: 9b2f1c7e-51a4-4c7a-8a0e-3c1d2b4f6a10
        '401':
          description: 'UNAUTHORIZED: Заголовок Authorization отсутствует, а access-токен недействителен или истёк
            (для истёкшего токена code = TOKEN_EXPIRED)'
          content:
            application/json:
              schema:
