# ЛР 2: микросервисы сайта поиска работы.
# Один образ (jobsearch-services) запускается 8 раз с разными командами;
# наружу открыт шлюз (8080), Postgres (15432) и RabbitMQ management UI (15672, ДЗ5).
x-common-env: &common-env
  MAIL_DEBUG: "true"            # тестовый ящик писем GET /api/v1/dev/mailbox (для Postman); на продакшене выключить
  SERVICE_CLIENTS: "api-gateway:secret-api-gateway-0123456789,identity-service:secret-identity-service-0123456789,reference-service:secret-reference-service-0123456789,vacancy-service:secret-vacancy-service-0123456789,resume-service:secret-resume-service-0123456789,application-service:secret-application-service-0123456789,recommendation-service:secret-recommendation-service-0123456789,notification-service:secret-notification-service-0123456789,ops-tools:secret-ops-tools-0123456789"
  DB_HOST: postgres
  DB_PORT: "5432"
  RABBITMQ_URL: "amqp://jobsearch:jobsearch@rabbitmq:5672"   # ДЗ5: межсервисные события publisher/consumer сервисы читают отсюда

x-service: &service
  image: jobsearch-services
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: jobsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./dbs/postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 7 баз и 7 пользователей (по одной на сервис)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jobsearch-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jobsearch
      RABBITMQ_DEFAULT_PASS: jobsearch
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (http://localhost:15672, jobsearch/jobsearch)
    volumes:
      - ./dbs/rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    <<: *service
    container_name: api-gateway
    command: npx tsx services/gateway/src/app.ts
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - reference-service
      - vacancy-service
      - resume-service
      - application-service
      - recommendation-service
      - notification-service
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      SERVICE_SECRET: secret-api-gateway-0123456789
      PORT: "8080"
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"

  identity-service:
    <<: *service
    container_name: identity-service
    command: npx tsx services/identity/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: identity-service
      SERVICE_SECRET: secret-identity-service-0123456789
      PORT: "8001"
      DB_NAME: identity_db
      DB_USER: identity
      DB_PASSWORD: identity
      JWT_KEY_FILE: /keys/jwt-private.pem
    volumes:
      - identity-keys:/keys

  reference-service:
    <<: *service
    container_name: reference-service
    command: npx tsx services/reference/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: reference-service
      SERVICE_SECRET: secret-reference-service-0123456789
      PORT: "8002"
      DB_NAME: reference_db
      DB_USER: reference
      DB_PASSWORD: reference

  vacancy-service:
    <<: *service
    container_name: vacancy-service
    command: npx tsx services/vacancy/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: vacancy-service
      SERVICE_SECRET: secret-vacancy-service-0123456789
      PORT: "8003"
      DB_NAME: vacancy_db
      DB_USER: vacancy
      DB_PASSWORD: vacancy

  resume-service:
    <<: *service
    container_name: resume-service
    command: npx tsx services/resume/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: resume-service
      SERVICE_SECRET: secret-resume-service-0123456789
      PORT: "8004"
      DB_NAME: resume_db
      DB_USER: resume
      DB_PASSWORD: resume

  application-service:
    <<: *service
    container_name: application-service
    command: npx tsx services/application/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: application-service
      SERVICE_SECRET: secret-application-service-0123456789
      PORT: "8005"
      DB_NAME: application_db
      DB_USER: application
      DB_PASSWORD: application

  recommendation-service:
    <<: *service
    container_name: recommendation-service
    command: npx tsx services/recommendation/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: recommendation-service
      SERVICE_SECRET: secret-recommendation-service-0123456789
      PORT: "8006"
      DB_NAME: recommendation_db
      DB_USER: recommendation
      DB_PASSWORD: recommendation

  notification-service:
    <<: *service
    container_name: notification-service
    command: npx tsx services/notification/src/app.ts
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      SERVICE_SECRET: secret-notification-service-0123456789
      PORT: "8007"
      DB_NAME: notification_db
      DB_USER: notification
      DB_PASSWORD: notification

volumes:
  identity-keys:
