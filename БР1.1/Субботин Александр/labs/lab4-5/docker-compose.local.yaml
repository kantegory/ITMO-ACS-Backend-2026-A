# Override для локального запуска на Docker Desktop (macOS/Windows).
#
# На Docker Desktop контейнеры с network_mode: host живут в служебной ВМ, и
# Prometheus не может достучаться до них через host-gateway. Поэтому локально
# node-exporter переводится в обычную сеть backend (метрики CPU/RAM/диска —
# по ВМ Docker Desktop, сеть — по интерфейсу контейнера). Также корень Docker
# Desktop не является shared/slave-маунтом, поэтому rslave убирается.
#
# Использование: COMPOSE_FILE=docker-compose.yaml:docker-compose.monitoring.yaml:docker-compose.local.yaml
services:
  node-exporter:
    network_mode: !reset null
    networks: [backend]
    volumes: !override
      - /:/host:ro

  prometheus:
    extra_hosts: !reset []
