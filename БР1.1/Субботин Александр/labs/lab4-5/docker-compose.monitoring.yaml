# ЛР5: мониторинг микросервисов — Grafana + Prometheus + Loki + Promtail.
#
#   node-exporter      — метрики ВМ: CPU, RAM, диск, сеть
#   blackbox-exporter  — healthcheck'и сервисов (HTTP /health, gRPC health, TCP)
#   prometheus         — сбор и хранение метрик
#   promtail → loki    — логи всех контейнеров на ВМ (через Docker API)
#   grafana            — дашборд + алерты на почту (доп. задание)
#   mailpit            — тестовый SMTP-ящик (профиль "mailpit"), для prod — реальный SMTP
#
# Наружу ничего не публикуется, кроме Grafana на 127.0.0.1 (доступ через nginx /grafana/).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-monitoring: &monitoring
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  oom_score_adj: 300

services:
  prometheus:
    <<: *monitoring
    image: prom/prometheus:v3.13.5
    mem_limit: 384m
    container_name: mon_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    # node-exporter работает в сети хоста: на Linux имя "node-exporter"
    # резолвится в адрес docker-хоста (см. docker-compose.local.yaml для Docker Desktop)
    extra_hosts:
      - "node-exporter:host-gateway"
    depends_on: [blackbox-exporter]

  node-exporter:
    restart: unless-stopped
    logging: *logging
    image: prom/node-exporter:v1.12.1
    mem_limit: 64m
    oom_score_adj: 300
    container_name: mon_node_exporter
    # метрики ВМ, а не контейнера: сеть и PID-namespace хоста, корень ФС хоста read-only
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /:/host:ro,rslave

  blackbox-exporter:
    <<: *monitoring
    image: prom/blackbox-exporter:v0.29.0
    mem_limit: 64m
    container_name: mon_blackbox
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  loki:
    <<: *monitoring
    image: grafana/loki:3.6.19
    mem_limit: 384m
    container_name: mon_loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki

  promtail:
    <<: *monitoring
    image: grafana/promtail:3.6.11
    mem_limit: 128m
    container_name: mon_promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail:/tmp/promtail
    depends_on: [loki]

  grafana:
    <<: *monitoring
    image: grafana/grafana:13.0.12
    mem_limit: 512m
    container_name: mon_grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1:3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana отдаётся nginx'ом по пути /grafana/
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/rental-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # SMTP для алертов на почту (доп. задание)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-mailpit:1025}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-grafana@rental.local}
      GF_SMTP_FROM_NAME: Rental Monitoring
      GF_SMTP_SKIP_VERIFY: ${SMTP_SKIP_VERIFY:-false}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}
      # используются в provisioning/alerting/*.yaml
      ALERT_EMAIL: ${ALERT_EMAIL:-admin@rental.local}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki]

  mailpit:
    <<: *monitoring
    image: axllent/mailpit:v1.31.6
    mem_limit: 64m
    container_name: mon_mailpit
    profiles: [mailpit]
    # веб-интерфейс тестового ящика — http://127.0.0.1:8025
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  prometheus:
  loki:
  promtail:
  grafana:
