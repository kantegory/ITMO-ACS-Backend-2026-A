# Доп. задание: уведомления о смене состояния healthcheck на почту.
# Адрес получателя берётся из переменной окружения ALERT_EMAIL (.env).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-admin
    receivers:
      - uid: email-admin
        type: email
        disableResolveMessage: false   # письмо и при падении, и при восстановлении
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true
          subject: '{{ if eq .Status "firing" }}🔴 DOWN{{ else }}🟢 UP{{ end }}: {{ range .Alerts }}{{ .Labels.service }} {{ end }}'
