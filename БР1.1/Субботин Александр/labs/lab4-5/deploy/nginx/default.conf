# Сервер по умолчанию: запросы на :80 (и :443) с чужими именами — например, на
# другие домены, указывающие на этот же IP, — сбрасываются без ответа (444),
# а не попадают в приложение rental.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# BEGIN tls
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
# END tls
