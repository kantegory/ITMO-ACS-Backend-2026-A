# ЛР4: nginx в режиме обратного прокси с HTTPS (сертификат Let's Encrypt).
# Устанавливается setup-nginx.sh, когда для домена уже выпущен сертификат.

include /etc/nginx/snippets/rental-http.conf;

# http → https для домена
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rental_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/rental-locations.conf;
}

# BEGIN plain-http
# доступ по IP без TLS — для проверок и CI (сертификат на IP не выпускается)
server {
    listen 80;
    listen [::]:80;
    server_name __HTTP_NAMES__;

    include /etc/nginx/snippets/rental-locations.conf;
}
# END plain-http
