# Общие директивы http-контекста для сайта rental.
# Подключается один раз в начале /etc/nginx/sites-available/rental.

# защита эндпоинтов аутентификации от перебора: 10 запросов/с с одного IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

upstream api_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream grafana {
    server 127.0.0.1:3000;
    keepalive 8;
}

# для websocket'ов Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
