# Общая часть server-блока сайта rental (HTTP и HTTPS).
#   /            → api-gateway (REST API + Swagger), 127.0.0.1:8080
#   /grafana/    → Grafana (ЛР5), 127.0.0.1:3000

access_log /var/log/nginx/rental.access.log;
error_log  /var/log/nginx/rental.error.log warn;

client_max_body_size 10m;
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_types application/json text/css application/javascript text/plain;
gzip_min_length 1024;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_read_timeout    60s;

location = /health {
    proxy_pass http://api_gateway;
    access_log off;
}

location /api/v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api_gateway;
}

location / {
    proxy_pass http://api_gateway;
}

location /grafana/ {
    proxy_pass http://grafana;
}

# proxy_set_header внутри location отменяет наследование заголовков из server,
# поэтому здесь они перечислены заново
location /grafana/api/live/ {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_pass http://grafana;
}

# тестовый маршрут Sentry не должен быть доступен извне
location /debug/ {
    return 404;
}
