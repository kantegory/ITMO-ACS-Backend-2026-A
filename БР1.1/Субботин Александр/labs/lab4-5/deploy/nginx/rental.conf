# ЛР4: nginx в режиме обратного прокси (вариант без HTTPS).
# Устанавливается в /etc/nginx/sites-available/rental скриптом deploy/scripts/setup-nginx.sh,
# общая часть — в snippets/ (ставится в /etc/nginx/snippets/).
#
# Сами сервисы опубликованы только на 127.0.0.1, поэтому извне доступен лишь nginx.

include /etc/nginx/snippets/rental-http.conf;

server {
    listen 80;
    listen [::]:80;
    # setup-nginx.sh подставляет домен и/или IP сервера
    server_name __SERVER_NAME__;

    include /etc/nginx/snippets/rental-locations.conf;
}
