# Доп. задание: self-hosted Sentry за nginx.
# Sentry не поддерживает размещение в под-пути (/sentry/), поэтому он вынесен
# на отдельный порт 8000 (или на поддомен — замените listen/server_name).
server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    access_log /var/log/nginx/sentry.access.log;
    error_log  /var/log/nginx/sentry.error.log warn;

    # envelope'ы с вложениями/минидампами могут быть большими
    client_max_body_size 100m;
    server_tokens off;

    location / {
        proxy_http_version 1.1;
        # $http_host — с портом, чтобы Django CSRF совпал с CSRF_TRUSTED_ORIGINS
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:9000;
    }
}
