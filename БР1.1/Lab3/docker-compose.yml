services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rentease-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rentease
      RABBITMQ_DEFAULT_PASS: rentease
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rentease]

  identity-service:
    build:
      context: ../Lab2
      dockerfile: identity-service/Dockerfile
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    volumes:
      - identity-data:/app/data
    ports:
      - "8081:8081"
    networks: [rentease]

  property-service:
    build:
      context: ../Lab2
      dockerfile: property-service/Dockerfile
    environment:
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/property;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    volumes:
      - property-data:/app/data
    ports:
      - "8082:8082"
    networks: [rentease]

  booking-service:
    build:
      context: ../Lab2
      dockerfile: booking-service/Dockerfile
    environment:
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/booking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
      PROPERTY_SERVICE_URL: http://property-service:8082
      CONTRACT_SERVICE_URL: http://contract-service:8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rentease
      RABBITMQ_PASSWORD: rentease
    volumes:
      - booking-data:/app/data
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [rentease]

  contract-service:
    build:
      context: ../Lab2
      dockerfile: contract-service/Dockerfile
    environment:
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/contract;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    volumes:
      - contract-data:/app/data
    ports:
      - "8084:8084"
    networks: [rentease]

  communication-service:
    build:
      context: ../Lab2
      dockerfile: communication-service/Dockerfile
    environment:
      PORT: 8085
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/communication;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rentease
      RABBITMQ_PASSWORD: rentease
    volumes:
      - communication-data:/app/data
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [rentease]

  review-service:
    build:
      context: ../Lab2
      dockerfile: review-service/Dockerfile
    environment:
      PORT: 8086
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      DB_URL: jdbc:h2:file:/app/data/review;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
      CONTRACT_SERVICE_URL: http://contract-service:8084
    volumes:
      - review-data:/app/data
    ports:
      - "8086:8086"
    networks: [rentease]

  api-gateway:
    build:
      context: ../Lab2
      dockerfile: api-gateway/Dockerfile
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local-lab3-secret-change-me}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      CONTRACT_SERVICE_URL: http://contract-service:8084
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      REVIEW_SERVICE_URL: http://review-service:8086
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - property-service
      - booking-service
      - contract-service
      - communication-service
      - review-service
    networks: [rentease]

networks:
  rentease:
    driver: bridge

volumes:
  identity-data:
  property-data:
  booking-data:
  contract-data:
  communication-data:
  review-data:
