openapi: 3.0.3
info:
  title: Restaurant Booking - Internal Service API
  version: 1.0.0
  description: >-
    ДЗ4 / ЛР2. Синхронный HTTP/JSON только в локальной сети 127.0.0.1.
    Порты настраиваются через .env. Gateway не публикует эти пути.
    Тело GET-запросов отсутствует. Таймаут потребителя 2000 мс.
servers:
  - url: http://127.0.0.1:8081
    description: Accounts (default)
  - url: http://127.0.0.1:8082
    description: Catalog (default)
paths:
  /internal/auth/verify:
    servers:
      - url: http://127.0.0.1:8081
    get:
      operationId: verifyCurrentUser
      tags: [Accounts]
      summary: Проверка токена и получение текущего профиля
      description: >-
        Вызывается Catalog при записи отзыва и Bookings для защищенных операций.
        Проверяет HS256, issuer restaurant-accounts, audience restaurant-api,
        срок действия и существование пользователя. Не возвращает хеш пароля.
      security:
        - ServiceKey: []
          BearerAuth: []
      responses:
        '200':
          description: Токен действителен; актуальный профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: 1
                firstName: Александр
                lastName: Прель
                email: demo@example.com
                phone: '+79995550123'
                createdAt: '2026-09-09T10:00:00.000Z'
                updatedAt: '2026-09-09T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/restaurants/{restaurantId}/booking-context:
    servers:
      - url: http://127.0.0.1:8082
    get:
      operationId: getRestaurantBookingContext
      tags: [Catalog]
      summary: Ресторан и активные столики для создания бронирования
      description: >-
        Вызывается Bookings. Столики отсортированы по capacity, затем tableId.
        Это не гарантия свободного интервала: занятость хранится в Bookings.
        Пустой массив tables допустим. Часы работы информативны, переход
        бронирования через полночь в текущем публичном API не поддерживается.
      security:
        - ServiceKey: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          example: 1
      responses:
        '200':
          description: Ресторан существует; возвращен снимок контекста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingContext'
              example:
                restaurantId: 1
                restaurantName: La Piazza
                openingTime: '10:00:00'
                closingTime: '23:00:00'
                tables:
                  - tableId: 1
                    tableNumber: '1'
                    capacity: 2
        '400':
          description: Некорректный идентификатор ресторана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: BAD_REQUEST, message: 'Некорректные параметры запроса.'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ресторан не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: NOT_FOUND, message: 'Ресторан не найден.'}
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Общий секрет из локального SERVICE_KEY; не передается через Gateway
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [userId, firstName, lastName, email, phone, createdAt, updatedAt]
      properties:
        userId: {type: integer, minimum: 1}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BookingContext:
      type: object
      additionalProperties: false
      required: [restaurantId, restaurantName, openingTime, closingTime, tables]
      properties:
        restaurantId: {type: integer, minimum: 1}
        restaurantName: {type: string}
        openingTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'}
        closingTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'}
        tables:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tableId, tableNumber, capacity]
            properties:
              tableId: {type: integer, minimum: 1}
              tableNumber: {type: string}
              capacity: {type: integer, minimum: 1}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_ERROR, INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT]
            message: {type: string}
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string}
                  message: {type: string}
  responses:
    Unauthorized:
      description: Отсутствует или неверен сервисный ключ; для Accounts также неверный JWT или отсутствующий пользователь
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: UNAUTHORIZED, message: 'Требуется Bearer JWT или токен недействителен.'}
    InternalError:
      description: Непредвиденная ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: INTERNAL_SERVER_ERROR, message: 'Внутренняя ошибка сервера.'}
    Unavailable:
      description: >-
        Сервис или его БД недоступны. При сетевой ошибке вызывающий сервис
        формирует такой же 503 самостоятельно; не маскирует его под 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: SERVICE_UNAVAILABLE, message: 'Зависимый сервис недоступен.'}
    Timeout:
      description: >-
        Внутренний HTTP-запрос не завершился за 2000 мс. Этот ответ формирует
        потребитель (Catalog/Bookings) или Gateway в публичном API, а не
        зависимость, которая не успела ответить. Автоматического повтора нет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: UPSTREAM_TIMEOUT, message: 'Зависимый сервис не ответил вовремя.'}
