global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: vm
    static_configs:
      - targets: [host.docker.internal:9100]

  - job_name: health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://auth-service:8081/ready]
        labels: {service: auth}
      - targets: [http://catalog-service:8082/ready]
        labels: {service: catalog}
      - targets: [http://booking-service:8083/ready]
        labels: {service: booking}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
