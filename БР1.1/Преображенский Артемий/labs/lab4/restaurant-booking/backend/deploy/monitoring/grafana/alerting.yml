apiVersion: 1

groups:
  - orgId: 1
    name: Healthcheck
    folder: Backend
    interval: 20s
    rules:
      - uid: backend-readiness
        title: Backend readiness
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: '{{ $labels.service }} readiness check failed'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              expr: 'probe_success{job="health"} or on (service) (up{job="health"} * 0)'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}

contactPoints:
  - orgId: 1
    name: Lab6 email
    receivers:
      - uid: lab6-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $GRAFANA_ALERT_EMAIL

policies:
  - orgId: 1
    receiver: Lab6 email
    group_by: [alertname, service]
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 4h
