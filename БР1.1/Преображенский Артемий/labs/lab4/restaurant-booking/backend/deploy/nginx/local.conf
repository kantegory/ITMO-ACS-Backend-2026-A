server {
    listen 8180 default_server;
    server_name localhost;
    root /opt/restaurant-booking/frontend/public;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        proxy_pass http://127.0.0.1:8081;
    }

    # Проверка доступности столика относится к Booking.
    location ~ ^/api/restaurants/[^/]+/tables/[^/]+/availability$ {
        proxy_pass http://127.0.0.1:8083;
    }

    location /api/restaurants/ {
        proxy_pass http://127.0.0.1:8082;
    }

    location = /api/bookings {
        proxy_pass http://127.0.0.1:8083;
    }

    location = /api/me/bookings {
        proxy_pass http://127.0.0.1:8083;
    }

    location /api/me/bookings/ {
        proxy_pass http://127.0.0.1:8083;
    }

    location /docs/auth/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location /docs/catalog/ {
        proxy_pass http://127.0.0.1:8082;
    }

    location /docs/booking/ {
        proxy_pass http://127.0.0.1:8083;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
