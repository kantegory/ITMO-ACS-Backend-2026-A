services:
  auth-db:
    image: postgres:16-alpine
    restart: always
    container_name: restaurant-booking-auth-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-auth_db}
    ports:
    - 127.0.0.1:${POSTGRES_PORT_AUTH:-5433}:5432
    volumes:
    - auth-dbdata:/var/lib/postgresql/data
    - ../auth-service/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
    networks:
    - restaurant-booking
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_AUTH:-auth_db}
      interval: 5s
      timeout: 5s
      retries: 10
  catalog-db:
    image: postgres:16-alpine
    restart: always
    container_name: restaurant-booking-catalog-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CATALOG:-catalog_db}
    ports:
    - 127.0.0.1:${POSTGRES_PORT_CATALOG:-5434}:5432
    volumes:
    - catalog-dbdata:/var/lib/postgresql/data
    - ../catalog-service/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    - ../catalog-service/migrations/000002_users_cache.up.sql:/docker-entrypoint-initdb.d/02_users_cache.sql:ro
    networks:
    - restaurant-booking
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_CATALOG:-catalog_db}
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4.3.1-management@sha256:8734b9e9cd03d12b2e1d973415fc4c5c941c5eca351b4bd63f721782b1bf7c8b
    restart: always
    container_name: restaurant-booking-rabbitmq
    ports:
    - 127.0.0.1:${RABBITMQ_PORT_AMQP:-5672}:5672
    - 127.0.0.1:${RABBITMQ_PORT_MANAGEMENT:-15672}:15672
    networks:
    - restaurant-booking
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-booking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
  booking-db:
    image: postgres:16-alpine
    restart: always
    container_name: restaurant-booking-booking-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_BOOKING:-booking_db}
    ports:
    - 127.0.0.1:${POSTGRES_PORT_BOOKING:-5435}:5432
    volumes:
    - booking-dbdata:/var/lib/postgresql/data
    - ../booking-service/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
    networks:
    - restaurant-booking
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_BOOKING:-booking_db}
      interval: 5s
      timeout: 5s
      retries: 10
  auth-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      args:
        SERVICE: auth-service
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: always
    container_name: restaurant-booking-auth-service
    env_file:
    - ../.env
    ports:
    - 127.0.0.1:${AUTH_SERVICE_PUBLISHED_PORT:-8081}:8081
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
    - restaurant-booking
    environment:
      AUTH_DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@auth-db:5432/auth_db?sslmode=disable
      AUTH_HTTP_ADDR: :8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES: 24h
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-booking}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8081/ready
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
  catalog-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      args:
        SERVICE: catalog-service
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: always
    container_name: restaurant-booking-catalog-service
    env_file:
    - ../.env
    ports:
    - 127.0.0.1:${CATALOG_SERVICE_PUBLISHED_PORT:-8082}:8082
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - restaurant-booking
    environment:
      CATALOG_DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@catalog-db:5432/catalog_db?sslmode=disable
      CATALOG_HTTP_ADDR: :8082
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-booking}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8082/ready
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
  booking-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      args:
        SERVICE: booking-service
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: always
    container_name: restaurant-booking-booking-service
    env_file:
    - ../.env
    ports:
    - 127.0.0.1:${BOOKING_SERVICE_PUBLISHED_PORT:-8083}:8083
    depends_on:
      booking-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
    - restaurant-booking
    environment:
      BOOKING_DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@booking-db:5432/booking_db?sslmode=disable
      BOOKING_HTTP_ADDR: :8083
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8082
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8083/ready
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.2.1
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-mailpit:1025}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER:-grafana@lab6.test}
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS_POLICY:-NoStartTLS}
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-student@lab6.test}
    volumes:
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/backend.json:ro
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/backend.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/backend.yml:ro
      - ./monitoring/grafana/alerting.yml:/etc/grafana/provisioning/alerting/backend.yml:ro

  mailpit:
    profiles: [monitoring]
    image: axllent/mailpit:v1.27.4
    ports:
      - 127.0.0.1:8025:8025

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  blackbox:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.26.0
    networks:
      - default
      - restaurant-booking

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.6.7
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro

  promtail:
    profiles: [monitoring]
    image: grafana/promtail:3.4.2
    command:
      - -config.file=/etc/promtail/config.yml
    environment:
      DOCKER_API_VERSION: '1.44'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/positions
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro

volumes:
  prometheus-data:
  loki-data:
  promtail-data:
  auth-dbdata:
    name: restaurant_booking_auth_dbdata
  catalog-dbdata:
    name: restaurant_booking_catalog_dbdata
  booking-dbdata:
    name: restaurant_booking_booking_dbdata
  rabbitmq-data:
    name: restaurant_booking_rabbitmq
networks:
  restaurant-booking:
    driver: bridge
