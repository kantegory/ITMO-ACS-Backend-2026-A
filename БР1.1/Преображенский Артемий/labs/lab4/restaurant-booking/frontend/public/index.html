<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рестораны - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/restaurants.js" defer></script>
  </head>
  <body>
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container page-shell">
      <p id="page-message" class="my-4" role="status" tabindex="-1" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить</button>
      <div class="page-intro">
        <h1>Бронирование столиков</h1>
      </div>
      <form id="restaurant-search" role="search">
        <div class="row g-3 align-items-end">
          <div class="col-md-6 col-lg-3">
            <label for="city" class="form-label">Город</label>
            <div class="select-field">
              <select id="city" name="city" class="form-select">
                <option value="">Любой город</option>
                <option>Санкт-Петербург</option>
                <option>Москва</option>
              </select>
              <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
            </div>
          </div>
          <div class="col-md-6 col-lg-3">
            <label for="cuisine" class="form-label">Кухня</label>
            <div class="select-field">
              <select id="cuisine" name="cuisine_type" class="form-select">
                <option value="">Любая кухня</option>
                <option value="russian">Русская</option>
                <option value="italian">Итальянская</option>
                <option value="georgian">Грузинская</option>
              </select>
              <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
            </div>
          </div>
          <div class="col-md-6 col-lg-3">
            <label for="price" class="form-label">Средний чек</label>
            <div class="select-field">
              <select id="price" name="price_category" class="form-select">
                <option value="">Любой чек</option>
                <option value="low">До 1000 ₽</option>
                <option value="medium">1000–1999 ₽</option>
                <option value="high">От 2000 ₽</option>
              </select>
              <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
            </div>
          </div>
          <div class="col-md-6 col-lg-3">
            <button class="btn btn-primary" type="submit">
              Найти ресторан
            </button>
          </div>
        </div>
      </form>
      <div class="section-heading">
        <h2>Рестораны</h2>
        <div class="d-flex gap-3 align-items-center">
          <p id="restaurant-count" role="status">Загружаем рестораны...</p>
          <button class="btn btn-link p-0" type="reset" form="restaurant-search">
            Сбросить
          </button>
        </div>
      </div>
      <div id="restaurant-results" class="row g-4"></div>
      <template id="restaurant-card">
        <div class="col-md-6 col-xl-4 restaurant-card">
          <article class="card h-100">
            <img class="card-img-top" alt="Интерьер ресторана" />
            <div class="card-body">
              <p class="card-meta"></p>
              <h3></h3>
              <p class="description"></p>
              <p class="small-copy"></p>
              <a class="btn btn-primary">О ресторане</a>
            </div>
          </article>
        </div>
      </template>
      <div id="no-restaurants" class="empty-state" hidden>
        <h3>Пока ничего не нашлось</h3>
        <p>Попробуйте другую кухню, город или средний чек.</p>
        <button
          class="btn btn-outline-primary"
          type="reset"
          form="restaurant-search"
        >
          Сбросить фильтры
        </button>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
