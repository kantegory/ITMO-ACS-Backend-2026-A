<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>О ресторане - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/restaurant.js" defer></script>
  </head>
  <body>
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container page-shell">
      <p id="page-message" class="my-4" role="status" tabindex="-1" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить</button>
      <a class="small-copy mb-3 d-inline-block" href="index.html">← Все рестораны</a>
      <div id="restaurant-content" hidden>
        <div class="restaurant-heading">
          <div>
            <p class="eyebrow">
              <span data-restaurant-field="city"></span> ·
              <span data-restaurant-field="cuisine"></span> ·
              <span data-restaurant-field="price"></span>
            </p>
            <h1 data-restaurant-field="name"></h1>
            <p class="lead-copy mb-0" data-restaurant-field="description"></p>
            <p class="small-copy muted mt-3 mb-0" data-restaurant-field="address"></p>
          </div>
          <a id="reserve-table" class="btn btn-primary flex-shrink-0" href="index.html">Выбрать столик</a>
        </div>
        <div class="gallery">
          <img src="images/marcellis.jpg" alt="Интерьер ресторана" width="1600" height="1752" />
        </div>
        <ul class="nav nav-tabs" role="tablist" aria-label="О ресторане">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu"
                    type="button" role="tab" aria-controls="menu" aria-selected="true">Меню</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews"
                    type="button" role="tab" aria-controls="reviews" aria-selected="false">Отзывы</button>
          </li>
        </ul>
        <div class="tab-content">
          <section class="tab-pane fade show active" id="menu" role="tabpanel" aria-labelledby="menu-tab" tabindex="0">
            <h2 class="mb-4">Меню</h2>
            <div id="menu-list"></div>
            <template id="menu-item">
              <article class="menu-item">
                <div><h3></h3><p></p></div>
                <strong></strong>
              </article>
            </template>
          </section>
          <section class="tab-pane fade" id="reviews" role="tabpanel" aria-labelledby="reviews-tab" tabindex="0">
            <h2 class="mb-4">Отзывы</h2>
            <div id="reviews-list"></div>
            <template id="review-item">
              <article class="review">
                <div class="d-flex justify-content-between mb-3">
                  <strong></strong><span class="rating"></span>
                </div>
                <p class="mb-0"></p>
              </article>
            </template>
            <form id="review-form" class="mt-4 col-lg-6" method="post">
              <h3 class="mb-3">Оставить отзыв</h3>
              <div class="mb-3">
                <label class="form-label" for="review-rating">Оценка</label>
                <div class="select-field">
                  <select class="form-select" id="review-rating" name="rating">
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                  </select>
                  <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="review-text">Отзыв</label>
                <textarea class="form-control" id="review-text" name="text" rows="3" required></textarea>
              </div>
              <button class="btn btn-primary" type="submit">Отправить</button>
            </form>
            <p id="review-feedback" class="mt-3 mb-0" role="status" tabindex="-1"></p>
          </section>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
