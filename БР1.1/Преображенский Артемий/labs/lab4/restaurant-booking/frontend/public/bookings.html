<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мои бронирования - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/bookings.js" defer></script>
  </head>
  <body>
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container py-5">
      <div class="page-heading d-flex justify-content-between align-items-start gap-3 flex-wrap mb-4">
        <div>
          <p class="eyebrow">Личный кабинет</p>
          <h1>Мои бронирования</h1>
        </div>
        <div class="d-flex gap-3 flex-wrap">
          <a class="btn btn-outline-primary" href="profile.html">Мой профиль</a>
          <a class="btn btn-outline-primary" href="index.html">Найти ресторан</a>
        </div>
      </div>
      <p id="page-message" class="text-danger" role="alert" tabindex="-1" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить загрузку</button>
      <section id="bookings-content" aria-label="Список бронирований" hidden>
        <div class="row mb-4">
          <div class="col-sm-6 col-lg-4">
            <label class="form-label" for="booking-status">Статус бронирования</label>
            <div class="select-field">
              <select class="form-select" id="booking-status">
                <option value="all">Все бронирования</option>
                <option value="upcoming" selected>Предстоящие</option>
                <option value="cancelled">Отмененные</option>
              </select>
              <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
            </div>
          </div>
        </div>
        <p id="bookings-feedback" class="text-muted" role="status"></p>
        <div id="bookings-list" class="row g-4"></div>
        <div id="bookings-empty" class="panel p-4 text-center" hidden>
          <h2 id="bookings-empty-title">Бронирований нет</h2>
          <p id="bookings-empty-text" class="text-muted">Выберите ресторан и забронируйте столик.</p>
          <a class="btn btn-primary" href="index.html">Выбрать ресторан</a>
        </div>
      </section>
      <noscript><p>Чтобы посмотреть бронирования, включите JavaScript в браузере.</p></noscript>
    </main>
    <footer id="site-footer"></footer>
    <template id="booking-card">
      <div class="col-lg-6">
        <article class="card h-100">
          <div class="card-body p-4 d-flex flex-column">
            <h2 class="h4 text-break" data-field="restaurant"></h2>
            <p class="text-muted" data-field="status"></p>
            <dl class="row gy-2">
              <dt class="col-5">Дата</dt><dd class="col-7" data-field="date"></dd>
              <dt class="col-5">Время</dt><dd class="col-7" data-field="time"></dd>
              <dt class="col-5">Столик</dt><dd class="col-7 text-break" data-field="table"></dd>
              <dt class="col-5">Гостей</dt><dd class="col-7" data-field="guests"></dd>
            </dl>
            <div class="d-flex gap-3 flex-wrap mt-auto">
              <a class="btn btn-outline-primary" data-field="link">О ресторане</a>
              <button class="btn btn-outline-primary" type="button" data-field="cancel" data-bs-toggle="modal" data-bs-target="#cancelBookingModal">Отменить бронь</button>
            </div>
          </div>
        </article>
      </div>
    </template>

    <div class="modal" id="cancelBookingModal" tabindex="-1" aria-labelledby="cancel-booking-title"
      aria-describedby="cancel-booking-description" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-4" id="cancel-booking-title">Отменить бронирование?</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Закрыть">
              <svg width="16" height="16" aria-hidden="true" focusable="false"><use href="images/icons.svg#close"></use></svg>
            </button>
          </div>
          <div class="modal-body">
            <p id="cancel-booking-description"></p>
            <p class="text-muted mb-0">Бронь останется в истории со статусом «Отменено».</p>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline-primary" type="button" data-bs-dismiss="modal">Оставить бронь</button>
            <button class="btn btn-primary" id="confirm-cancel-booking" type="button">Да, отменить</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
