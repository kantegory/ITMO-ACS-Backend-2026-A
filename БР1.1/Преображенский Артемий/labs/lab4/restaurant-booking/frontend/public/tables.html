<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Выбор столика - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/visit.js" defer></script>
    <script src="js/tables.js" defer></script>
  </head>
  <body>
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container page-shell">
      <p id="page-message" class="my-4" role="status" tabindex="-1" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить</button>
      <div class="page-heading">
        <p class="eyebrow">01 / Выбор столика</p>
        <h1>Выбор столика</h1>
        <p>Укажите дату, время и число гостей</p>
      </div>
      <p id="table-restaurant" class="small" hidden></p>
      <form id="table-search">
        <div class="date-field">
          <label for="visit-date" class="form-label">Дата посещения</label>
          <input id="visit-date" name="date" class="form-control" type="date" required />
        </div>
        <div>
          <label for="start" class="form-label">Начало</label>
          <input id="start" name="start" aria-describedby="visit-help" class="form-control" type="time" value="19:00" min="12:00" max="22:00" required />
        </div>
        <div>
          <label for="end" class="form-label">Окончание</label>
          <input id="end" name="end" aria-describedby="visit-help" class="form-control" type="time" value="21:00" min="12:30" max="23:00" required />
        </div>
        <div>
          <label for="guests" class="form-label">Гости</label>
          <div class="select-field">
            <select id="guests" name="guests" class="form-select" required>
              <option value="">Гости</option>
              <option value="1">1 человек</option>
              <option value="2" selected>2 человека</option>
              <option value="3">3 человека</option>
              <option value="4">4 человека</option>
              <option value="5">5 человек</option>
              <option value="6">6 человек</option>
            </select>
            <svg class="select-arrow" width="16" height="12" aria-hidden="true" focusable="false"><use href="images/icons.svg#chevron-down"></use></svg>
          </div>
        </div>
        <div>
          <button class="btn btn-primary w-100" type="submit">Найти столик</button>
        </div>
      </form>
      <p id="visit-help" class="small mt-3">Время московское. Работаем с 12:00 до 23:00. Окончание должно быть позже начала.</p>
      <section class="mt-5" aria-labelledby="tables-heading">
        <div class="table-heading">
          <h2 id="tables-heading" class="mb-0">Доступные столы</h2>
          <p id="table-count" class="small mb-0" role="status"></p>
        </div>
        <div id="table-results" class="row g-4"></div>
        <template id="table-card">
          <div class="col-md-6 col-xl-4">
            <article class="card table-card h-100">
              <img class="card-img-top" alt="Столик" />
              <div class="card-body">
                <h3></h3>
                <p class="small mb-2 capacity"></p>
                <a class="btn btn-primary">Забронировать</a>
              </div>
            </article>
          </div>
        </template>
        <p id="no-tables" class="empty-state" hidden>На выбранное время столиков нет. Попробуйте другую дату или меньше гостей.</p>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
