<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body data-page="register">
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container py-5">
      <div class="row g-5 align-items-center">
        <section class="col-lg-6" aria-labelledby="register-title">
          <p class="eyebrow">Личный кабинет</p>
          <h1 id="register-title">Регистрация</h1>
          <form id="register-form" method="post">
            <div class="mb-3">
              <label class="form-label" for="register-name">Имя и фамилия</label>
              <input class="form-control" id="register-name" name="full_name"
                autocomplete="name" maxlength="100" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-email">Электронная почта</label>
              <input class="form-control" id="register-email" name="email" type="email"
                autocomplete="email" placeholder="mail@example.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-phone">Телефон (необязательно)</label>
              <input class="form-control" id="register-phone" name="phone" type="tel"
                autocomplete="tel" placeholder="+7 900 000-00-00" minlength="6" maxlength="32" />
            </div>
            <div class="row g-3 mb-4">
              <div class="col-sm-6">
                <label class="form-label" for="register-password">Пароль</label>
                <input class="form-control" id="register-password" name="password" type="password"
                  autocomplete="new-password" minlength="8" aria-describedby="password-help" required />
                <p class="form-text" id="password-help">Не менее 8 символов.</p>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="register-confirm">Повторите пароль</label>
                <input class="form-control" id="register-confirm" name="password_confirm" type="password"
                  autocomplete="new-password" minlength="8" required />
              </div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Создать аккаунт</button>
            <p id="page-message" class="text-danger mt-3 mb-0" role="alert" tabindex="-1" hidden></p>
          </form>
          <p class="mt-4">Уже есть аккаунт? <a href="login.html" data-account-link>Войти</a></p>
        </section>
        <aside class="col-lg-6 d-none d-lg-block">
          <img class="img-fluid rounded-4" src="images/marcellis.jpg" width="1600" height="1752"
            alt="Столик у окна в светлом зале ресторана" />
        </aside>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
