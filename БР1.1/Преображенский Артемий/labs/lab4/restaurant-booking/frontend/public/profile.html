<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мой профиль - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/profile.js" defer></script>
  </head>
  <body>
    <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1" class="container py-5">
      <div class="page-heading mb-4">
        <p class="eyebrow">Личный кабинет</p>
        <h1>Мой профиль</h1>
      </div>
      <p id="page-message" class="text-danger" role="alert" tabindex="-1" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить загрузку</button>
      <div id="profile-content" class="row g-4" hidden>
        <section class="col-lg-8" aria-labelledby="profile-title">
          <div class="panel p-4 h-100">
            <h2 id="profile-title">Личные данные</h2>
            <dl class="row gy-3 my-4">
              <dt class="col-sm-4">Имя и фамилия</dt>
              <dd id="profile-name" class="col-sm-8 text-break"></dd>
              <dt class="col-sm-4">Электронная почта</dt>
              <dd id="profile-email" class="col-sm-8 text-break"></dd>
              <dt class="col-sm-4">Телефон</dt>
              <dd id="profile-phone" class="col-sm-8 text-break"></dd>
            </dl>
            <a class="btn btn-primary me-2" href="bookings.html">Мои бронирования</a>
            <button id="logout-button" class="btn btn-outline-primary" type="button">Выйти из аккаунта</button>
          </div>
        </section>
      </div>
      <noscript><p>Чтобы посмотреть профиль, включите JavaScript в браузере.</p></noscript>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
