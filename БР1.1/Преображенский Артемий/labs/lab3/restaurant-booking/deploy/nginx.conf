server {
    listen 80;
    server_name api.preobart.ru;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/auth(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
    }

    # Это правило должно стоять перед общим правилом restaurants.
    location ~ ^/api/restaurants/[^/]+/tables/[^/]+/availability$ {
        proxy_pass http://127.0.0.1:8083;
    }

    location ~ ^/api/(?:bookings|me/bookings)(?:/|$) {
        proxy_pass http://127.0.0.1:8083;
    }

    location ~ ^/api/restaurants(?:/|$) {
        proxy_pass http://127.0.0.1:8082;
    }

    location /docs/auth/ {
        proxy_pass http://127.0.0.1:8081;
    }
    location /docs/catalog/ {
        proxy_pass http://127.0.0.1:8082;
    }
    location /docs/booking/ {
        proxy_pass http://127.0.0.1:8083;
    }

    location / {
        return 404;
    }
}
