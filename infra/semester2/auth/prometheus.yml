global:
  scrape_interval: 15s
scrape_configs:
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [auth-service:9091]
        labels:
          service: auth-service
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
