apiVersion: v1
kind: Namespace
metadata:
  name: itmo-auth
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: itmo-auth
spec:
  clusterIP: None
  selector:
    app: auth-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: itmo-auth
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17
          args: [postgres, -c, shared_buffers=24MB, -c, max_connections=40]
          env:
            - {name: POSTGRES_DB, value: auth}
            - {name: POSTGRES_USER, value: auth}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: auth-secrets, key: DB_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, auth, -d, auth]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: itmo-auth
spec:
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: auth-service
        metrics: spring
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: itmo-backend/auth-service:standalone
          imagePullPolicy: Never
          command: [java, -Xms32m, -Xmx160m, -XX:MaxMetaspaceSize=144m, -XX:ReservedCodeCacheSize=32m, -XX:MaxDirectMemorySize=24m, -XX:+ExitOnOutOfMemoryError, -jar, /app/app.jar]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: standalone-auth}
            - {name: SERVER_PORT, value: '8081'}
            - {name: DB_URL, value: 'jdbc:postgresql://auth-db:5432/auth'}
            - {name: DB_USERNAME, value: auth}
            - {name: MANAGEMENT_SERVER_PORT, value: '9091'}
            - {name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: '8'}
            - {name: JAVA_TOOL_OPTIONS, value: '-XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1'}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: auth-secrets, key: DB_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: auth-secrets, key: JWT_SECRET}
          ports:
            - {name: http, containerPort: 8081}
            - {name: management, containerPort: 9091}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: {cpu: 120m, memory: 320Mi}
            limits: {cpu: 400m, memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: itmo-auth
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - {name: http, port: 8081, targetPort: http, nodePort: 30080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: itmo-auth
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: auth-service}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 90
