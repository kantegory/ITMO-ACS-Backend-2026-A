limit_req_zone $binary_remote_addr zone=auth_requests:2m rate=5r/s;
server {
    listen 127.0.0.1:18085;
    client_max_body_size 16k;
    set $auth_upstream http://127.0.0.1:18084;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    location ~ ^/api/v1/auth/(register|login|refresh)$ {
        limit_req zone=auth_requests burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/api/v1(/auth/.+)$ $1 break;
        proxy_pass $auth_upstream;
    }
    location ~ ^/(swagger-ui[./]|v3/api-docs) {
        proxy_pass $auth_upstream;
    }
    location / { return 404; }
}
