services:
  prometheus:
    volumes:
      - ./auth/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: auth-db:5432/auth?sslmode=disable
      DATA_SOURCE_USER: auth
      DATA_SOURCE_PASS: ${DB_PASSWORD:?set DB_PASSWORD}
    mem_limit: 64m
    restart: unless-stopped
  grafana:
    volumes:
      - ./auth/dashboards:/var/lib/grafana/dashboards:ro
