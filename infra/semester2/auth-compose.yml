name: itmo-auth
services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - standalone-auth-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, auth, -d, auth]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 160m
    restart: unless-stopped
  auth-service:
    image: ${IMAGE_PREFIX:-itmo-backend}/auth-service:${IMAGE_TAG:-standalone}
    entrypoint: [java, -Xms32m, -Xmx160m, -XX:MaxMetaspaceSize=144m, -XX:ReservedCodeCacheSize=32m, -XX:MaxDirectMemorySize=24m, -XX:+ExitOnOutOfMemoryError, -jar, /app/app.jar]
    environment:
      SPRING_PROFILES_ACTIVE: standalone-auth
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://auth-db:5432/auth
      DB_USERNAME: auth
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MANAGEMENT_SERVER_PORT: 9091
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9091/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    mem_limit: 448m
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - 127.0.0.1:18083:8080
    volumes:
      - ./auth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
    mem_limit: 32m
    restart: unless-stopped
volumes:
  standalone-auth-db: {}
