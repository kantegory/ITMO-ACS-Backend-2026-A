        max-file: '3'
    image: ${IMAGE_PREFIX:-itmo-backend}/api-gateway:${IMAGE_TAG:-local}
    mem_limit: 448m
    cpus: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9091/actuator/health/readiness >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    ports:
    - 127.0.0.1:${GATEWAY_PORT:-18082}:8080
  nginx:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:${HTTP_PORT:-18080}:8080
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 32m
    restart: unless-stopped
volumes:
  kafka-data: {}
  application-db-data: {}
  auth-db-data: {}
  company-db-data: {}
  interaction-db-data: {}
  notification-db-data: {}
  resume-db-data: {}
  elasticsearch-data: {}
  user-db-data: {}
  vacancy-db-data: {}
