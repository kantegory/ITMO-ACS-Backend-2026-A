name: itmo-semester2
services:
  kafka-volume-init:
    image: apache/kafka:3.8.0
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    mem_limit: 32m
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms192m -Xmx192m
      KAFKA_LOG_CLEANER_ENABLE: 'false'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - bash -lc 'echo > /dev/tcp/localhost/9092'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    mem_limit: 512m
    cpus: 1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
  application-db:
    image: postgres:17
    environment:
      POSTGRES_DB: application_db
      POSTGRES_USER: application
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in secrets.env}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U application -d application_db
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - application-db-data:/var/lib/postgresql/data
    mem_limit: 96m
    cpus: 0.5
    command:
    - postgres
    - -c
    - shared_buffers=16MB
    - -c
    - max_connections=30
  application-service:
    build:
      context: ../../БР1.2/Алексеев Андрей/labs/lab23/application-service
    entrypoint:
    - java
    - -Xms32m
    - -Xmx192m
    - -XX:MaxMetaspaceSize=128m
    - -XX:MaxDirectMemorySize=32m
    - -XX:ReservedCodeCacheSize=48m
    - -XX:ActiveProcessorCount=2
    - -jar
    - /app/app.jar
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://application-db:5432/application_db
      DB_USERNAME: application
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in secrets.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in secrets.env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in secrets.env}
      RESUME_URL: http://resume-service:8086
      VACANCY_URL: http://vacancy-service:8084
      MANAGEMENT_SERVER_PORT: 9091
    depends_on:
      application-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${IMAGE_PREFIX:-itmo-backend}/application-service:${IMAGE_TAG:-local}
    mem_limit: 448m
    cpus: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9091/actuator/health/readiness >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
