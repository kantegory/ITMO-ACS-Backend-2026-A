global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: node
  static_configs:
  - targets:
    - node-exporter:9100
- job_name: microservices
  metrics_path: /actuator/prometheus
  static_configs:
  - targets:
    - application-service:9091
    labels:
      service: application-service
  - targets:
    - auth-service:9091
    labels:
      service: auth-service
  - targets:
    - company-service:9091
    labels:
      service: company-service
  - targets:
    - interaction-service:9091
    labels:
      service: interaction-service
  - targets:
    - notification-service:9091
    labels:
      service: notification-service
  - targets:
    - resume-service:9091
    labels:
      service: resume-service
  - targets:
    - search-service:9091
    labels:
      service: search-service
  - targets:
    - user-service:9091
    labels:
      service: user-service
  - targets:
    - vacancy-service:9091
    labels:
      service: vacancy-service
  - targets:
    - api-gateway:9091
    labels:
      service: api-gateway
