groups:
- name: availability
  rules:
  - alert: MicroserviceUnavailable
    expr: up{job="microservices"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} unavailable'
  - alert: HostMemoryPressure
    expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
    for: 5m
    labels:
      severity: warning
