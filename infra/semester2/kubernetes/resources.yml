apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-service
  namespace: itmo-backend
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: application-service
      metrics: spring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: application-service
        image: ghcr.io/pxdkxvan/itmo-backend/application-service:REPLACE_SHA
        ports:
        - containerPort: 8087
        - name: management
          containerPort: 9091
        env:
        - name: SERVER_PORT
          value: '8087'
        - name: DB_URL
          value: jdbc:postgresql://application-db:5432/application_db
        - name: DB_USERNAME
          value: application
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SERVICE_TOKEN
        - name: RESUME_URL
          value: http://resume-service:8086
        - name: VACANCY_URL
          value: http://vacancy-service:8084
        - name: MANAGEMENT_SERVER_PORT
          value: '9091'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9091
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          periodSeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
