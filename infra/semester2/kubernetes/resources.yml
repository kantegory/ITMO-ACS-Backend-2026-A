apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: itmo-backend
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: &id001
      app: kafka
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: kafka
        image: apache/kafka:3.8.0
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_HEAP_OPTS
          value: -Xms192m -Xmx192m
        - name: KAFKA_LOG_CLEANER_ENABLE
          value: 'false'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka:9093
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'true'
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: KAFKA_LOG_DIRS
          value: /tmp/kraft-combined-logs
        ports:
        - containerPort: 9092
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /tmp/kraft-combined-logs
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 20
          periodSeconds: 10
      automountServiceAccountToken: false
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: itmo-backend
spec:
  selector:
    app: kafka
  ports:
  - name: tcp
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: application-db
  namespace: itmo-backend
spec:
  serviceName: application-db
  replicas: 1
  selector:
    matchLabels: &id001
      app: application-db
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: application-db
        image: postgres:17
        env:
        - name: POSTGRES_DB
          value: application_db
        - name: POSTGRES_USER
          value: application
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 20
          periodSeconds: 10
        args:
        - -c
        - shared_buffers=16MB
        - -c
        - max_connections=30
      automountServiceAccountToken: false
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
