  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: &id001
      app: elasticsearch
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
        - name: discovery.type
          value: single-node
        - name: node.roles
          value: master,data,ingest
        - name: node.store.allow_mmap
          value: 'false'
        - name: xpack.security.enabled
          value: 'false'
        - name: xpack.ml.enabled
          value: 'false'
        - name: xpack.watcher.enabled
          value: 'false'
        - name: xpack.profiling.enabled
          value: 'false'
        - name: xpack.apm_data.enabled
          value: 'false'
        - name: xpack.monitoring.collection.enabled
          value: 'false'
        - name: ingest.geoip.downloader.enabled
          value: 'false'
        - name: cluster.routing.allocation.disk.threshold_enabled
          value: 'false'
        - name: bootstrap.memory_lock
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms192m -Xmx192m -XX:MaxDirectMemorySize=64m -Dorg.elasticsearch.nativeaccess.enableVectorLibrary=false
        ports:
        - containerPort: 9200
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        readinessProbe:
          tcpSocket:
            port: 9200
          initialDelaySeconds: 20
          periodSeconds: 10
      automountServiceAccountToken: false
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
