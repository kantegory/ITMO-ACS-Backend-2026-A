apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: itmo-backend
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    metrics: spring
  ports:
  - name: metrics
    port: 9091
    targetPort: 9091
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-prometheus
  namespace: itmo-backend
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nscrape_configs:\n- job_name: microservices\n\
    \  metrics_path: /actuator/prometheus\n  dns_sd_configs:\n  - names:\n    - _metrics._tcp.backend-metrics.itmo-backend.svc\n\
    \    type: SRV\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-prometheus
  namespace: itmo-backend
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: backend-prometheus
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v3.2.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --storage.tsdb.retention.size=256MB
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
      volumes:
      - name: config
        configMap:
          name: backend-prometheus
      - name: data
        emptyDir:
          sizeLimit: 512Mi
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: backend-prometheus
  namespace: itmo-backend
spec:
  selector:
    app: backend-prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-grafana
  namespace: itmo-backend
data:
  datasources.yml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  uid: prometheus\n\
    \  type: prometheus\n  access: proxy\n  url: http://backend-prometheus:9090\n\
    \  isDefault: true\n"
  dashboards.yml: "apiVersion: 1\nproviders:\n- name: ITMO\n  type: file\n  options:\n\
    \    path: /var/lib/grafana/dashboards\n"
  kubernetes.json: "{\n  \"uid\": \"itmo-cloud\",\n  \"title\": \"ITMO Backend · Kubernetes\"\
    ,\n  \"schemaVersion\": 40,\n  \"refresh\": \"15s\",\n  \"time\": {\n    \"from\"\
    : \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\"\
    : 1,\n      \"title\": \"CPU процесса по pod\",\n      \"type\": \"timeseries\"\
    ,\n      \"datasource\": {\n        \"uid\": \"prometheus\"\n      },\n      \"\
    gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n     \
    \   \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\":\
    \ \"A\",\n          \"expr\": \"100 * process_cpu_usage\"\n        }\n      ],\n\
    \      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\"\
    \n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\"\
    : 2,\n      \"title\": \"JVM heap по pod\",\n      \"type\": \"timeseries\",\n\
    \      \"datasource\": {\n        \"uid\": \"prometheus\"\n      },\n      \"\
    gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n    \
    \    \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"sum by (application, instance) (jvm_memory_used_bytes{area=\\\
    \"heap\\\"})\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n  \
    \    }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Запросы в секунду\"\
    ,\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"uid\":\
    \ \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"\
    y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n\
    \        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by(application)\
    \ (rate(http_server_requests_seconds_count{uri!~\\\"/actuator.*\\\"}[2m]))\"\n\
    \        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n    \
    \      \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      }\n \
    \   },\n    {\n      \"id\": 4,\n      \"title\": \"HTTP p95\",\n      \"type\"\
    : \"timeseries\",\n      \"datasource\": {\n        \"uid\": \"prometheus\"\n\
    \      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n     \
    \   \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.95, sum\
    \ by(application,le) (rate(http_server_requests_seconds_bucket{uri!~\\\"/actuator.*\\\
    \"}[2m])))\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      }\n\
    \    },\n    {\n      \"id\": 5,\n      \"title\": \"HTTP 5xx\",\n      \"type\"\
    : \"timeseries\",\n      \"datasource\": {\n        \"uid\": \"prometheus\"\n\
    \      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 16,\n     \
    \   \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"expr\": \"sum by(application) (rate(http_server_requests_seconds_count{status=~\\\
    \"5..\\\"}[2m]))\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"\
    defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\"\
    : []\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Pod с доступными\
    \ метриками\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n   \
    \     \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\":\
    \ 12,\n        \"y\": 16,\n        \"w\": 12,\n        \"h\": 8\n      },\n  \
    \    \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"sum by(application) (process_uptime_seconds > bool 0)\"\n        }\n     \
    \ ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"\
    short\"\n        },\n        \"overrides\": []\n      }\n    }\n  ]\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-grafana
  namespace: itmo-backend
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: backend-grafana
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: grafana
        image: grafana/grafana:11.6.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: GRAFANA_PASSWORD
        volumeMounts:
        - name: provision
          mountPath: /etc/grafana/provisioning/datasources/default.yml
          subPath: datasources.yml
        - name: provision
          mountPath: /etc/grafana/provisioning/dashboards/default.yml
          subPath: dashboards.yml
        - name: provision
          mountPath: /var/lib/grafana/dashboards/kubernetes.json
          subPath: kubernetes.json
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      volumes:
      - name: provision
        configMap:
          name: backend-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: backend-grafana
  namespace: itmo-backend
spec:
  selector:
    app: backend-grafana
  ports:
  - port: 3000
    targetPort: 3000
