$kind: http-request
url: "{{baseUrl}}/recipes/{{recipeId}}/comments"
method: POST
body:
  type: json
  content: '{ "text": "Очень вкусно!" }'
auth:
  type: bearer
  credentials:
    token: "{{authorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Статус 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Текст комментария сохранился", function () {
          pm.expect(pm.response.json().text).to.eql("Очень вкусно!");
      });
    language: text/javascript
order: 4501266880204729
