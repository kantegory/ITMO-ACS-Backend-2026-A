$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
body:
  type: json
  content: |-
    {
      "username": "Dima{{runId}}",
      "email": "Dima{{runId}}@gmail.com",
      "password": "qwerty123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Статус 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Пользователь создан, пароля в ответе нет", function () {
          const user = pm.response.json();
          pm.expect(user.username).to.eql("author_" + pm.collectionVariables.get("runId"));
          pm.expect(user).to.not.have.property("password");
          pm.collectionVariables.set("authorId", user.id);
      });
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("runId", Date.now());
    language: text/javascript
examples: .resources/регистрация.resources/examples
order: 1790303395802
