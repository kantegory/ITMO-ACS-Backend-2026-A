$kind: http-request
url: "{{baseUrl}}/recipes?author_id={{authorId}}&dish_type=SOUP"
method: GET
queryParams:
  author_id: "{{authorId}}"
  dish_type: SOUP
scripts:
  - type: afterResponse
    code: |-
      pm.test("Статус 200", function () {
          pm.response.to.have.status(200);
      });

      // выбираем случайный рецепт из найденных
      const items = pm.response.json().items;
      const randomRecipe = items[Math.floor(Math.random() * items.length)];
      pm.collectionVariables.set("recipeId", randomRecipe.id);
    language: text/javascript
order: 4258687863984024
