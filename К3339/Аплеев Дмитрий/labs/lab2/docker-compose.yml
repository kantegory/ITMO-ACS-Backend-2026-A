services:

    user-db:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: user_db
        volumes:
            - user-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    recipe-db:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: recipe_db
        volumes:
            - recipe-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    social-db:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: social_db
        volumes:
            - social-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10


    rabbitmq:
        image: rabbitmq:3-management
        hostname: rabbitmq
        user: rabbitmq
        ports:
            - '127.0.0.1:15672:15672'
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            timeout: 10s
            retries: 10

    user-service:
        build: ./user-service 
        environment:
            APP_HOST: 0.0.0.0 
            APP_PORT: 3001
            DB_HOST: user-db
            DB_PORT: 5432
            DB_NAME: user_db
            DB_USER: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            DB_ENTITIES: dist/models/*.entity.js
            DB_SUBSCRIBERS: dist/models/*.subscriber.js
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_ACCESS_TOKEN_LIFETIME: 3600
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
        depends_on:
            user-db:
                condition: service_healthy

    recipe-service:
        build: ./recipe-service
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 3002
            DB_HOST: recipe-db
            DB_PORT: 5432
            DB_NAME: recipe_db
            DB_USER: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            DB_ENTITIES: dist/models/*.entity.js
            DB_SUBSCRIBERS: dist/models/*.subscriber.js
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            SOCIAL_SERVICE_URL: http://social-service:3003/api
            RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
        depends_on:
            recipe-db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    social-service:
        build: ./social-service
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 3003
            DB_HOST: social-db
            DB_PORT: 5432
            DB_NAME: social_db
            DB_USER: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            DB_ENTITIES: dist/models/*.entity.js
            DB_SUBSCRIBERS: dist/models/*.subscriber.js
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            USER_SERVICE_URL: http://user-service:3001/api
            RECIPE_SERVICE_URL: http://recipe-service:3002/api
            RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
        depends_on:
            social-db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    bff-service:
        build: ./bff-service
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 3004
            INTERNAL_API_KEY: ${INTERNAL_API_KEY}
            USER_SERVICE_URL: http://user-service:3001/api
            RECIPE_SERVICE_URL: http://recipe-service:3002/api
            SOCIAL_SERVICE_URL: http://social-service:3003/api
        ports:
            - '127.0.0.1:3004:3004'
        depends_on:
            - user-service
            - recipe-service
            - social-service
volumes:
    user-db-data:
    recipe-db-data:
    social-db-data: