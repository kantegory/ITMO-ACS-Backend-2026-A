services:
  rabbitmq:
    image: 'rabbitmq:3-management'
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 20
  auth-db:
    image: 'postgres:16'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD:-123}'
      POSTGRES_DB: auth_db
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - 'auth_data:/var/lib/postgresql/data'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d auth_db'
      interval: 3s
      timeout: 3s
      retries: 20
  recipe-db:
    image: 'postgres:16'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD:-123}'
      POSTGRES_DB: recipe_db
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - 'recipe_data:/var/lib/postgresql/data'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d recipe_db'
      interval: 3s
      timeout: 3s
      retries: 20
  comment-db:
    image: 'postgres:16'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD:-123}'
      POSTGRES_DB: comment_db
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - 'comment_data:/var/lib/postgresql/data'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d comment_db'
      interval: 3s
      timeout: 3s
      retries: 20
  auth-service:
    build: .
    command: 'node dist/auth-service/src/index.js'
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JWT_SECRET: '${JWT_SECRET:?Set JWT_SECRET in .env}'
      INTERNAL_TOKEN: '${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}'
      DB_PASSWORD: '${DB_PASSWORD:-123}'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - 'fetch(''http://localhost:8081/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 3s
      timeout: 4s
      retries: 20
  recipe-service:
    build: .
    command: 'node dist/recipe-service/src/index.js'
    ports:
      - '127.0.0.1:8082:8082'
    depends_on:
      recipe-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JWT_SECRET: '${JWT_SECRET:?Set JWT_SECRET in .env}'
      INTERNAL_TOKEN: '${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}'
      DB_PASSWORD: '${DB_PASSWORD:-123}'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - 'fetch(''http://localhost:8082/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 3s
      timeout: 4s
      retries: 20
  comment-service:
    build: .
    command: 'node dist/comment-service/src/index.js'
    ports:
      - '127.0.0.1:8083:8083'
    depends_on:
      comment-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JWT_SECRET: '${JWT_SECRET:?Set JWT_SECRET in .env}'
      INTERNAL_TOKEN: '${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}'
      DB_PASSWORD: '${DB_PASSWORD:-123}'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - 'fetch(''http://localhost:8083/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 3s
      timeout: 4s
      retries: 20
  api-gateway:
    image: 'nginx:latest'
    ports:
      - '8000:80'
    volumes:
      - './nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      auth-service:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
    restart: unless-stopped
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - '127.0.0.1:3001:8080'
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - './openapi.yaml:/openapi.yaml:ro'
    restart: unless-stopped
volumes:
  auth_data: null
  recipe_data: null
  comment_data: null
