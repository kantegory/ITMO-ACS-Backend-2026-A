# ЛР7, Зотеев Максим БР1.1: образ сервиса аренды для UpCloud Kubernetes.
# При изменении кода ЛР2 или Dockerfile ЛР7 собирается один образ для всех компонентов
# и публикуется в GHCR. Манифесты ЛР7 ссылаются на него по digest (k8s/.build/image).

name: Образ сервиса аренды для ЛР7 (Зотеев Максим)

on:
  push:
    branches: [main]
    paths:
      - "БР1.1/Зотеев Максим/labs/lab2/**"
      - "БР1.1/Зотеев Максим/labs/lab7/k8s/Dockerfile"
      - ".github/workflows/rental-image.yml"
      - "!**/*.docx"
      - "!**/*.pdf"
  workflow_dispatch:

concurrency:
  group: rental-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  LAB2_DIR: БР1.1/Зотеев Максим/labs/lab2
  DOCKERFILE: БР1.1/Зотеев Максим/labs/lab7/k8s/Dockerfile

jobs:
  image:
    name: Сборка и публикация образа
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rental-lab7
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=rental-lab7
            org.opencontainers.image.description=Сервис аренды недвижимости (ЛР2) для UpCloud Kubernetes (ЛР7)

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.LAB2_DIR }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest для манифестов
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/rental-lab7@${DIGEST}"
          echo "$image"
          {
            echo "### Образ ЛР7"
            echo
            echo "\`$image\`"
            echo
            echo "Для развёртывания: \`echo '$image' > k8s/.build/image\`"
          } >> "$GITHUB_STEP_SUMMARY"
