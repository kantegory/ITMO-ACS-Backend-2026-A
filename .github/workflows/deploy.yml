# trigger
name: Deploy to server,hw6

on:
  push:
    branches:
      - lab4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /opt/yriy_project/ITMO-ACS-Backend-2026-A/БР1.2/Михайлов_Юрий/labs/lab4
            bash deploy.sh
