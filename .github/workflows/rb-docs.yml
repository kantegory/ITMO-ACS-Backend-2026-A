# ДЗ9 (Якшин Артемий, БР1.1): сборка документации MkDocs и публикация в GitHub Pages.
# --strict: битая ссылка, отсутствующая страница или ошибка в nav роняют сборку.
name: rb-docs

on:
  push:
    branches: [main]
    paths:
      - "**/homeworks/hw9/**"
      - "**/labs/lab2/gateway/openapi.yaml"
      - "**/homeworks/hw4/openapi-internal.yaml"
      - ".github/workflows/rb-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'cicada-pops/itmo-backend-sem2'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "БР1.1/Якшин Артемий/homeworks/hw9/docs-site"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "БР1.1/Якшин Артемий/homeworks/hw9/docs-site/requirements.txt"
      - run: pip install -r requirements.txt
      - name: Build (mkdocs --strict)
        run: ./build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "БР1.1/Якшин Артемий/homeworks/hw9/docs-site/site"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
