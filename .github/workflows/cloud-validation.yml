name: Ephemeral Kubernetes validation

on:
  push:
    branches: [main, feat/cloud-course-labs]
    paths:
      - '.github/workflows/cloud-validation.yml'
      - 'БР1.2/Васильев Артём/labs/lab7/cloud/**'
      - 'БР1.2/Васильев Артём/labs/lab8/**'
      - 'БР1.2/Васильев Артём/homeworks/hw8/ci/**'
      - 'БР1.2/Васильев Артём/homeworks/hw9/**'
      - 'БР1.2/Васильев Артём/homeworks/hw10/**'
      - '!**/*.md'
      - '!**/*.pdf'
      - '!**/docs/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUD_DIR: 'БР1.2/Васильев Артём/labs/lab7/cloud'
      CI_DIR: 'БР1.2/Васильев Артём/homeworks/hw8/ci'
      MKDOCS_SITE_URL: 'http://127.0.0.1:30080/docs/'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate configuration and documentation
        run: |
          python3 -m pip install 'PyYAML==6.0.3' 'mkdocs==1.6.1'
          python3 -m unittest discover -s "$CLOUD_DIR/tests" -v
          python3 -m unittest discover -s 'БР1.2/Васильев Артём/labs/lab8/tests' -v
          python3 -m mkdocs build --strict --config-file 'БР1.2/Васильев Артём/homeworks/hw9/mkdocs.yml'
      - name: Create isolated Kubernetes cluster
        run: bash "$CI_DIR/setup.sh"
      - name: Build and deploy all seven services
        run: bash "$CI_DIR/build-deploy.sh"
      - name: Verify API, documentation, recovery and backups
        run: bash "$CI_DIR/acceptance.sh"
      - name: Start and verify observability
        run: bash "$CI_DIR/monitoring.sh"
      - name: Run load profiles, HPA and resource tuning
        run: bash "$CI_DIR/load.sh"
      - name: Capture final metrics and browser evidence
        run: bash "$CI_DIR/evidence.sh"
      - name: Collect safe diagnostics
        if: always()
        run: bash "$CI_DIR/collect.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/cloud-results
          retention-days: 14
          if-no-files-found: error
      - name: Remove ephemeral cluster
        if: always()
        run: bash "$CI_DIR/cleanup.sh"
